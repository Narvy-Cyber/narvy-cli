name: Platform install check

# Installs the built wheel the way a new user does (pip install --user, the
# Scripts/bin directory left off PATH) on Windows, macOS and Linux, then runs
# real scans: a source repo and an APK whose name and folder contain spaces.
# Test only: nothing is built for release or published from this workflow.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  install-and-scan:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: wheel
      - name: pip install --user (as a new user would)
        run: python -m pip install --user wheel/*.whl
      - name: Real scans through python -m narvy
        run: python tools/ci/platform_check.py
