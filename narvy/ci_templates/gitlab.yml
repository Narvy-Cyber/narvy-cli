# Narvy SAST for GitLab CI. Written by `narvy init-ci --gitlab`; edit freely.
# Already have a .gitlab-ci.yml? Copy the narvy_sast and narvy_gate jobs below into it instead of overwriting.
# gl-sast-report.json follows GitLab's SAST report schema and is declared under
# artifacts:reports:sast: GitLab shows the findings in the merge request and the
# pipeline Security tab (GitLab Ultimate; on Free and Premium it is a downloadable artifact).
# GitLab reads a security report only from a job that succeeds, so narvy_sast
# records the --fail-on exit code and narvy_gate fails the pipeline with it.
# The dependency check downloads the OSV database (npm alone is about 220 MB).
# GitLab caches only paths inside the project, so it lives in .narvy-osv/ (dot
# folders are not scanned). GitLab has no date variable for a cache key: the key
# is fixed and the CLI itself refreshes a copy older than 24 h, which this job
# then saves back (when: always).
# With a masked NARVY_TOKEN CI/CD variable (narvy.io > Profile > API Credentials),
# --upload also sends the findings (never code) to your Narvy dashboard. Without
# it, the scan stays local. --upload needs a paid plan (Starter and up): on
# Community it fails the pipeline (exit 4, HTTP 403), so set NARVY_TOKEN only on
# a paid account.
stages:
  - test

narvy_sast:
  stage: test
  image: python:3.11-slim
  variables:
    NARVY_OSV_DB_DIR: "$CI_PROJECT_DIR/.narvy-osv"
  cache:
    key: narvy-osv
    paths:
      - .narvy-osv/
    when: always
  before_script:
    - pip install --upgrade pip
    - pip install "narvy-cli>=1.3.0"
  script:
    - narvy scan . --output gitlab --file gl-sast-report.json ${NARVY_TOKEN:+--upload} --fail-on high || echo $? > narvy-exit-code
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
      - narvy-exit-code
    expire_in: 1 week

narvy_gate:
  stage: .post
  image: alpine:latest
  needs:
    - job: narvy_sast
      artifacts: true
  script:
    - if [ -f narvy-exit-code ]; then exit "$(cat narvy-exit-code)"; fi
    - echo "Nothing at or above the --fail-on threshold."
