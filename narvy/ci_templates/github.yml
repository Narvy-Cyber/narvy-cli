# Narvy SAST for GitHub Actions. Written by `narvy init-ci --github`; edit freely.
# Scans this repo, uploads SARIF to the Security tab, and fails the build on --fail-on.
name: Narvy SAST

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning

jobs:
  narvy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Narvy CLI
        run: |
          python -m pip install --upgrade pip
          pip install narvy-cli

      # The dependency check downloads the OSV database (npm alone is about 220 MB).
      # Kept in the Actions cache, one key per UTC day; the CLI refreshes a copy older than 24 h.
      - name: UTC day for the OSV database cache key
        id: osv_day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the OSV database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/narvy/osv
          key: narvy-osv-${{ steps.osv_day.outputs.day }}
          restore-keys: narvy-osv-

      - name: Run Narvy scan
        # SARIF is written before the --fail-on gate, so the Security tab fills even on a failing build.
        # With a NARVY_TOKEN repository secret (narvy.io > Profile > API Credentials), --upload also
        # sends the findings (never code) to your Narvy dashboard. Without it, the scan stays local.
        # --upload needs a paid plan (Starter and up): on Community it fails the build (exit 4, HTTP 403),
        # so set NARVY_TOKEN only on a paid account.
        # Secrets are not passed to pull requests from forks: those runs stay local.
        env:
          NARVY_TOKEN: ${{ secrets.NARVY_TOKEN }}
        run: |
          narvy scan . \
            --output sarif \
            --file narvy-results.sarif \
            --fail-on high \
            ${NARVY_TOKEN:+--upload}

      - name: Save the OSV database cache
        if: always()   # also when --fail-on failed the build
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/narvy/osv
          key: narvy-osv-${{ steps.osv_day.outputs.day }}

      - name: Upload SARIF to GitHub code scanning
        if: always()   # upload even when the scan step failed the build via --fail-on
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: narvy-results.sarif

# To also scan a web app URL, add a step:
#   - run: narvy web-scan "https://staging.example.com" --format sarif --output-file web.sarif --fail-on high
