# Narvy SAST for Bitbucket Pipelines. Written by `narvy init-ci --bitbucket`; edit freely.
# Already have a bitbucket-pipelines.yml? Copy the step and the cache definition below into it instead of overwriting.
# SARIF is kept as a build artifact (not Code Insights); --fail-on still fails the build.
# With a secured NARVY_TOKEN repository variable (narvy.io > Profile > API Credentials),
# --upload also sends the findings (never code) to your Narvy dashboard. Without it,
# the scan stays local. --upload needs a paid plan (Starter and up): on Community it
# fails the build (exit 4, HTTP 403), so set NARVY_TOKEN only on a paid account.
# The dependency check downloads the OSV database (npm alone is about 220 MB) into
# ~/.cache/narvy/osv, cached as narvy-osv. Bitbucket keeps a cache 7 days and does not
# replace it before then, and saves it only when the step succeeds: the CLI downloads a newer copy when the cached one is older
# than 24 h, and uses the cached copy if that download fails.
image: python:3.11

definitions:
  caches:
    narvy-osv: ~/.cache/narvy/osv

pipelines:
  default:
    - step:
        name: Narvy SAST
        caches:
          - narvy-osv
        script:
          - pip install --upgrade pip
          - pip install narvy-cli
          - narvy scan . --output sarif --file narvy-results.sarif --fail-on high ${NARVY_TOKEN:+--upload}
        artifacts:
          - narvy-results.sarif
