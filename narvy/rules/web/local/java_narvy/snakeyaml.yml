rules:

# SnakeYAML: default `new Yaml()` uses the unrestricted `Constructor`, an RCE gadget on attacker-controlled YAML.

- id: narvy.java.deserialization.snakeyaml-unsafe-constructor.snakeyaml-unsafe-constructor
  message: >-
    A SnakeYAML `Yaml` built with the default constructor parses input with
    the unrestricted `Constructor`, which will instantiate any Java type the
    document names through a `!!package.Class` tag. On attacker-controlled
    YAML this is a deserialization gadget that leads to remote code execution
    (CWE-502). Construct the parser with `new Yaml(new SafeConstructor(new
    LoaderOptions()))` (or a `Constructor` restricted to an explicit
    allow-list of expected types) before calling `load`.
  severity: ERROR
  languages: [java]
  metadata:
    category: security
    cwe:
      - "CWE-502: Deserialization of Untrusted Data"
    owasp:
      - "A08:2021 - Software and Data Integrity Failures"
    subcategory: [vuln]
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology: [java, snakeyaml]
  patterns:
    - pattern-inside: |
        Yaml $Y = new Yaml();
        ...
    - pattern-either:
        - pattern: $Y.load($SRC)
        - pattern: $Y.loadAll($SRC)
        - pattern: $Y.loadAs($SRC, ...)
