- id: narvy.go.crypto.math-random-used.math-random-used
  message: '`math/rand` used to generate a value. `math/rand`''s default source is not cryptographically secure and is predictable
    once seeded - using it for anything security-sensitive (tokens, session IDs, password reset codes, nonces, keys) lets
    an attacker predict or brute-force the value (CWE-338). Use `crypto/rand` for anything security-sensitive; this broad
    detector deliberately also fires on non-sensitive uses (jitter, load-balancing, retry backoff), which you can treat
    as advisory. Covers both the classic `math/rand` API
    (`rand.Intn`/`.Int63`/`.Int31`/`.Float64`/`.Int`) and `math/rand/v2`''s generic form (`rand.N`/`.IntN`/`.Int32N`/ `.Int64N`/`.Uint32N`/`.Uint64N`/...)
    via a `$FUNC` wildcard instead of a fixed identifier list, and matches through an import alias (`mathrand "math/rand"`
    then `mathrand.Int63()`) by binding the alias from the import statement itself rather than assuming the package is always
    referenced as literal `rand`.'
