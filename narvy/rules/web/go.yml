  message: 'Dynamic SQL: `fmt.Sprintf` builds the query, then the result is passed to `db.Query`/`db.Exec`. Format-string
    quoting is not driver escaping. This is a code-smell audit signal (HIGH), not a proven CRITICAL: the interpolated
