- id: narvy.go.http.plaintext-server-no-tls-anywhere.plaintext-server-no-tls-anywhere
  message: 'An HTTP server is started with no TLS involved at all - either http.ListenAndServe() (the plaintext entry point,
    as opposed to http.ListenAndServeTLS()) or an *http.Server started via .ListenAndServe() on a Server value that never
    had a TLSConfig set. Every request and response on this listener, including any auth cookie, bearer token, or session
    id, crosses the wire unencrypted and can be read or tampered with by anyone on the network path (CWE-319: Cleartext Transmission
    of Sensitive Information). Switch to ListenAndServeTLS()/set TLSConfig, or if TLS is deliberately terminated in front
    of this listener (a reverse proxy, a service mesh sidecar, a Unix socket only reachable locally), suppress this finding
    with a comment explaining that.'
