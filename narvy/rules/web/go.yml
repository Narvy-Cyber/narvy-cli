    entirely. Any certificate - including one presented by an attacker-in-the-middle - will be accepted, defeating the point
    of TLS (CWE-295). Remove the field (defaults to verifying) or, for pinning use cases, implement `VerifyConnection`/`VerifyPeerCertificate`
    instead.'
