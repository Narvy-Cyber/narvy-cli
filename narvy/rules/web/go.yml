- id: narvy-go-sqli-request-taint
  mode: taint
  message: 'SQL injection (taint-proven): a value read from the HTTP request reaches a `db.Query`/`Exec`/`QueryRow`
    (or sqlx) call as part of a dynamically-built query string, not as a bound `?`/`$1` parameter. The attacker
    controls SQL syntax (CWE-89). Bind the value: `db.Query("... WHERE id = ?", id)`.'
  severity: ERROR
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    technology:
    - go
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.Query()
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Form.Get(...)
      - pattern: $R.PostForm.Get(...)
      - pattern: $R.Header.Get(...)
      - pattern: $C.Param(...)
      - pattern: $C.PostForm(...)
      - pattern: $C.QueryParam(...)
      - pattern: $C.DefaultQuery(...)
      - pattern: $C.GetHeader(...)
      - pattern: $C.Params(...)
      - pattern: mux.Vars($R)[...]
      - pattern: chi.URLParam(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $DB.Query($X)
      - pattern: $DB.QueryContext($C, $X)
      - pattern: $DB.QueryRow($X)
      - pattern: $DB.QueryRowContext($C, $X)
      - pattern: $DB.Exec($X)
      - pattern: $DB.ExecContext($C, $X)
      - pattern: $DB.Queryx($X)
      - pattern: $DB.QueryxContext($C, $X)
      - pattern: $DB.MustExec($X)
    - pattern-not: $DB.Query("...")
    - pattern-not: $DB.QueryContext($C, "...")
    - pattern-not: $DB.QueryRow("...")
    - pattern-not: $DB.QueryRowContext($C, "...")
    - pattern-not: $DB.Exec("...")
    - pattern-not: $DB.ExecContext($C, "...")
    - pattern-not: $DB.Queryx("...")
    - pattern-not: $DB.QueryxContext($C, "...")
    - pattern-not: $DB.MustExec("...")
