- id: narvy.go.ssh.insecure-hostkey-callback.insecure-hostkey-callback
  message: 'golang.org/x/crypto/ssh.InsecureIgnoreHostKey() accepts whatever host key the remote end presents, with no verification
    at all. Anyone able to sit on the network path between this client and the SSH server can present their own key and the
