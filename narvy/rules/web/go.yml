- id: narvy.go.deserialization.tar-entry-unbounded-copy.tar-entry-unbounded-copy
  message: A `tar.Reader` entry is copied out with `io.Copy()` and no size limit anywhere in the copy path. `header.Size`
    from the tar header is attacker-controlled and is not enforced by `tar.Reader.Read()` in any way - a crafted tar stream
    can present a small on-disk archive that unpacks to gigabytes on this entry alone, exhausting disk/memory (decompression
    bomb, CWE-409). Cap the copy with `io.CopyN($DST, tarReader, maxEntrySize)` or wrap the destination/source in `io.LimitReader`
    sized off a fixed maximum before copying.
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-409: Improper Handling of Highly Compressed Data (Data Amplification)'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern: '$TR := tar.NewReader(...)

      ...

      io.Copy($DST, $TR)

      '
  - pattern-not: '$TR := tar.NewReader(...)

      ...

      io.Copy($DST, io.LimitReader($TR, ...))

      '
  - pattern-not: '$TR := tar.NewReader(...)

      ...

      io.CopyN($DST, $TR, ...)

      '
- id: narvy.go.deserialization.zip-entry-unbounded-copy.zip-entry-unbounded-copy
  message: A `*zip.File` entry is opened and its content copied out with `io.Copy()` with no size limit enforced during the
    copy itself. The entry's declared `UncompressedSize64` in the zip central directory is just a header field an attacker
    fully controls - it is not checked by `zip.File.Open()`/`Read()`, so even code that pre-checks the declared size against
    free disk space is still exposed to a stream that decompresses to far more bytes than it claims (decompression bomb, CWE-409).
    Cap the copy with `io.CopyN()` or wrap the entry reader in `io.LimitReader(entryReader, maxEntrySize)` before copying,
    and treat a truncated/limited read as an error, not a success.
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-409: Improper Handling of Highly Compressed Data (Data Amplification)'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: "for $_, $ZF := range $ZR.File {\n  ...\n}\n"
      - pattern: '$RC, $ERR := $ZF.Open()

          ...

          io.Copy($DST, $RC)

          '
      - pattern-not: '$RC, $ERR := $ZF.Open()

          ...

          io.Copy($DST, io.LimitReader($RC, ...))

          '
      - pattern-not: '$RC, $ERR := $ZF.Open()

          ...

          io.CopyN($DST, $RC, ...)

          '
    - patterns:
      - pattern: "func($P *zip.File) $RET {\n  ...\n  $RC, $ERR := $P.Open()\n  ...\n  io.Copy($DST, $RC)\n  ...\n}\n"
      - pattern-not: "func($P *zip.File) $RET {\n  ...\n  $RC, $ERR := $P.Open()\n  ...\n  io.Copy($DST, io.LimitReader($RC,\
          \ ...))\n  ...\n}\n"
      - pattern-not: "func($P *zip.File) $RET {\n  ...\n  $RC, $ERR := $P.Open()\n  ...\n  io.CopyN($DST, $RC, ...)\n  ...\n\
          }\n"
