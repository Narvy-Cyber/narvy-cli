  message: 'Dynamic SQL: `db.QueryRow()` / `db.Exec()` called with a query string built by concatenation or `fmt.Sprintf`
    instead of using a `?`/`$1` placeholder with a separate argument. Code-smell audit signal (HIGH), not a proven
