# Go security rules, authored by Narvy.
# Injection, path traversal, SSRF, CORS, cookies, weak crypto, secrets.

rules:
- id: narvy.go.auth.insecure-string-compare-secret.insecure-string-compare-secret
  message: A secret/token/signature/HMAC comparison uses `==` (or `strings.Compare`) instead of a constant-time comparison.
    `==` short-circuits on the first mismatched byte, so response timing leaks how many leading bytes were correct - a timing
    side-channel an attacker can use to recover the secret byte-by-byte (CWE-208). Use `subtle.ConstantTimeCompare()` or `hmac.Equal()`.
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-208: Observable Timing Discrepancy'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern-either:
    - pattern: $SIG == $EXPECTED
  - metavariable-regex:
      metavariable: $SIG
      regex: (?i).*(sig|signature|hmac|mac|token|secret)$
  - pattern-not: $SIG == nil
  - pattern-not: nil == $SIG
  - pattern-not: $SIG == ""
  - pattern-not: '"" == $SIG'
  - metavariable-pattern:
      metavariable: $EXPECTED
      patterns:
      - pattern-not: nil
      - pattern-not: '""'
- id: narvy.go.auth.cookie-httponly-unset.cookie-httponly-unset
  message: 'A session cookie is set (`http.SetCookie` with a name containing `session`) without `HttpOnly: true`. Without
    it, JavaScript on the page (including an attacker''s, via any XSS) can read the cookie and exfiltrate it (CWE-1004). Set
    `HttpOnly: true` on every session cookie.'
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-1004: Sensitive Cookie Without ''HttpOnly'' Flag'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern: 'http.SetCookie($W, &http.Cookie{..., Name: $NAME, ...})

      '
  - pattern-not: 'http.SetCookie($W, &http.Cookie{..., HttpOnly: true, ...})

      '
  - metavariable-regex:
      metavariable: $NAME
      regex: (?i).*session.*
- id: narvy.go.auth.cookie-secure-unset.cookie-secure-unset
  message: 'A session cookie is set without `Secure: true`. Without it, the browser will also send the cookie over a plaintext
    `http://` connection, letting a network attacker capture it (CWE-614). Set `Secure: true` on every session cookie in production.'
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-614: Sensitive Cookie in HTTPS Session Without ''Secure'' Attribute'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern: 'http.SetCookie($W, &http.Cookie{..., Name: $NAME, ...})

      '
  - pattern-not: 'http.SetCookie($W, &http.Cookie{..., Secure: true, ...})

      '
  - metavariable-regex:
      metavariable: $NAME
      regex: (?i).*session.*
- id: narvy.go.auth.cookie-samesite-none-mode-set.cookie-samesite-none-mode-set
  message: 'A session cookie is set with `SameSite: http.SameSiteNoneMode`. `None` disables the CSRF-mitigating same-site
    restriction entirely, sending the cookie on every cross-site request (CWE-352). Use `http.SameSiteLaxMode` (or `Strict`
    for the most sensitive flows) unless the cookie genuinely needs to be sent from a third-party context, and pair `None`
    with a separate CSRF token if it is required.'
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-352: Cross-Site Request Forgery (CSRF)'
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - go
  pattern: 'http.SetCookie($W, &http.Cookie{..., SameSite: http.SameSiteNoneMode, ...})

    '
- id: narvy-go-cmdi-splat-args
  patterns:
  - pattern-either:
    - pattern: 'exec.Command($ARGS[$IDX], ...)

        '
    - pattern: 'exec.CommandContext($CTX, $ARGS[$IDX], ...)

        '
  - pattern-not: 'exec.Command("...", ...)

      '
  - pattern-not: 'exec.CommandContext($CTX, "...", ...)

      '
  message: 'Command injection: `exec.Command` first argument is an indexed slice expression (e.g. `args[0]`), which means
    the executable path itself is user-controlled. Even with subsequent arguments fixed, the attacker can run arbitrary binaries.
    Use an allow-list of binary names.'
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    technology:
    - go
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
  severity: ERROR
  languages:
  - go
- id: narvy-go-syscall-exec-tainted
  patterns:
  - pattern-either:
    - pattern: syscall.Exec($BIN, ...)
    - pattern: syscall.ForkExec($BIN, ...)
    - pattern: os.StartProcess($BIN, ...)
  - pattern-not: syscall.Exec("...", ...)
  - pattern-not: syscall.ForkExec("...", ...)
  - pattern-not: os.StartProcess("...", ...)
  message: Low-level process execution (`syscall.Exec` / `os.StartProcess`) with a non-literal binary path. If the path comes
    from user input this is a command injection. Validate with an allow-list of approved binaries.
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    technology:
    - go
    confidence: MEDIUM
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
  severity: ERROR
  languages:
  - go
- id: narvy-go-cmdi-shell-flag
  patterns:
  - pattern-either:
    - pattern: 'exec.Command("sh", "-c", $X)

        '
    - pattern: 'exec.Command("bash", "-c", $X)

        '
    - pattern: 'exec.Command("/bin/sh", "-c", $X)

        '
    - pattern: 'exec.Command("/bin/bash", "-c", $X)

        '
    - pattern: 'exec.CommandContext($CTX, "sh", "-c", $X)

        '
    - pattern: 'exec.CommandContext($CTX, "bash", "-c", $X)

        '
  - pattern-not: 'exec.Command($S, "-c", "...")

      '
  - pattern-not: 'exec.CommandContext($CTX, $S, "-c", "...")

      '
  message: Shell expansion via `sh -c` / `bash -c` with a non-literal command string. Even properly-quoted user input is interpreted
    by the shell (subshells, redirection, env expansion). Invoke the target binary directly without `-c` and pass arguments
    as a slice.
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    technology:
    - go
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
  severity: ERROR
  languages:
  - go
- id: narvy.go.code-injection.embedded-js-run-non-literal.embedded-js-run-non-literal
  message: An embedded JavaScript interpreter (goja / otto) executes a non-literal script string. If the script text is attacker-
    influenced, this is full code execution inside your Go process (CWE-94) - these interpreters are not a real security sandbox
    against a determined attacker and have full access to whatever Go functions you registered on the runtime. Never run request-derived
    text as a script.
  severity: ERROR
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - go
    - goja
    - otto
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern-either:
    - pattern: $VM.RunString($X)
    - pattern: $VM.Run($X)
  - pattern-not: $VM.RunString("...")
  - pattern-not: $VM.Run("...")
  - metavariable-regex:
      metavariable: $VM
      regex: (?i)(vm|runtime|interp|js|script|otto)
- id: narvy.go.code-injection.plugin-open-non-literal-path.plugin-open-non-literal-path
  message: '`plugin.Open()` loads a Go shared-object (.so) plugin from a non-literal path. Loading a plugin runs its `init()`
    functions immediately with the full privileges of your process - there is no sandboxing. If the path is attacker-influenced
    (even indirectly, e.g. a filename derived from a request), this is remote code execution (CWE-94). Load plugins only from
    a fixed, trusted, non-writable directory.'
  severity: ERROR
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    category: security
    subcategory:
    - vuln
    technology:
    - go
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern: plugin.Open($PATH)
  - pattern-not: plugin.Open("...")
- id: narvy.go.code-injection.reflect-methodbyname-non-literal.reflect-methodbyname-non-literal
  message: '`reflect.ValueOf(...).MethodByName($NAME)` looks up and invokes a method whose name is not a literal. If `$NAME`
    is influenced by request data, an attacker can call any exported method on the target object - including ones never meant
    to be reachable from outside (unsafe reflection / unintended dispatch, CWE-470). Use an explicit allow-list mapping request
    values to a fixed set of permitted method names.'
  severity: WARNING
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-470: Use of Externally-Controlled Input to Select Classes or Code (''Unsafe Reflection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - audit
    technology:
    - go
    - reflect
    likelihood: LOW
    impact: HIGH
    confidence: LOW
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern: reflect.ValueOf($OBJ).MethodByName($NAME)
  - pattern-not: reflect.ValueOf($OBJ).MethodByName("...")
- id: narvy.go.cmdi.dangerous-exec-command.dangerous-exec-command
  message: '`exec.Command()` / `exec.CommandContext()` called with a command or argument built from request-derived data.
    `exec.Command` does not invoke a shell, so classic `;`/`&&` shell metacharacter injection does not apply directly - but
    if the *binary name itself* or an argument that changes program behavior (e.g. a flag) is attacker-controlled, this is
    still command injection / argument injection (CWE-78/CWE-88). Validate the binary against a fixed allow-list and treat
    every argument as untrusted data, never as a flag.'
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    - 'CWE-88: Argument Injection or Modification'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern-either:
    - pattern: exec.Command($BIN, ...)
    - pattern: exec.CommandContext($CTX, $BIN, ...)
  - pattern-not: exec.Command("...", ...)
  - pattern-not: exec.CommandContext($CTX, "...", ...)
- id: narvy.go.reflect.reflect-methodby-name-tainted.reflect-methodby-name-tainted
  message: '`reflect.ValueOf(...).MethodByName()` (or `.FieldByName()`) called with a name taken from request data. This lets
    an attacker invoke any exported method reachable through the reflected value by naming it in the request - the same class
    of risk as PHP''s tainted `call_user_func()` (CWE-470). Restrict the name to a fixed allow-list keyed by a validated token,
    never the raw input.'
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-470: Use of Externally-Controlled Input to Select Classes or Code (''Unsafe Reflection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern-either:
    - pattern: reflect.ValueOf($OBJ).MethodByName($NAME)
    - pattern: reflect.ValueOf($OBJ).FieldByName($NAME)
  - pattern-not: reflect.ValueOf($OBJ).MethodByName("...")
  - pattern-not: reflect.ValueOf($OBJ).FieldByName("...")
- id: narvy.go.plugin.plugin-open-tainted-path.plugin-open-tainted-path
  message: '`plugin.Open()` called with a path built from request data. Go plugins are arbitrary native code loaded and executed
    in-process - if an attacker can influence which `.so` file gets opened (directly, or via a directory they can also write
    to), this is remote code execution (CWE-94). Load plugins only from a fixed, non-writable-by-request path.'
  severity: ERROR
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
    technology:
    - go
  patterns:
  - pattern: plugin.Open($PATH)
  - pattern-not: plugin.Open("...")
- id: narvy.go.misc.use-of-unsafe-block.use-of-unsafe-block
  message: '`unsafe.$FUNC(...)` call (Pointer conversion, Slice/SliceData/String/StringData zero-copy cast, or Add/Sizeof/Alignof/Offsetof).
    The `unsafe` package steps outside Go''s type and memory safety guarantees, so the compiler no longer checks size or
    layout for you. Manual pointer arithmetic on a size that is not a compile-time constant or independently validated can
    read or write past the intended buffer (CWE-119/CWE-787). Confirm every offset and length is bounded and trusted; prefer
    `encoding/binary` for request-derived byte layouts, and avoid `unsafe` entirely unless a benchmarked hot path requires it.'
  severity: INFO
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-119: Improper Restriction of Operations within the Bounds of a Memory Buffer'
    owasp:
    - A06:2021 - Vulnerable and Outdated Components
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - go
  paths:
    exclude:
    - '*.pb.go'
    - '*_generated.go'
    - '*.gen.go'
    - zz_generated*.go
    - zsyscall_*.go
    - '*_string.go'
  pattern: unsafe.$FUNC(...)
- id: narvy.go.cors.wildcard-allow-origin.wildcard-allow-origin
  message: '`Access-Control-Allow-Origin` header set to `*`. This lets any origin read the response via a cross-origin XHR/fetch
    - safe only for genuinely public, non-authenticated endpoints. If the endpoint uses cookies/sessions or returns non-public
    data, this exposes it to any site the victim visits (CWE-942). Echo back a validated origin from an allow-list instead
    of a wildcard.'
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - go
  paths:
    exclude:
    - '**/*_test.go'
  patterns:
  - pattern-either:
    - pattern: $W.Header().Set("Access-Control-Allow-Origin", "*")
    - pattern: $W.Header().Add("Access-Control-Allow-Origin", "*")
    - pattern: $CTX.Header("Access-Control-Allow-Origin", "*")
- id: narvy.go.cors.reflected-origin-header.reflected-origin-header
  message: The incoming `Origin` request header is echoed straight back as `Access-Control-Allow-Origin` with no allow-list
    check. This grants every origin CORS access - functionally equivalent to a wildcard but easy to miss in review because
    there is no literal `*` (CWE-942). Validate the origin against a fixed allow-list before echoing it.
  severity: ERROR
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - go
  patterns:
  - pattern-either:
    - pattern: $W.Header().Set("Access-Control-Allow-Origin", $R.Header.Get("Origin"))
    - pattern: $W.Header().Set("Access-Control-Allow-Origin", $ORIGIN)
  - pattern-inside: '$ORIGIN := $R.Header.Get("Origin")

      ...

      '
- id: narvy.go.cors.wildcard-with-credentials.wildcard-with-credentials
  message: '`Access-Control-Allow-Credentials: true` set alongside a wildcard/ reflected `Access-Control-Allow-Origin`. Per
    the Fetch spec browsers reject the literal combination of `*` with credentials, so code relying on this is usually reflecting
    the Origin header dynamically instead - which grants every origin authenticated, cookie-bearing cross-site access (CWE-942).
    Restrict `Allow-Origin` to a fixed allow-list when `Allow-Credentials` is `true`.'
  severity: ERROR
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern-either:
    - pattern: '$W.Header().Set("Access-Control-Allow-Credentials", "true")

        ...

        $W.Header().Set("Access-Control-Allow-Origin", $R.Header.Get("Origin"))

        '
    - pattern: '$W.Header().Set("Access-Control-Allow-Origin", $R.Header.Get("Origin"))

        ...

        $W.Header().Set("Access-Control-Allow-Credentials", "true")

        '
- id: narvy.go.crypto.hardcoded-env-fallback-to-crypto.hardcoded-env-fallback-to-crypto
  message: 'Hardcoded fallback secret ''$LITERAL'' is used when the environment variable is unset, and is then fed into a
    cryptographic primitive (HMAC / AES / JWT signing). If the env var is missing in any deployment, the key reduces to a
    public constant. Fix: fail fast at startup with `log.Fatal("$ENV must be set")` if the env var is empty - never silently
    fall back to a literal.'
  severity: ERROR
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A02:2021 - Cryptographic Failures
    - A07:2021 - Identification and Authentication Failures
    category: security
    subcategory:
    - vuln
    technology:
    - go
    - golang
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern: "$K := os.Getenv($ENV)\n...\nif $K == \"\" {\n    $K = \"$LITERAL\"\n}\n...\nhmac.New($H, []byte($K))\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif $K == \"\" {\n    $K = \"$LITERAL\"\n}\n...\naes.NewCipher([]byte($K))\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif len($K) == 0 {\n    $K = \"$LITERAL\"\n}\n...\nhmac.New($H, []byte($K))\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif len($K) == 0 {\n    $K = \"$LITERAL\"\n}\n...\naes.NewCipher([]byte($K))\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif $K == \"\" {\n    $K = \"$LITERAL\"\n}\n...\n$TOKEN.SignedString([]byte($K))\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif len($K) == 0 {\n    $K = \"$LITERAL\"\n}\n...\n$TOKEN.SignedString([]byte($K))\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif \"\" == $K {\n    $K = \"$LITERAL\"\n}\n...\nhmac.New($H, []byte($K))\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif $K == \"\" {\n    $K = \"$LITERAL\"\n}\n...\nargon2.IDKey([]byte($K), ...)\n"
    - pattern: "$K := os.Getenv($ENV)\n...\nif $K == \"\" {\n    $K = \"$LITERAL\"\n}\n...\nargon2.Key([]byte($K), ...)\n"
  - metavariable-regex:
      metavariable: $LITERAL
      regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$
- id: narvy.go.crypto.helper-env-fallback-to-crypto.helper-env-fallback-to-crypto
  message: 'Helper-function fallback (e.g. `getEnvOrDefault("$ENV", "$LITERAL")`) is used to read a secret with a hardcoded
    default, and the result is fed into a crypto primitive. If the env var is unset the key is a public constant. Fix: fail
    fast at startup instead of silently defaulting.'
  severity: ERROR
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - go
    - golang
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern: 'hmac.New($H, []byte(getEnvOrDefault($ENV, "$LITERAL")))

        '
    - pattern: 'hmac.New($H, []byte(GetEnvOrDefault($ENV, "$LITERAL")))

        '
    - pattern: 'hmac.New($H, []byte(getEnv($ENV, "$LITERAL")))

        '
    - pattern: 'aes.NewCipher([]byte(getEnvOrDefault($ENV, "$LITERAL")))

        '
    - pattern: '$TOKEN.SignedString([]byte(getEnvOrDefault($ENV, "$LITERAL")))

        '
    - pattern: '$K := getEnvOrDefault($ENV, "$LITERAL")

        ...

        hmac.New($H, []byte($K))

        '
    - pattern: '$K := getEnvOrDefault($ENV, "$LITERAL")

        ...

        $TOKEN.SignedString([]byte($K))

        '
    - pattern: '$K := getEnv($ENV, "$LITERAL")

        ...

        hmac.New($H, []byte($K))

        '
  - metavariable-regex:
      metavariable: $LITERAL
      regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$
- id: narvy.go.misc.pprof-registered-on-public-mux.pprof-registered-on-public-mux
  message: '`net/http/pprof` imported for its side-effecting `init()` (which registers `/debug/pprof/*` on `http.DefaultServeMux`)
    in a binary that also serves that mux to the public internet. `/debug/pprof/*` exposes goroutine stacks, heap dumps, and
    command-line arguments, and its CPU profile endpoint is a trivial DoS lever (CWE-200). Register pprof only on a separate
    listener bound to localhost, or behind auth.'
  severity: WARNING
  languages:
  - go
  metadata:
    category: security
    cwe:
    - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - go
  patterns:
  - pattern: 'import _ "net/http/pprof"

      '
  - pattern-inside: '...

      http.ListenAndServe($ADDR, nil)

      '
- id: narvy.go.misc.listen-bind-all-interfaces.listen-bind-all-interfaces
  message: Server bound to `0.0.0.0` (or an empty host, e.g. `":8080"` combined with an explicit all-interfaces comment/config)
    instead of a specific interface. For anything not meant to be internet-facing (internal admin APIs, debug/metrics endpoints,
    databases), binding to all interfaces is an unintended external-exposure risk if the host also has a public NIC (CWE-1327
    class). Bind to `127.0.0.1`/a specific internal IP unless the service is deliberately public.
  severity: INFO
  languages:
  - go
