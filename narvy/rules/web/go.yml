- id: narvy.go.reflect.makefunc-dynamic-code.makefunc-dynamic-code
  message: 'reflect.MakeFunc() builds a function value at runtime from a reflect.Type and a Go closure, bypassing the normal
    compile-time type system. If any part of what gets wired into that closure (which argument gets used, what it does with
    it, which downstream call it makes) is influenced by untrusted input, this is a code-generation-adjacent sink and a much
    larger attack surface than a normal function call (CWE-913: Improper Control of Dynamically-Managed Code Resources). Confirm
    the reflect.Type and the closure body are both fully static (no request-derived data feeding either), or replace this
    with a plain typed function / a small static dispatch table.'
