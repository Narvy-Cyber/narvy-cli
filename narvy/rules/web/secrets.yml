# Cross-language hardcoded-credential rules, authored by Narvy.
# Provider tokens and generic high-entropy assignments. Loaded for every stack.

rules:
- id: narvy.secrets.aws-access-key-id
  patterns:
  - pattern-regex: \b(AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[A-Z0-9]{16}\b
  - pattern-not-regex: (?i)(example|sample|test|fake|dummy)
  languages:
  - regex
  message: AWS Access Key ID detected (AKIA/ASIA/AGPA/... 16-char format). This credential grants direct
    API access to an AWS account. Revoke it in IAM immediately and load credentials from the environment,
    an instance role, or a secrets manager instead.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
    - secrets
    - aws
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    vulnerability_class:
    - Hard-coded Secrets
    source: narvy-local
    license: Apache-2.0
- id: narvy.secrets.aws-secret-access-key
  patterns:
  - pattern-regex: (?i)\baws[a-z0-9_]*secret[a-z0-9_]*\s*(=|:|=>)\s*['\"`]?[A-Za-z0-9/+]{40}['\"`]?
  - pattern-not-regex: (?i)(example|sample|placeholder|dummy|xxxx|00000000|changeme)
  languages:
  - regex
  message: A variable named like an AWS secret access key is assigned a 40-char base64-alphabet literal.
    AWS secret keys must never be committed; rotate the key and read it from the environment or a secrets
    manager.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
    - secrets
    - aws
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    vulnerability_class:
    - Hard-coded Secrets
    source: narvy-local
    license: Apache-2.0
- id: narvy.secrets.aws-session-token
  patterns:
  - pattern-regex: (?i)aws_session_token\s*(=|:|=>)\s*['\"`]?[A-Za-z0-9/+=]{32,}['\"`]?
  - pattern-not-regex: (?i)(example|sample|placeholder|dummy)
  languages:
  - regex
  message: An AWS_SESSION_TOKEN-style variable is assigned a long literal value. Session tokens are short-lived
    but still grant active AWS API access if leaked; do not hardcode them.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
