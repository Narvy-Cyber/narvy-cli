    license: Apache-2.0
- id: narvy.secrets.python-boto3-hardcoded-credential
  patterns:
  - pattern-either:
    - pattern: 'boto3.client(..., $CRED="...", ...)

        '
    - pattern: 'boto3.resource(..., $CRED="...", ...)

        '
    - pattern: 'boto3.Session(..., $CRED="...", ...)

        '
  - metavariable-regex:
      metavariable: $CRED
      regex: (aws_access_key_id|aws_secret_access_key|aws_session_token)$
  languages:
  - python
  message: A boto3 client/resource/Session constructor is called with a literal string for aws_access_key_id
    / aws_secret_access_key / aws_session_token. Let boto3 pick up credentials from the environment, ~/.aws/credentials,
    or an instance/task role instead.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
