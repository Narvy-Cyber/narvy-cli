- id: narvy.secrets.terraform-aws-provider-static-credentials
  patterns:
  - pattern-inside: "provider \"aws\" {\n  ...\n}\n"
  - pattern-either:
    - pattern: 'access_key = "..."

        '
    - pattern: 'secret_key = "..."

        '
  languages:
  - hcl
  message: A Terraform `provider "aws"` block hardcodes access_key/secret_key instead of using an instance
    profile, SSO, or environment credentials. Anyone with read access to this .tf file (or state backend
    history) gets live AWS credentials.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
    - secrets
    - aws
    - terraform
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    vulnerability_class:
    - Hard-coded Secrets
    source: narvy-local
    license: Apache-2.0
- id: narvy.secrets.terraform-lambda-env-credentials
  patterns:
  - pattern-inside: "resource \"aws_lambda_function\" \"...\" {\n  ...\n  environment {\n    variables\
      \ = {\n      ...\n    }\n  }\n  ...\n}\n"
  - pattern: '$KEY = "..."

      '
  - metavariable-regex:
      metavariable: $KEY
      regex: ^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN)$
  languages:
  - hcl
  message: An AWS Lambda `environment { variables = {...} }` block hardcodes an AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    / AWS_SESSION_TOKEN literal. Lambda already has an execution role, so static keys in the function
    definition leak through the console, CloudFormation template, and state file.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    owasp:
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    category: security
    technology:
    - secrets
    - aws
    - terraform
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    vulnerability_class:
    - Cryptographic Issues
    source: narvy-local
    license: Apache-2.0
- id: narvy.secrets.terraform-rds-hardcoded-password
  patterns:
  - pattern-either:
    - patterns:
      - pattern: 'password = "..."

          '
      - pattern-inside: "resource \"aws_db_instance\" \"...\" {\n  ...\n}\n"
    - patterns:
      - pattern: 'master_password = "..."

          '
      - pattern-inside: "resource \"aws_rds_cluster\" \"...\" {\n  ...\n}\n"
  languages:
  - hcl
  message: An `aws_db_instance` or `aws_rds_cluster` Terraform resource sets `password` / `master_password`
    to a literal string instead of sourcing it from a `random_password` resource or a secrets manager
    reference.
  severity: WARNING
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
