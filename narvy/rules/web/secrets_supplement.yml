- id: narvy.secrets.google-api-key
  pattern-regex: \bAIza[0-9A-Za-z_-]{35}\b
  languages:
  - regex
  message: >
    Google API Key detected (AIza...). This key may enable access to Google
    Maps, Firebase, Cloud APIs, or other Google services. Restrict it in the
    Google Cloud Console and store in environment variables.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
    - secrets
    - google
    - firebase
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    vulnerability_class:
    - Hard-coded Secrets
    source: narvy-local
  paths:
    exclude:
    - '*.svg'
    - '*go.sum'
    - '*package-lock.json'
    - '*yarn.lock'
    - '*Podfile.lock'
    - '*cargo.lock'
    - '*.xcscmblueprint'
    # Template env files and CI workflow yml hold placeholder keys, not real ones.
    - '*.example'
    - '*.sample'
    - '*.dist'
    - '.github/workflows/*'
    - '**/.github/workflows/*'

- id: narvy.secrets.generic-high-entropy-assignment
  patterns:
  - pattern-regex: (?i)(?:(?:api_?|secret_?|private_?|client_?|auth_?|access_?)?(?:key|secret|token|password|passwd))\s*[=:]\s*["'`](?P<SECRET>[A-Za-z0-9+/=_\-]{20,})["'`]
  - pattern-not-regex: (?i)(?:example|sample|test|fake|placeholder|dummy|changeme|your_|replace|xxxx|todo|fixme|\$\{|\$\(|%[A-Z])
  - pattern-not-regex: (?i)(?:https?://|jdbc:|mongodb://|redis://|postgres://)
  - pattern-not-regex: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
  - metavariable-analysis:
      analyzer: entropy
      metavariable: $SECRET
  languages:
  - regex
  message: >
    High-entropy value assigned to a sensitive variable name detected. This
    pattern matches hardcoded secrets (API keys, passwords, tokens) based on
    both variable naming context and Shannon entropy of the value. Review and
    move this secret to an environment variable or secret manager.
  severity: WARNING
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
    - secrets
    confidence: MEDIUM
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    vulnerability_class:
    - Hard-coded Secrets
    source: narvy-local
  paths:
    exclude:
    - '*.svg'
    - '*go.sum'
    - '*package-lock.json'
    - '*yarn.lock'
    - '*Podfile.lock'
    - '*cargo.lock'
    - '*pnpm-lock*'
    - '*.xcscmblueprint'
    - '*.min.js'
    - '*bundle.js'
    - '*vendor/*'
    - '*node_modules/*'
    # Test/spec/mock/fixture paths are NOT excluded: a real secret committed to a
    # test fixture is a common leak vector; it is emitted then down-ranked to LOW.
