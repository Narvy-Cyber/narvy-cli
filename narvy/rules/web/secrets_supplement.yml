  - pattern-regex: \bghs_[A-Za-z0-9]{36,}\b
  - pattern-regex: \bghr_[A-Za-z0-9]{36,}\b
  languages:
  - regex
  message: >
    GitHub App token detected (ghu_/ghs_/ghr_ prefix). These tokens are issued
    by GitHub Apps for user-to-server, server-to-server, or refresh flows.
    They must not appear in source code. Rotate immediately.
