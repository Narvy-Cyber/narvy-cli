# Additional credential patterns not covered by secrets.yml.
# Loaded for every stack.

rules:

- id: narvy.secrets.github-pat-classic
  pattern-regex: \bghp_[A-Za-z0-9]{36,}\b
  languages:
  - regex
  message: >
    GitHub Classic Personal Access Token detected (ghp_...). This token grants
    direct API access to GitHub repositories and should never be hardcoded.
    Rotate it immediately and store in an environment variable or secret manager.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
    - secrets
    - github
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    vulnerability_class:
    - Hard-coded Secrets
    source: narvy-local
  paths:
    exclude:
    - '*.svg'
    - '*go.sum'
    - '*package-lock.json'
    - '*yarn.lock'
    - '*Podfile.lock'
    - '*cargo.lock'
    - '*pnpm-lock*'

- id: narvy.secrets.github-pat-fine-grained
  pattern-regex: \bgithub_pat_[A-Za-z0-9_]{59,}\b
  languages:
