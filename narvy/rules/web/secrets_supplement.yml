  message: >
    GitHub Fine-Grained Personal Access Token detected (github_pat_...).
    This modern PAT format grants scoped repository access. Rotate immediately
    and use environment variables or a secret manager.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    category: security
    technology:
    - secrets
    - github
    confidence: HIGH
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    vulnerability_class:
    - Hard-coded Secrets
    source: narvy-local

