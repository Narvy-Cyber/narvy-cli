- id: narvy.php.crypto.mcrypt-weak-algo-or-mode.mcrypt-weak-algo-or-mode
  message: '`mcrypt_encrypt()` called with a broken cipher (DES/TripleDES/RC4) or ECB mode. DES has a brute-forceable 56-bit
    key, RC4 has known keystream biases, and ECB leaks plaintext structure. The `mcrypt` extension itself is deprecated/removed
    since PHP 7.2 - migrate to `openssl_encrypt()` with `aes-256-gcm`. CWE-327.'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - php
    - mcrypt
    likelihood: LOW
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
  patterns:
  - pattern: mcrypt_encrypt($CIPHER, ...)
  - metavariable-regex:
      metavariable: $CIPHER
      regex: (?i).*(des|rc4|arcfour|ecb).*
- id: narvy.php.crypto.openssl-encrypt-ecb-mode.openssl-encrypt-ecb-mode
  message: '`openssl_encrypt()` called with an ECB-mode cipher string (e.g. "aes-128-ecb"). ECB encrypts identical plaintext
    blocks to identical ciphertext blocks, leaking structural information about the data. Use an authenticated mode such as
    "aes-256-gcm" instead. CWE-327.'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
