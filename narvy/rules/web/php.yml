# PHP security rules, authored by Narvy.
# Injection, file inclusion, deserialization, weak crypto, session handling.

rules:
- id: narvy.php.lang.assert-tainted-string.assert-tainted-string
  message: '`assert()` called with a string built from user input. When `assert()` receives a string argument (not a boolean
    expression), PHP < 8 evaluates it as PHP code via `eval()` semantics - a tainted value here is remote code execution (CWE-95).
    PHP 8 removed string evaluation, but this is still exploitable on any PHP 7.x deployment. Never build the assertion string
    from input; pass a real boolean expression instead.'
  severity: ERROR
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code (''Eval Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - php
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: assert("..." . $SINK . "...")
      - pattern: assert("...$SINK...")
      - pattern: assert($SINK)
- id: narvy.php.lang.extract-tainted-array.extract-tainted-array
  message: '`extract()` called directly on a superglobal (`$_GET` / `$_POST` / `$_REQUEST` / `$_COOKIE`). This lets an attacker
    define or overwrite any variable in the current symbol table by choosing the array key - variable injection that can bypass
    authentication checks or poison variables used later in the request (CWE-621 / CWE-473 class). Never `extract()` a superglobal;
    whitelist the keys you actually need with `EXTR_SKIP` and a fixed key list, or avoid `extract()` entirely.'
  severity: ERROR
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code (''Eval Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    technology:
    - php
  patterns:
  - pattern-either:
    - pattern: extract($_GET)
    - pattern: extract($_POST)
    - pattern: extract($_REQUEST)
    - pattern: extract($_COOKIE)
    - pattern: extract($_GET, ...)
    - pattern: extract($_POST, ...)
    - pattern: extract($_REQUEST, ...)
    - pattern: extract(array_merge($_GET, ...))
    - pattern: extract(array_merge($_POST, ...))
- id: narvy.php.code-injection.create-function-tainted.create-function-tainted
  mode: taint
  message: '`create_function()` compiles its arguments as PHP code via an internal `eval()` - it is deprecated (removed in
    PHP 8.0) precisely because of this. If either argument is user-controlled, this is remote code execution (CWE-94). Use
    an anonymous function (`function(...) { ... }` or an arrow function) instead - never build the function source from a
    string.'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Code Injection
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
  pattern-sinks:
  - patterns:
    - pattern: create_function(...)
- id: narvy.php.code-injection.preg-replace-e-modifier.preg-replace-e-modifier
  message: '`preg_replace()` is called with the `/e` modifier on its pattern. The `/e` modifier evaluates the replacement
    string as PHP code after backreference substitution - if any matched/substituted portion is attacker-influenced, this
    is remote code execution (CWE-94). The modifier was removed in PHP 7.0, but legacy code running on old runtimes (or migrated
    verbatim) still carries it. Use `preg_replace_callback()` with a real closure instead.'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: LOW
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern: preg_replace($PATTERN, $REPL, $SUBJECT)
  - metavariable-regex:
      metavariable: $PATTERN
      regex: ^['"].*/[a-zA-Z]*e[a-zA-Z]*['"]$
- id: narvy.php.cors.wildcard-allow-origin.wildcard-allow-origin
  message: '`Access-Control-Allow-Origin: *` accepts cross-origin requests from ANY website. If this response also carries
    session cookies or an Authorization header, any site can read the authenticated response on behalf of a logged-in user
    (CWE-942). Reflect a validated origin from an allow-list instead of using a wildcard.'
  severity: WARNING
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    owasp:
    - A05:2021 - Security Misconfiguration
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    vulnerability_class:
    - Security Misconfiguration
    references:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
  patterns:
  - pattern-either:
    - pattern: 'header("Access-Control-Allow-Origin: *")'
    - pattern: 'header(''Access-Control-Allow-Origin: *'')'
- id: narvy.php.cors.reflected-origin-header.reflected-origin-header
  message: 'The `Origin` request header is echoed straight back as the `Access-Control-Allow-Origin` response value. This
    is functionally equivalent to a wildcard (every origin is allowed) but additionally permits `Access-Control-Allow-Credentials:
    true` to work with it, letting ANY site make authenticated cross-origin requests on a logged-in user''s behalf (CWE-942).
    Validate `Origin` against an explicit allow-list before reflecting it.'
  severity: WARNING
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    owasp:
    - A05:2021 - Security Misconfiguration
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Security Misconfiguration
    references:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
  patterns:
  - pattern-either:
    - pattern: 'header("Access-Control-Allow-Origin: " . $_SERVER["HTTP_ORIGIN"])'
    - pattern: 'header(''Access-Control-Allow-Origin: '' . $_SERVER[''HTTP_ORIGIN''])'
- id: narvy.php.curl.tls-verify-peer-off.tls-verify-peer-off
  message: '`CURLOPT_SSL_VERIFYPEER` set to `false` / `0`. This disables TLS certificate validation entirely - the request
    will accept any certificate (including a self-signed one presented by an attacker-in-the-middle), defeating TLS (CWE-295).
    Remove the option (it defaults to verifying) or set it to `true`.'
  severity: ERROR
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    owasp:
    - A02:2021 - Cryptographic Failures
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    technology:
    - php
  patterns:
  - pattern-either:
    - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYPEER, false)
    - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYPEER, 0)
    - pattern: curl_setopt_array($CH, [..., CURLOPT_SSL_VERIFYPEER => false, ...])
    - pattern: curl_setopt_array($CH, [..., CURLOPT_SSL_VERIFYPEER => 0, ...])
- id: narvy.php.curl.tls-verify-host-off.tls-verify-host-off
  message: '`CURLOPT_SSL_VERIFYHOST` set to `false` / `0`. This disables the hostname check against the certificate''s CN/SAN
    - a valid certificate for *any* domain will be accepted, enabling man-in-the-middle attacks (CWE-295). Set it to `2` (the
    secure default) instead.'
  severity: ERROR
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    owasp:
    - A02:2021 - Cryptographic Failures
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    technology:
    - php
  patterns:
  - pattern-either:
    - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYHOST, false)
    - pattern: curl_setopt($CH, CURLOPT_SSL_VERIFYHOST, 0)
    - pattern: curl_setopt_array($CH, [..., CURLOPT_SSL_VERIFYHOST => false, ...])
    - pattern: curl_setopt_array($CH, [..., CURLOPT_SSL_VERIFYHOST => 0, ...])
- id: narvy.php.code-injection.eval-with-user-input.eval-with-user-input
  message: 'Detected PHP `eval()` called with user-controlled input. eval() executes arbitrary PHP code; if the argument is
    user-controlled this is a remote code execution vulnerability (CWE-94). Remove eval() or use a safe alternative (e.g.,
    a whitelist dispatch table).

    '
  severity: ERROR
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    technology:
    - php
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
      - pattern: $_SERVER['HTTP_$VAR']
      - pattern: file_get_contents("php://input")
  pattern-sinks:
  - patterns:
    - pattern: eval($CODE)
  pattern-sanitizers:
  - patterns:
    - pattern: htmlspecialchars($X, ...)
    - pattern: htmlentities($X, ...)
- id: narvy.php.file-inclusion.dynamic-include-with-user-input.dynamic-include-with-user-input
  message: 'Detected PHP `include` / `require` with a user-controlled filename. This allows local file inclusion (LFI) and
    potentially remote file inclusion (RFI), enabling arbitrary code execution (CWE-98). Validate the include path against
    a strict allow-list.

    '
  severity: ERROR
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program (''PHP Remote File Inclusion'')'
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    technology:
    - php
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: include($FILE)
      - pattern: include_once($FILE)
      - pattern: require($FILE)
      - pattern: require_once($FILE)
- id: narvy.php.crypto.hardcoded-env-fallback-to-hmac-inline.hardcoded-env-fallback-to-hmac-inline
  message: 'Hardcoded fallback secret ''$LITERAL'' is used as the HMAC key when the environment variable is unset. Anyone
    reading this source can forge valid MACs. Fix: fail fast at startup.'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern: 'hash_hmac($ALGO, $DATA, getenv($ENV) ?: "$LITERAL")

        '
    - pattern: 'hash_hmac($ALGO, $DATA, $_ENV[$ENV] ?? "$LITERAL")

        '
    - pattern: 'hash_hmac($ALGO, $DATA, $_SERVER[$ENV] ?? "$LITERAL")

        '
    - pattern: 'hash_hmac($ALGO, $DATA, getenv($ENV) ?? "$LITERAL")

        '
  - metavariable-regex:
      metavariable: $LITERAL
      regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$
- id: narvy.php.crypto.hardcoded-env-fallback-to-hmac-twostep.hardcoded-env-fallback-to-hmac-twostep
  message: 'Hardcoded fallback secret ''$LITERAL'' (assigned from `getenv` / `$_ENV` with default) is used as the HMAC key.
    Fix: fail fast at startup.'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern-inside: '$K = getenv($ENV) ?: "$LITERAL";

        ...

        '
    - pattern-inside: '$K = $_ENV[$ENV] ?? "$LITERAL";

        ...

        '
    - pattern-inside: '$K = $_SERVER[$ENV] ?? "$LITERAL";

        ...

        '
    - pattern-inside: '$K = isset($_ENV[$ENV]) ? $_ENV[$ENV] : "$LITERAL";

        ...

        '
  - pattern: 'hash_hmac($ALGO, $DATA, $K)

      '
  - metavariable-regex:
      metavariable: $LITERAL
      regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$
- id: narvy.php.crypto.hardcoded-env-fallback-to-openssl-inline.hardcoded-env-fallback-to-openssl-inline
  message: 'Hardcoded fallback secret ''$LITERAL'' is used as the symmetric cipher key in openssl_encrypt / openssl_decrypt
    when the env var is unset. All ciphertexts can be decrypted by anyone reading this source. Fix: fail fast at startup and
    derive the cipher key via hash_hkdf / PBKDF2 with a per-record salt.'
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - php
    - openssl
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern: 'openssl_encrypt($PLAIN, $CIPHER, getenv($ENV) ?: "$LITERAL", ...)

        '
    - pattern: 'openssl_encrypt($PLAIN, $CIPHER, $_ENV[$ENV] ?? "$LITERAL", ...)

        '
    - pattern: 'openssl_decrypt($CT, $CIPHER, getenv($ENV) ?: "$LITERAL", ...)

        '
    - pattern: 'openssl_decrypt($CT, $CIPHER, $_ENV[$ENV] ?? "$LITERAL", ...)

        '
  - metavariable-regex:
      metavariable: $LITERAL
      regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$
- id: narvy.php.crypto.hardcoded-env-fallback-to-openssl-twostep.hardcoded-env-fallback-to-openssl-twostep
  message: Hardcoded fallback secret '$LITERAL' (assigned via env-fallback) is used as the openssl cipher key. Fail fast at
    startup.
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - php
    - openssl
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern-inside: '$K = getenv($ENV) ?: "$LITERAL";

        ...

        '
    - pattern-inside: '$K = $_ENV[$ENV] ?? "$LITERAL";

        ...

        '
  - pattern-either:
    - pattern: 'openssl_encrypt($PLAIN, $CIPHER, $K, ...)

        '
    - pattern: 'openssl_decrypt($CT, $CIPHER, $K, ...)

        '
  - metavariable-regex:
      metavariable: $LITERAL
      regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$
- id: narvy.php.ldap.request-input-to-search-filter.request-input-to-search-filter
  message: A value from $_GET/$_POST/$_REQUEST/$_COOKIE is concatenated into an LDAP search/bind filter without escaping.
    An attacker can inject LDAP filter metacharacters to bypass authentication or exfiltrate directory data (LDAP injection,
    CWE-90). Escape the value with `ldap_escape($value, "", LDAP_ESCAPE_FILTER)` before building the filter string.
  severity: ERROR
  languages:
  - php
  mode: taint
  metadata:
    cwe:
    - 'CWE-90: Improper Neutralization of Special Elements used in an LDAP Query (''LDAP Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - LDAP Injection
    references:
    - https://cwe.mitre.org/data/definitions/90.html
    - https://owasp.org/www-community/attacks/LDAP_Injection
  paths:
    exclude:
    - '**/test/**'
    - '**/tests/**'
  pattern-sources:
  - pattern: $_GET[...]
  - pattern: $_POST[...]
  - pattern: $_REQUEST[...]
  - pattern: $_COOKIE[...]
  pattern-sanitizers:
  - pattern: ldap_escape(...)
  pattern-sinks:
  - pattern: ldap_search($CONN, $BASE, $SINK)
  - pattern: ldap_search($CONN, $BASE, $SINK, ...)
  - pattern: ldap_list($CONN, $BASE, $SINK)
  - pattern: ldap_list($CONN, $BASE, $SINK, ...)
  - pattern: ldap_bind($CONN, $SINK, ...)
- id: narvy.php.misc.laravel-mass-assignment-request-all.laravel-mass-assignment-request-all
  message: Eloquent `::create()` / `->fill()` / `->update()` is passed the entire request payload (`$request->all()`) with
    no field allow-list. If the model has security-sensitive attributes (e.g. `is_admin`, `role`, `verified`, `balance`) and
    does not restrict them via `$fillable` / `$guarded`, an attacker can set them by adding extra keys to the request body
    (mass assignment, CWE-915). Pass an explicit array of permitted fields, or use `$request->only([...])` / `$request->validated()`.
  severity: WARNING
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    category: security
    subcategory:
    - audit
    technology:
    - php
    - laravel
    - eloquent
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: LOW
    vulnerability_class:
    - Improper Access Control
  patterns:
  - pattern-either:
    - pattern: $MODEL::create($REQUEST->all())
    - pattern: $MODEL->fill($REQUEST->all())
    - pattern: $MODEL->update($REQUEST->all())
- id: narvy.php.misc.insecure-chmod-permission.insecure-chmod-permission
  message: '`chmod()` sets world-writable (and often world-readable) permissions (0777/0666). Any local user or process can
    then modify or read this file, which is dangerous for config files, uploaded content directories, or scripts that get
    executed later (CWE-732). Use the narrowest mode that works, e.g. 0600 for secrets or 0644 for regular files.'
  severity: WARNING
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-732: Incorrect Permission Assignment for Critical Resource'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    subcategory:
    - audit
    technology:
    - php
    likelihood: LOW
    impact: MEDIUM
    confidence: HIGH
    vulnerability_class:
    - Improper Access Control
  patterns:
  - pattern-either:
    - pattern: chmod($PATH, 0777)
    - pattern: chmod($PATH, 0666)
- id: narvy.php.lang.open-redirect-header-location.open-redirect-header-location
  message: '`header(''Location: ...'')` built with a value taken directly from user input. An attacker can craft a link to
    your trusted domain that then redirects the victim to an attacker-controlled site - used in phishing to borrow the trusted
    domain''s credibility (CWE-601). Validate the target against a fixed allow-list of paths/hosts, or only allow relative
    paths starting with `/`.'
  severity: WARNING
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-601: URL Redirection to Untrusted Site (''Open Redirect'')'
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - php
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: 'header("Location: " . $SINK)'
      - pattern: 'header("Location: $SINK")'
      - pattern: 'header("Location: " . $SINK . "...")'
- id: narvy.php.laravel.open-redirect-redirect-tainted.open-redirect-redirect-tainted
  message: Laravel `redirect()` / `Redirect::to()` called with a URL taken directly from user input (typically a `?next=`/`?redirect=`
    query parameter). Without validating the target, an attacker can send victims through your trusted domain to an attacker-controlled
    site (CWE-601). Use `redirect()->intended()` with a safe fallback, or validate the target against `url()->isValidRedirect()`
    / a fixed allow-list before passing it to `redirect()->to()`.
  severity: WARNING
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-601: URL Redirection to Untrusted Site (''Open Redirect'')'
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - php
    - laravel
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: request($X)
      - pattern: request()->input(...)
      - pattern: request()->get(...)
      - pattern: request()->query(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: redirect($SINK)
      - pattern: redirect()->to($SINK)
      - pattern: Redirect::to($SINK)
      - pattern: response()->redirectTo($SINK)
- id: narvy.php.info.phpinfo-call.phpinfo-call
  message: '`phpinfo()` call found in application code reachable via a web request. It dumps the full PHP configuration -
    loaded extensions, disabled functions, include paths, environment variables, and (with `INFO_ALL`/default flags) request
    headers and server variables - which materially helps an attacker fingerprint the stack and find further weaknesses (CWE-200).
    Remove it from production code, or gate it behind an authenticated admin-only route with a strict IP allow-list.'
  severity: WARNING
  languages:
  - php
  metadata:
    category: security
    cwe:
    - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - php
  patterns:
  - pattern-either:
    - pattern: phpinfo()
