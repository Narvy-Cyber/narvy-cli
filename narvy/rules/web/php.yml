    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
  patterns:
  - pattern: openssl_encrypt($DATA, "$CIPHER", ...)
  - metavariable-regex:
      metavariable: $CIPHER
      regex: (?i).*-ecb$
- id: narvy.php.crypto.weak-random-security-token.weak-random-security-token
  message: '`mt_rand()` / `rand()` output is assigned to a variable whose name indicates security-sensitive use (token, secret,
    password, otp, session, nonce, reset code, csrf). Both are Mersenne-Twister-based and not cryptographically secure - their
    output is predictable once a few samples are observed. Use `random_bytes()` or `random_int()`, which are CSPRNG-backed.
    CWE-338.'
  severity: WARNING
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    - 'CWE-330: Use of Insufficiently Random Values'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - audit
    technology:
    - php
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Insufficient Entropy
  patterns:
  - pattern-either:
    - pattern: $TOKEN = mt_rand(...);
    - pattern: $TOKEN = rand(...);
  - metavariable-regex:
      metavariable: $TOKEN
      regex: (?i).*(token|secret|password|passwd|pwd|otp|session|nonce|reset|csrf).*
- id: narvy.php.xss.echo-superglobal-unescaped.echo-superglobal-unescaped
  mode: taint
  message: User-controlled request data ($_GET/$_POST/$_REQUEST/$_COOKIE/ $_SERVER['HTTP_*']) reaches an `echo`/`print` output
    sink without passing through `htmlspecialchars()` / `htmlentities()`. The value is written into the HTML response verbatim;
    an attacker who controls it can inject `<script>` or event-handler markup (reflected XSS, CWE-79). Escape with `htmlspecialchars($X,
    ENT_QUOTES, 'UTF-8')` before output.
  severity: ERROR
  languages:
  - php
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site Scripting'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: HIGH
    impact: MEDIUM
    confidence: MEDIUM
    vulnerability_class:
    - Cross-Site-Scripting (XSS)
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: $_COOKIE[...]
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: echo $X;
      - pattern: print $X;
      - pattern: printf($FMT, $X)
  pattern-sanitizers:
  - patterns:
    - pattern: htmlspecialchars($X, ...)
  - patterns:
    - pattern: htmlentities($X, ...)
  - patterns:
    - pattern: strip_tags($X, ...)
  - patterns:
    - pattern: (int)$X
  - patterns:
    - pattern: (float)$X
  - patterns:
    - pattern: esc_html($X)
  - patterns:
    - pattern: esc_html__($X, ...)
  - patterns:
    - pattern: esc_attr($X)
  - patterns:
    - pattern: esc_attr__($X, ...)
  - patterns:
    - pattern: esc_url($X)
  - patterns:
    - pattern: esc_url_raw($X)
  - patterns:
    - pattern: esc_js($X)
  - patterns:
    - pattern: esc_textarea($X)
  - patterns:
    - pattern: wp_kses($X, ...)
  - patterns:
    - pattern: wp_kses_post($X)
  - patterns:
    - pattern: sanitize_text_field($X)
  - patterns:
    - pattern: sanitize_email($X)
  - patterns:
    - pattern: sanitize_key($X)
  - patterns:
    - pattern: absint($X)
  - patterns:
    - pattern: intval($X, ...)
  - patterns:
    - pattern: wc_clean($X)
- id: narvy.php.xss.blade-raw-echo-tainted.blade-raw-echo-tainted
  message: Laravel Blade's raw-output syntax `{!! $VAR !!}` skips the automatic HTML escaping that the regular `{{ $VAR }}`
    syntax applies. If `$VAR` carries request-derived or otherwise attacker-influenced data, this is stored/reflected XSS
    (CWE-79). Use `{{ $VAR }}` unless the value is already-sanitized trusted HTML (e.g. output of a markdown-to-HTML converter
    you control).
  severity: WARNING
  languages:
  - generic
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site Scripting'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - audit
    technology:
    - php
    - laravel
    - blade
    likelihood: LOW
    impact: HIGH
    confidence: LOW
    vulnerability_class:
    - Cross-Site-Scripting (XSS)
  paths:
    include:
    - '*.blade.php'
  patterns:
  - pattern: '{!! $VAR !!}'
  - pattern-not: '{!! __($X) !!}'
- id: narvy.php.deserialization.unserialize-request-input.unserialize-request-input
  message: '`unserialize()` is called on data derived from $_GET/$_POST/ $_REQUEST/$_COOKIE. PHP object injection (CWE-502):
    if any class reachable from the deserialized graph implements a magic method (__wakeup, __destruct, __toString, ...),
    an attacker can craft a serialized payload that triggers a POP-chain gadget for RCE, file write, or SQL injection. Use
    `json_decode()` for untrusted data, or `unserialize($X, [''allowed_classes'' => false])` if PHP objects are unavoidable.'
  severity: ERROR
  languages:
  - php
  mode: taint
  metadata:
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    category: security
    subcategory:
    - vuln
    technology:
    - php
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Insecure Deserialization
    references:
    - https://cwe.mitre.org/data/definitions/502.html
    - https://owasp.org/www-community/vulnerabilities/PHP_Object_Injection
  paths:
    exclude:
    - '**/test/**'
    - '**/tests/**'
  pattern-sources:
  - pattern: $_GET[...]
  - pattern: $_POST[...]
  - pattern: $_REQUEST[...]
  - pattern: $_COOKIE[...]
  pattern-sanitizers:
  - pattern: json_decode(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: unserialize($SINK)
      - pattern: unserialize($SINK, $OPTS)
    - pattern-not: unserialize($SINK, ['allowed_classes' => false])
