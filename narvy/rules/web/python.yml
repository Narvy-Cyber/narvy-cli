    leading to a TOCTOU race that can be used for data tampering or symlink attacks (CWE-377). The Python
    docs themselves deprecate this function for exactly this reason. Use `tempfile.NamedTemporaryFile()`
    or `tempfile.mkstemp()`, which create the file atomically.'
