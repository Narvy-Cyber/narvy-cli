- id: narvy.python.code-injection.importlib-module-name-tainted.importlib-module-name-tainted
  message: A module name passed to `importlib.import_module()` / `__import__()` is derived from request data. Importing a
    module executes its top-level code, so an attacker who can choose the name can load and run any importable module on the
    box - including ones dropped into a writable directory that is on `sys.path`, or stdlib modules whose import has side
    effects (CWE-94, arbitrary code load). Map the request value through an explicit dict of allowed module names instead
    of passing it through.
  severity: ERROR
  languages:
