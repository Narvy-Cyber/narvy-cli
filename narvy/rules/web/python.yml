# Python security rules, authored by Narvy.
# Injection, deserialization, SSRF, XSS, path traversal, weak crypto, secrets.

rules:
- id: narvy.python.injection.os-popen-concat.os-popen-concat
  message: 'Detected `os.popen()` called with a dynamically constructed command string. This is equivalent
    to os.system() for command injection purposes (CWE-78). Use subprocess with a list and `shell=False`.

    '
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: os.popen("..." + $VAR)
    - pattern: os.popen($VAR + "...")
    - pattern: os.popen($VAR)
    - pattern: os.popen(f"...{$VAR}...")
  - pattern-not: os.popen("...")
- id: narvy.python.injection.os-system-concat.os-system-concat
  message: 'Detected `os.system()` called with a string that includes a non-literal variable via concatenation
    or f-string. If the variable originates from user input this enables OS command injection (CWE-78).
    Use the `subprocess` module with a list of arguments and `shell=False` instead.

    '
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: os.system("..." + $VAR)
    - pattern: os.system($VAR + "...")
    - pattern: os.system($VAR)
    - pattern: os.system(f"...{$VAR}...")
    - pattern: os.system("...".format(..., $VAR, ...))
    - pattern: os.system("..." % $VAR)
  - pattern-not: os.system("...")
- id: narvy.python.injection.subprocess-shell-true-with-var.subprocess-shell-true-with-var
  message: 'Detected subprocess call with `shell=True` and a dynamically constructed command. Using `shell=True`
    with user input enables OS command injection (CWE-78). Pass a list of arguments with `shell=False`
    instead.

    '
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: subprocess.run("..." + $VAR, ..., shell=True, ...)
    - pattern: subprocess.run($VAR, ..., shell=True, ...)
    - pattern: subprocess.run(f"...{$VAR}...", ..., shell=True, ...)
    - pattern: subprocess.Popen("..." + $VAR, ..., shell=True, ...)
    - pattern: subprocess.Popen($VAR, ..., shell=True, ...)
    - pattern: subprocess.Popen(f"...{$VAR}...", ..., shell=True, ...)
    - pattern: subprocess.call("..." + $VAR, ..., shell=True, ...)
    - pattern: subprocess.call($VAR, ..., shell=True, ...)
    - pattern: subprocess.check_output("..." + $VAR, ..., shell=True, ...)
    - pattern: subprocess.check_output($VAR, ..., shell=True, ...)
  - pattern-not: subprocess.run("...", ..., shell=True, ...)
  - pattern-not: subprocess.Popen("...", ..., shell=True, ...)
- id: narvy.python.deserialization.yaml-load-unsafe.yaml-load-unsafe
  message: 'Detected `yaml.load()` without an explicit Loader. Without a Loader, PyYAML defaults to FullLoader
    (PyYAML >= 5.1) or an even more dangerous loader in older versions, both of which can deserialise
    arbitrary Python objects when the input is untrusted (CWE-502). Use `yaml.safe_load()` for untrusted
    input.

    '
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
  patterns:
  - pattern: yaml.load($DATA)
  - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader)
  - pattern-not: yaml.load($DATA, Loader=yaml.BaseLoader)
  - pattern-not: yaml.safe_load(...)
- id: narvy.python.code-injection.compile-exec-tainted.compile-exec-tainted
  message: '`compile()` output is passed to `exec()`/`eval()` where the source text passed to `compile()`
    is not a fixed literal. This is the same RCE risk as calling `eval()`/`exec()` directly on tainted
    text (CWE-94), just split across two calls, which sometimes slips past naive eval/exec-only detectors.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern-either:
    - pattern: '$CODE = compile($SRC, ...)

        ...

        exec($CODE)

        '
    - pattern: '$CODE = compile($SRC, ...)

        ...

        eval($CODE)

        '
  - pattern-not: '$CODE = compile("...", ...)

      ...

      exec($CODE)

      '
  - pattern-not: '$CODE = compile("...", ...)

      ...

      eval($CODE)

      '
- id: narvy.python.code-injection.eval-format-string.eval-format-string
  message: '`eval()` called on a dynamically built string (f-string, `%` formatting, or `.format()`) rather
    than a fixed literal. Even if the immediate source is not obviously a request object, building code
    text by interpolation is a strong code-injection smell (CWE-94) whenever any interpolated part is
    not fully trusted. Prefer `ast.literal_eval` for literals, or refactor to avoid building code as text.'
  severity: WARNING
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    likelihood: MEDIUM
    impact: HIGH
    confidence: LOW
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern-either:
    - pattern: eval(f"...{$VAR}...")
    - pattern: eval("...".format($VAR))
    - pattern: eval("..." % $VAR)
    - pattern: exec(f"...{$VAR}...")
    - pattern: exec("...".format($VAR))
    - pattern: exec("..." % $VAR)
- id: narvy.python.code-injection.eval-on-request-data.eval-on-request-data
  message: '`eval()` is called on data that originates from an HTTP request (Flask `request.*`, Django
    `request.*`, or a function argument that is clearly user-controlled). `eval()` executes arbitrary
    Python - this is full remote code execution (CWE-94). There is no safe way to sandbox `eval()` against
    a malicious string; replace with `ast.literal_eval()` if only literals are expected, or a proper parser/allowlisted
    DSL otherwise.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - flask
    - django
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern-either:
    - pattern: eval(request.$KIND.$ATTR(...))
    - pattern: eval(request.$KIND.$ATTR)
    - pattern: eval(request.$KIND[$X])
    - pattern: eval(request.$KIND.get(...))
    - pattern: '$V = request.$KIND.$ATTR(...)

        ...

        eval($V)

        '
    - pattern: '$V = request.$KIND[$X]

        ...

        eval($V)

        '
  - metavariable-regex:
      metavariable: $KIND
      regex: ^(GET|POST|args|form|json|values|data|cookies|headers|params)$
- id: narvy.python.code-injection.exec-on-request-data.exec-on-request-data
  message: '`exec()` is called on data that originates from an HTTP request. `exec()` runs arbitrary Python
    statements - full remote code execution (CWE-94). Never execute request-derived strings as code.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - flask
    - django
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Code Injection
  patterns:
  - pattern-either:
    - pattern: exec(request.$KIND.$ATTR(...))
    - pattern: exec(request.$KIND.$ATTR)
    - pattern: exec(request.$KIND[$X])
    - pattern: exec(request.$KIND.get(...))
    - pattern: '$V = request.$KIND.$ATTR(...)

        ...

        exec($V)

        '
    - pattern: '$V = request.$KIND[$X]

        ...

        exec($V)

        '
  - metavariable-regex:
      metavariable: $KIND
      regex: ^(GET|POST|args|form|json|values|data|cookies|headers|params)$
- id: narvy.python.command-injection.asyncio-subprocess-shell.asyncio-subprocess-shell
  message: '`asyncio.create_subprocess_shell()` runs its argument through a real shell (like os.system).
    If `$CMD` is built from a variable instead of a pure literal, this is OS command injection (CWE-78).
    Use `asyncio.create_subprocess_exec()` with a list of arguments instead.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - asyncio
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Command Injection
  patterns:
  - pattern-either:
    - pattern: asyncio.create_subprocess_shell($CMD)
    - pattern: asyncio.create_subprocess_shell("..." + $VAR)
    - pattern: asyncio.create_subprocess_shell(f"...{$VAR}...")
  - pattern-not: asyncio.create_subprocess_shell("...")
- id: narvy.python.command-injection.os-exec-family-tainted.os-exec-family-tainted
  message: '`os.$FN()` replaces the current process image with a command built from a non-literal argument.
    If the argument (or one of its list elements) is influenced by external input, this is command injection
    / arbitrary process execution (CWE-78, CWE-88). Validate against an allowlist of known binaries before
    calling.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    - 'CWE-88: Improper Neutralization of Argument Delimiters in a Command (''Argument Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Command Injection
  patterns:
  - pattern-either:
    - pattern: os.execl($VAR, ...)
    - pattern: os.execle($VAR, ...)
    - pattern: os.execlp($VAR, ...)
    - pattern: os.execv($VAR, ...)
    - pattern: os.execve($VAR, ...)
    - pattern: os.execvp($VAR, ...)
    - pattern: os.spawnl(..., $VAR, ...)
    - pattern: os.spawnv(..., $VAR, ...)
    - pattern: os.posix_spawn($VAR, ...)
  - pattern-not: os.$FN("...", ...)
- id: narvy.python.command-injection.paramiko-exec-command-tainted.paramiko-exec-command-tainted
  message: '`paramiko` SSH client `exec_command()` invoked with a non-literal command string. The remote
    shell will interpret this string, so any external input reaching `$CMD` is remote command injection
    on the target host (CWE-78). Build the command from a fixed template and shell-quote any variable
    parts with `shlex.quote()`.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - paramiko
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Command Injection
  patterns:
  - pattern-either:
    - pattern: $CLIENT.exec_command($CMD)
    - pattern: $CLIENT.exec_command("..." + $VAR)
    - pattern: $CLIENT.exec_command(f"...{$VAR}...")
  - pattern-not: $CLIENT.exec_command("...")
  - metavariable-regex:
      metavariable: $CLIENT
      regex: (?i)(ssh|client)
- id: narvy.python.command-injection.shell-metacharacter-in-fstring-subprocess.shell-metacharacter-fstring-subprocess
  message: 'subprocess call built via an f-string / % / .format() that embeds a variable directly into
    the command text (rather than passing it as a separate argv element). Even without `shell=True`, if
    this string is later split by shlex or passed to a shell, or if the call site is actually `shell=True`
    elsewhere in this branch, unescaped shell metacharacters in the variable let an attacker chain commands.
    Pass arguments as a list: `subprocess.run(["cmd", user_arg])`. CWE-78.'
  severity: WARNING
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - subprocess
    likelihood: MEDIUM
    impact: HIGH
    confidence: LOW
    vulnerability_class:
    - Command Injection
  patterns:
  - pattern-either:
    - pattern: subprocess.run(f"...{$VAR}...", ...)
    - pattern: subprocess.Popen(f"...{$VAR}...", ...)
    - pattern: subprocess.call(f"...{$VAR}...", ...)
    - pattern: subprocess.check_output(f"...{$VAR}...", ...)
    - pattern: subprocess.check_call(f"...{$VAR}...", ...)
- id: narvy.python.command-injection.subprocess-list-arg-tainted.subprocess-list-arg-tainted
  message: A value read from the HTTP request reaches a subprocess call as part of the argv list, with
    no shell=True in sight and no allow-list check in between. List-form subprocess calls are often assumed
    safe because there is no shell to interpret metacharacters, but that only protects against injecting
    *additional* commands via `;`/`|`/backticks - it does nothing to stop the attacker from choosing which
    flags or arguments reach the target binary, and if the tainted value is split into several argv elements
    (e.g. via `.split(' ')`) the attacker effectively controls an arbitrary number of arguments to that
    binary. CWE-78, CWE-88. Validate the value against a strict allow-list of expected tokens, or don't
    let request data reach argv at all.
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    - 'CWE-88: Improper Neutralization of Argument Delimiters in a Command (''Argument Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - subprocess
    - django
    - flask
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Command Injection
    references:
    - https://cwe.mitre.org/data/definitions/78.html
    - https://cwe.mitre.org/data/definitions/88.html
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: request.POST[...]
      - pattern: request.POST.get(...)
      - pattern: request.GET[...]
      - pattern: request.GET.get(...)
      - pattern: request.args[...]
      - pattern: request.args.get(...)
      - pattern: request.form[...]
      - pattern: request.form.get(...)
      - pattern: request.values[...]
      - pattern: request.values.get(...)
      - pattern: request.json[...]
      - pattern: request.json.get(...)
      - pattern: request.data
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: subprocess.Popen($SINK, ...)
      - pattern: subprocess.run($SINK, ...)
      - pattern: subprocess.call($SINK, ...)
      - pattern: subprocess.check_output($SINK, ...)
      - pattern: subprocess.check_call($SINK, ...)
  pattern-sanitizers:
  - patterns:
    - pattern: shlex.quote(...)
  - patterns:
    - pattern: int(...)
- id: narvy.python.cors.reflected-origin-header.reflected-origin-header
  message: The response's `Access-Control-Allow-Origin` header is set to the value of the incoming `Origin`
    request header verbatim, instead of to a fixed value or a value checked against an allowlist. This
    effectively grants every origin CORS access - identical in effect to a wildcard, but easy to miss
    in review because the header value looks "dynamic" rather than "*". CWE-942.
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    owasp:
    - A05:2021 - Security Misconfiguration
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - flask
    - django
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - Cookie Security
  patterns:
  - pattern-either:
    - pattern: $RESP.headers["Access-Control-Allow-Origin"] = request.headers.get("Origin")
    - pattern: $RESP.headers["Access-Control-Allow-Origin"] = request.headers["Origin"]
    - pattern: $RESP["Access-Control-Allow-Origin"] = request.headers.get("Origin")
    - pattern: $RESP["Access-Control-Allow-Origin"] = request.META.get("HTTP_ORIGIN")
- id: narvy.python.crypto.broken-cipher-algorithm.broken-cipher-algorithm
  message: Broken or deprecated symmetric cipher '$ALGO'. DES (56-bit key) and RC2 are trivially brute-forceable
    on modern hardware; RC4/ARC4 has known keystream biases; Blowfish's 64-bit block size is vulnerable
    to birthday-bound attacks (SWEET32) on large ciphertexts. Use AES-256-GCM or ChaCha20-Poly1305. CWE-327.
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - pycryptodome
    - cryptography
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
  patterns:
  - pattern-either:
    - pattern: $ALGO.new(...)
    - pattern: algorithms.$ALGO(...)
  - metavariable-regex:
      metavariable: $ALGO
      regex: ^(DES|DES3|ARC2|ARC4|RC2|RC4|Blowfish|IDEA|CAST)$
- id: narvy.python.crypto.ecb-cipher-mode.ecb-cipher-mode
  message: ECB cipher mode encrypts identical plaintext blocks to identical ciphertext blocks, leaking
    structural patterns in the data (the classic "ECB penguin"). Use GCM (authenticated) or, at minimum,
    CBC with a random IV and a separate MAC. CWE-327.
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - pycryptodome
    - cryptography
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
  patterns:
  - pattern-either:
    - pattern: $ALGO.new($KEY, $ALGO.MODE_ECB)
    - pattern: Cipher($ALGO, modes.ECB(), ...)
- id: narvy.python.crypto.empty-or-literal-aes-key.empty-or-literal-aes-key
  message: AES key is an empty byte string or a short string literal, not a securely generated key. This
    is either a debug leftover or a hardcoded key; both defeat the cipher. Generate keys with os.urandom(32)
    or secrets.token_bytes(32) and load from a secret store. CWE-321, CWE-1204.
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-1204: Generation of Weak Initialization Vector'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - pycryptodome
    - cryptography
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern: AES.new(b"", ...)
    - pattern: AES.new("", ...)
    - pattern: AES.new(b"$LIT", ...)
    - pattern: AES.new("$LIT", ...)
- id: narvy.python.crypto.hardcoded-env-fallback-to-cipher.hardcoded-env-fallback-to-cipher
  message: Hardcoded fallback secret '$LITERAL' is passed as a symmetric cipher key when the env var is
    unset. Defeats the entire crypto operation. Fail fast on missing env at startup and derive the key
    via HKDF / PBKDF2 with a per-record salt.
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - cryptography
    - pycryptodome
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern: 'AES.new(os.getenv($ENV, "$LITERAL").encode(...), ...)

        '
    - pattern: 'AES.new(os.environ.get($ENV, "$LITERAL").encode(...), ...)

        '
    - pattern: 'AES.new((os.environ.get($ENV) or "$LITERAL").encode(...), ...)

        '
    - pattern: 'algorithms.AES(os.getenv($ENV, "$LITERAL").encode(...))

        '
    - pattern: 'algorithms.AES(os.environ.get($ENV, "$LITERAL").encode(...))

        '
    - pattern: '$KDF.derive(os.getenv($ENV, "$LITERAL").encode(...))

        '
    - pattern: '$KDF.derive(os.environ.get($ENV, "$LITERAL").encode(...))

        '
    - pattern: '$K = os.getenv($ENV, "$LITERAL")

        ...

        AES.new($K.encode(...), ...)

        '
    - pattern: '$K = os.environ.get($ENV, "$LITERAL")

        ...

        AES.new($K.encode(...), ...)

        '
  - metavariable-regex:
      metavariable: $LITERAL
      regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$
- id: narvy.python.crypto.hardcoded-env-fallback-to-hash.hardcoded-env-fallback-to-hash
  message: Hardcoded fallback secret '$LITERAL' is used when the environment variable is unset, and is
    then fed into a cryptographic hash. If the env var is missing in any deployment, the hash input reduces
    to a public constant. Use HKDF / PBKDF2 / scrypt / Argon2, and fail fast on missing env at startup.
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-321: Use of Hard-coded Cryptographic Key'
    - 'CWE-798: Use of Hard-coded Credentials'
    - 'CWE-916: Use of Password Hash With Insufficient Computational Effort'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - python
    - hashlib
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    vulnerability_class:
    - Cryptographic Issues
    - Hard-coded Credentials
  patterns:
  - pattern-either:
    - pattern: 'hashlib.$ALGO(os.getenv($ENV, "$LITERAL").encode(...))

        '
    - pattern: 'hashlib.$ALGO(os.getenv($ENV, "$LITERAL").encode())

        '
    - pattern: 'hashlib.$ALGO(os.environ.get($ENV, "$LITERAL").encode(...))

        '
