- id: narvy.python.paramiko.implicit-trust-host-key.implicit-trust-host-key
  message: '`set_missing_host_key_policy()` is called with `AutoAddPolicy` or `WarningPolicy`. Both accept
    a host key the client has never seen before without any verification - `AutoAddPolicy` saves it silently,
    `WarningPolicy` only logs. Either way, a machine-in-the-middle presenting its own key instead of the
    real server''s is accepted transparently, defeating SSH host authentication (CWE-322). Use the default
    `RejectPolicy`, or pin the expected host key and verify it explicitly with a custom `paramiko.MissingHostKeyPolicy`
    subclass.'
