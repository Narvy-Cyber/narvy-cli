- id: narvy.python.xss.django-html-email-body-tainted.django-html-email-body-tainted
  message: An `EmailMessage` whose `content_subtype` is set to `"html"` is built from request data. Mail
    clients render this body as raw HTML with no equivalent of Django's template auto-escaping applied
    - if an attacker controls the value, they control the HTML/script that renders in whoever's inbox
    receives it (CWE-79, email-delivered XSS). Escape the value with `django.utils.html.escape()` before
