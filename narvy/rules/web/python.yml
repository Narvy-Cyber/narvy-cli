- id: narvy.python.nosqli.pymongo-filter-from-raw-request-json.pymongo-filter-from-raw-request-json
  message: 'A pymongo `find`/`find_one`/`update_one`/`delete_one` filter dict is built directly from `request.json`/`request.get_json()`
    without restricting it to expected scalar fields. MongoDB interprets keys starting with `$` inside
    a value position as query operators, so a client sending `{"password": {"$ne": null}}` instead of
    a string turns an equality check into "password is not null" - a classic NoSQL authentication-bypass
    primitive (CWE-943). Build the filter explicitly from named, type-checked fields instead of passing
    the request body through.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-943: Improper Neutralization of Special Elements in Data Query Logic'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - pymongo
    - mongodb
    - flask
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
    vulnerability_class:
    - SQL Injection
  patterns:
  - pattern-either:
    - pattern: $COLL.find(request.get_json())
    - pattern: $COLL.find_one(request.get_json())
    - pattern: $COLL.find(request.json)
    - pattern: $COLL.find_one(request.json)
    - pattern: $COLL.find(request.json[$X])
    - pattern: $COLL.find_one(request.json[$X])
    - pattern: $COLL.update_one(request.get_json(), ...)
    - pattern: $COLL.delete_one(request.get_json())
  - metavariable-regex:
      metavariable: $COLL
      regex: (?i)(collection|coll|db\.\w+)
- id: narvy.python.nosqli.pymongo-filter-value-from-request-arg.pymongo-filter-value-from-request-arg
  message: A pymongo query filter's *value* (not just the whole filter dict) is set directly to a raw
    request field (`request.args.get("id")`/`request.form["x"]`) without type coercion. If the client
    passes a JSON body instead of a query string, or the framework parses the value into a dict/list rather
    than a plain string, this reopens the same MongoDB operator-injection bypass (`$ne`, `$gt`, `$regex`)
    as a full raw filter would (CWE-943). Coerce the expected type explicitly (`str(...)`, `ObjectId(...)`)
    before using it in a filter.
  severity: WARNING
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-943: Improper Neutralization of Special Elements in Data Query Logic'
    owasp:
    - A03:2021 - Injection
    category: security
    subcategory:
    - vuln
    technology:
    - pymongo
    - mongodb
    - flask
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: LOW
    vulnerability_class:
    - SQL Injection
  patterns:
  - pattern-either:
    - pattern: '{$KEY: request.args.get($X)}'
    - pattern: '{$KEY: request.json.get($X)}'
    - pattern: '{$KEY: request.json[$X]}'
  - pattern-not: '{$KEY: str(request.args.get($X))}'
  - pattern-not: '{$KEY: int(request.args.get($X))}'
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i)("|')(username|user|email|password|role|admin|id|_id)("|')
- id: narvy.python.paramiko.connect-without-host-key-check.connect-without-host-key-check
  message: '`paramiko.client.SSHClient()` is used to connect without ever calling `set_missing_host_key_policy()`
    on it and without loading system/user known-hosts (`load_system_host_keys()` / `load_host_keys()`).
    paramiko''s own default policy in this state rejects unknown hosts, but a client built this way frequently
    gets "fixed" later by someone adding `AutoAddPolicy()` the first time it throws on an unrecognized
    host, silently reopening the man-in-the-middle exposure this rule''s sibling flags (CWE-322). Load
    a known_hosts file explicitly and keep the default `RejectPolicy`, or pin expected host keys.'
