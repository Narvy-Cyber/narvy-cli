  - pattern-either:
    - pattern: open(request.$KIND.$ATTR(...), ...)
    - pattern: open(request.$KIND[$X], ...)
    - pattern: open(f"...{request.$KIND.$ATTR(...)}...", ...)
    - pattern: open(os.path.join($BASE, request.$KIND.$ATTR(...)), ...)
