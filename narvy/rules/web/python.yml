- id: narvy.python.misc.insecure-file-permission.insecure-file-permission
  message: '`os.chmod()` / `os.open()` sets world-writable (and often world-readable) permissions (0o777
    / 0o666). Any local user or process can then modify or read this file, which is dangerous for config
    files, key material, or scripts that get executed later (CWE-732). Use the narrowest mode that works,
    e.g. 0o600 for secrets or 0o644 for regular files.'
  severity: WARNING
  languages:
  - python
