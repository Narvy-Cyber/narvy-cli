      regex: ^(args|form|values|GET|POST|json)$
- id: narvy.python.path-traversal.zipfile-extractall-untrusted.zipfile-extractall-untrusted-archive
  message: '`ZipFile.extractall()` is called on an archive that came from an upload/request/network fetch,
    with no per-member path check first. A malicious zip can contain entries with `../` path segments
    or absolute paths ("Zip Slip") that extract outside the target directory, overwriting arbitrary files
