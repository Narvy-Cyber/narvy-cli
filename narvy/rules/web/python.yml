- id: narvy.python.injection.response-header-crlf-injection.response-header-crlf-injection
  message: Request-derived data is written into a raw HTTP response header (`send_header()`, or a raw socket write of a header
    block). If the value can contain `\r\n` the attacker terminates the header early and appends headers or an entire second
    response - response splitting / header injection (CWE-113/CWE-93), which enables cache poisoning, session fixation via
    an injected `Set-Cookie`, and reflected XSS in the injected body. Strip or reject `\r` and `\n` before writing, or use
    a framework response object that rejects them for you.
  severity: ERROR
  languages:
  - python
