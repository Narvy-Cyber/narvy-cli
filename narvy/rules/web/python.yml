- id: narvy.python.crypto.ssl-wrap-socket-deprecated.ssl-wrap-socket-deprecated
  message: '`ssl.wrap_socket()` is used. This module-level helper performs no certificate validation and no hostname check
    by default (`cert_reqs=CERT_NONE`), so the connection is trivially man-in-the-middleable (CWE-295). It was deprecated
    in Python 3.7 and removed in 3.12. Build an `ssl.SSLContext` with `ssl.create_default_context()` and call `context.wrap_socket(sock,
    server_hostname=host)` instead.'
  severity: ERROR
  languages:
