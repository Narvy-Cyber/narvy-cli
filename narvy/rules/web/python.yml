    - pattern: $CLIENT.set_missing_host_key_policy(paramiko.client.WarningPolicy())
    - pattern: $CLIENT.set_missing_host_key_policy(paramiko.client.WarningPolicy)
    - pattern: $CLIENT.set_missing_host_key_policy(WarningPolicy())
    - pattern: $CLIENT.set_missing_host_key_policy(WarningPolicy)
- id: narvy.python.path-traversal.open-tainted-path.open-tainted-path
  message: '`open()` is called with a filesystem path built directly from request data. Without normalizing
    and validating the path stays inside an intended base directory, an attacker can supply `../../etc/passwd`-style
    segments to read (or, on a write-mode open, overwrite) arbitrary files reachable by the process (CWE-22).
    Resolve the path with `os.path.realpath()`, then verify it is a descendant of the intended base directory
    before opening.'
  severity: ERROR
  languages:
  - python
  metadata:
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    owasp:
