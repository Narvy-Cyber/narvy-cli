# Java security rules, authored by Narvy.
# Injection, path traversal, XSS, LDAP and XPath, TLS, CSRF, CORS, weak crypto.

rules:
- id: narvy.java.cmdi.runtime-exec-concat.runtime-exec-concat
  message: '`Runtime.getRuntime().exec(...)` is called with a command string built by `+` concatenation. When invoked with
    a single string argument, the JVM itself performs a naive shell-style tokenisation and any tainted operand can inject
    additional arguments or, on platforms that route through a shell, additional commands (CWE-78). Use the `exec(String[])`
    overload with the executable and each argument as a separate array element, and validate the executable against an allow-list.'
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  patterns:
  - pattern-either:
    - pattern: Runtime.getRuntime().exec($A + $B)
    - pattern: $RT.exec($A + $B)
  - pattern-not: Runtime.getRuntime().exec("..." + "...")
  - pattern-not: $RT.exec("..." + "...")
- id: narvy.java.cmdi.processbuilder-shell-flag.processbuilder-shell-flag
  message: '`ProcessBuilder` invokes a shell (`sh -c` / `bash -c` / `cmd.exe /c`) with a command string that is not a literal.
    Even though `ProcessBuilder` normally avoids shell interpretation, explicitly re-introducing a shell via `-c`/`/c` hands
    the tainted string to shell metacharacter expansion (`;`, `|`, `` ` ``, `$(...)`) (CWE-78). Invoke the target binary directly
    with its arguments as separate array elements instead of going through a shell.'
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    technology:
    - java
  patterns:
  - pattern-either:
    - pattern: new ProcessBuilder("sh", "-c", $X)
    - pattern: new ProcessBuilder("bash", "-c", $X)
    - pattern: new ProcessBuilder("/bin/sh", "-c", $X)
    - pattern: new ProcessBuilder("/bin/bash", "-c", $X)
    - pattern: new ProcessBuilder("cmd.exe", "/c", $X)
    - pattern: new ProcessBuilder("cmd", "/c", $X)
  - pattern-not: new ProcessBuilder("sh", "-c", "...")
  - pattern-not: new ProcessBuilder("bash", "-c", "...")
  - pattern-not: new ProcessBuilder("/bin/sh", "-c", "...")
  - pattern-not: new ProcessBuilder("/bin/bash", "-c", "...")
  - pattern-not: new ProcessBuilder("cmd.exe", "/c", "...")
  - pattern-not: new ProcessBuilder("cmd", "/c", "...")
- id: narvy.java.cmdi.tainted-request-param-to-exec.tainted-request-param-to-exec
  message: 'A value read directly from the HTTP request reaches `Runtime.exec`/`ProcessBuilder` as (part of) the command to
    execute, with no allow-list or escaping in between. This is a remote command injection path (CWE-78): an attacker who
    controls the request can run arbitrary OS commands with the application''s privileges. Validate the value against a strict
    allow-list before it reaches the process-spawning call, or avoid building the command from request data entirely.'
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: HIGH
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Runtime.getRuntime().exec($SINK)
      - pattern: Runtime.getRuntime().exec("..." + $SINK + "...")
      - pattern: $RT.exec($SINK)
      - pattern: new ProcessBuilder($SINK)
  pattern-sanitizers:
  - patterns:
    - pattern: Integer.parseInt(...)
- id: narvy.java.crlf.tainted-response-header.tainted-response-header
  message: A value read directly from the HTTP request is passed to `HttpServletResponse.setHeader`/`addHeader`/`sendRedirect`
    with no newline stripping. A tainted value containing `\r\n` injects extra response headers or splits the response into
    a second, attacker-defined one (HTTP response splitting, CWE-113); on Servlet containers that reject raw CR/LF in header
    values automatically this degrades to a caught exception, but code should not rely on the container to do that validation.
    Strip/reject `\r` and `\n` from the value before using it as a header.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-113: Improper Neutralization of CRLF Sequences in HTTP Headers (''HTTP Response Splitting'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $RESP.setHeader($NAME, $SINK)
      - pattern: $RESP.addHeader($NAME, $SINK)
      - pattern: $RESP.sendRedirect($SINK)
  pattern-sanitizers:
  - patterns:
    - pattern: $X.replaceAll(...)
  - patterns:
    - pattern: URLEncoder.encode(...)
- id: narvy.java.log-injection.tainted-request-param-in-log.tainted-request-param-in-log
  message: A value read directly from the HTTP request is written into a log statement with no newline neutralisation. An
    attacker can embed `\r\n` plus a fabricated log line to forge audit entries, or embed a payload that a downstream log
    viewer renders as HTML/JS if it does not escape (CWE-117). Strip/replace `\r`/`\n` before logging user-controlled values,
    or use a logging framework's structured/parameterised logging so the value is never spliced into the raw log line.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-117: Improper Output Neutralization for Logs'
    owasp:
    - A09:2021 - Security Logging and Monitoring Failures
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: logger.info("..." + $SINK + "...")
      - pattern: logger.warn("..." + $SINK + "...")
      - pattern: logger.error("..." + $SINK + "...")
      - pattern: log.info("..." + $SINK + "...")
      - pattern: log.warn("..." + $SINK + "...")
      - pattern: log.error("..." + $SINK + "...")
  pattern-sanitizers:
  - patterns:
    - pattern: $X.replaceAll(...)
- id: narvy.java.ldapi.tainted-search-filter.tainted-search-filter
  message: An LDAP search filter is built by concatenating a value read from the HTTP request into the filter string passed
    to `DirContext.search(...)`/`InitialDirContext`. An attacker can inject filter metacharacters (`*`, `)`, `(`, `|`, `&`)
    to alter the query logic (bypass an authentication check, enumerate directory entries) (CWE-90). Escape the value with
    `javax.naming.ldap` filter-escaping rules (escape `\`, `*`, `(`, `)`, NUL) before splicing it into the filter string,
    or build the filter with a library that parameterises LDAP queries.
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-90: Improper Neutralization of Special Elements used in an LDAP Query (''LDAP Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $CTX.search("..." + $SINK + "...", ...)
      - pattern: $CTX.search($SINK, ...)
  pattern-sanitizers:
  - patterns:
    - pattern: $X.replace(...)
- id: narvy.java.xpathi.tainted-xpath-expression.tainted-xpath-expression
  message: An XPath expression is built by concatenating a value read from the HTTP request into the expression string passed
    to `XPath.evaluate(...)` / `XPath.compile(...)`. An attacker can inject XPath syntax to bypass a login check or extract
    arbitrary nodes from the document (CWE-643). Use `XPath.setXPathVariableResolver(...)` with a bound variable instead of
    concatenating the tainted value into the expression text.
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-643: Improper Neutralization of Data within XPath Expressions (''XPath Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $XP.evaluate("..." + $SINK + "...", ...)
      - pattern: $XP.compile("..." + $SINK + "...")
- id: narvy.java.session.tainted-session-attribute-key.tainted-session-attribute-key
  message: 'A value read directly from the HTTP request is used as the SESSION ID (`request.getSession(...)` chained off a
    request-derived value, or a manual session-id cookie set from a request parameter) rather than letting the container generate
    one. Accepting an attacker-supplied session identifier is session fixation: the attacker sets a known ID, waits for the
    victim to authenticate under it, and reuses the same ID to hijack the now-authenticated session (CWE-384). Never accept
    a client-supplied value as the session identifier; regenerate the session ID on privilege change (login) with `request.changeSessionId()`.'
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-384: Session Fixation'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: LOW
    technology:
    - java
  patterns:
  - pattern-either:
    - pattern: new Cookie("JSESSIONID", $REQ.getParameter(...))
    - pattern: new Cookie("sessionid", $REQ.getParameter(...))
    - pattern: $RESP.addCookie(new Cookie("JSESSIONID", $X))
- id: narvy.java.ssrf.tainted-request-url-host.tainted-request-url-host
  message: A value read directly from the HTTP request is used as (or to build) the full target URL/host for an outbound HTTP
    call (`RestTemplate`, `HttpClient`, `URL`/`URLConnection`). An attacker can point the request at an internal-only service
    (metadata endpoint, admin panel, database admin UI) that is not reachable directly from outside the network - a server-side
    request forgery (CWE-918). Validate the target against an allow-list of expected hosts/schemes before making the request,
    and block requests to loopback/link-local/private ranges.
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-918: Server-Side Request Forgery (SSRF)'
    owasp:
    - A10:2021 - Server-Side Request Forgery (SSRF)
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $METHOD(..., @$ANNO(...) $TYPE $SRC, ...) {
            ...
          }
      - pattern-inside: |
          $METHOD(..., @$ANNO $TYPE $SRC, ...) {
            ...
          }
    - metavariable-regex:
        metavariable: $ANNO
        regex: (RequestParam|PathVariable|RequestHeader)
    - focus-metavariable: $SRC
  pattern-sanitizers:
  - patterns:
    - pattern: '"..." + $SAFE'
    - focus-metavariable: $SAFE
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $RT.getForObject($SINK, ...)
      - pattern: $RT.postForObject($SINK, ...)
      - pattern: $RT.exchange($SINK, ...)
      - pattern: new URL($SINK).openConnection()
      - pattern: new URL($SINK).openStream()
- id: narvy.java.reflection.tainted-classfor-name.tainted-classfor-name
  message: '`Class.forName(...)` (or `getMethod`/`getDeclaredMethod`) is invoked with a class or method name that traces back
    to HTTP request data. An attacker who controls the class/method name can instantiate or invoke an arbitrary class already
    on the classpath - useful both as an RCE gadget and as a way to bypass an intended allow-list of operations (CWE-470).
    Validate the name against an explicit allow-list before passing it to reflective APIs; never resolve a class/method purely
    from request input.'
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-470: Use of Externally-Controlled Input to Select Classes or Code (''Unsafe Reflection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: LOW
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Class.forName($SINK)
      - pattern: $CLS.getMethod($SINK, ...)
      - pattern: $CLS.getDeclaredMethod($SINK, ...)
- id: narvy.java.cookie.sensitive-cookie-flags-explicitly-false.sensitive-cookie-flags-explicitly-false
  message: A `Cookie` explicitly disables `HttpOnly` or `Secure` (`setHttpOnly(false)` / `setSecure(false)`). `HttpOnly` blocks
    JavaScript from reading the cookie (mitigates session-token theft via XSS); `Secure` stops the browser sending it over
    plaintext HTTP (CWE-1004, CWE-614). Only disable either flag if there is a specific, documented reason (e.g. a legacy
    HTTP-only integration) - otherwise set both to `true`.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-1004: Sensitive Cookie Without ''HttpOnly'' Flag'
    - 'CWE-614: Sensitive Cookie in HTTPS Session Without ''Secure'' Attribute'
    owasp:
    - A05:2021 - Security Misconfiguration
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: HIGH
    technology:
    - java
  patterns:
  - pattern-either:
    - pattern: $C.setHttpOnly(false)
    - pattern: $C.setSecure(false)
- id: narvy.java.open-redirect.tainted-sendredirect.tainted-sendredirect
  message: '`HttpServletResponse.sendRedirect(...)` is called with a value read directly from the HTTP request. An attacker
    can craft a link to the trusted site that redirects the victim''s browser to an arbitrary external URL - useful for phishing
    and OAuth token theft (CWE-601). Validate the target against an allow-list of known-good paths/hosts, or only permit relative
    paths within the application.'
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-601: URL Redirection to Untrusted Site (''Open Redirect'')'
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: LOW
    confidence: MEDIUM
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $RESP.sendRedirect($SINK)
      - pattern: $RESP.sendRedirect("..." + $SINK)
      - pattern: $RESP.setHeader("Location", $SINK)
- id: narvy.java.pathtraversal.tainted-request-param-to-file.tainted-request-param-to-file
  message: A value read directly from the HTTP request (`getParameter`, `getHeader`, `getPathInfo`) is used to build a `File`/file
    stream without validating that the resolved path stays inside the intended directory. A value containing `../` segments
    (or an absolute path) lets an attacker read or write files outside the intended directory (CWE-22). Resolve the path,
    canonicalise it, and verify with `startsWith(...)` that it stays inside the allowed base directory before use.
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getPathInfo()
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: new File($BASE, $SINK)
      - pattern: new File($SINK)
      - pattern: new FileInputStream($SINK)
      - pattern: new FileOutputStream($SINK)
      - pattern: Files.newInputStream(Paths.get($SINK))
      - pattern: Files.newOutputStream(Paths.get($SINK))
      - pattern: Paths.get($BASE, $SINK)
  pattern-sanitizers:
  - patterns:
    - pattern: $P.normalize()
  - patterns:
    - pattern: $P.toRealPath()
  - patterns:
    - pattern: FilenameUtils.getName(...)
- id: narvy.java.pathtraversal.jaxrs-pathparam-to-file.jaxrs-pathparam-to-file
  message: 'A JAX-RS `@PathParam`/`@QueryParam` value flows into a `File`/`Path` constructor with no canonicalisation or allow-list
    check. Same risk as the Servlet case: a `../` segment escapes the intended base directory (CWE-22). Canonicalise the resolved
    path and verify it stays under the expected base directory before opening it.'
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: LOW
    technology:
    - java
  patterns:
  - pattern-either:
    - pattern: "public $RET $METHOD(@PathParam(...) $T $NAME, ...) {\n  ...\n  new File($BASE, $NAME);\n  ...\n}\n"
    - pattern: "public $RET $METHOD(@QueryParam(...) $T $NAME, ...) {\n  ...\n  new File($BASE, $NAME);\n  ...\n}\n"
- id: narvy.java.pathtraversal.zip-entry-no-canonical-check.zip-entry-no-canonical-check
  message: A `ZipInputStream`/`ZipFile` entry name is used to build an output `File` path with no check that the resulting
    path stays inside the destination directory. A crafted archive entry named `../../evil.sh` (a "Zip Slip") writes outside
    the intended extraction directory (CWE-22). Resolve the entry path against the destination directory, canonicalise it,
    and reject any entry whose resolved path escapes that directory.
  severity: ERROR
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  patterns:
  - pattern-either:
    - pattern: '$ENTRY = $ZIS.getNextEntry();

        ...

        $OUT = new File($DESTDIR, $ENTRY.getName());

        ...

        '
    - pattern: '$NAME = $ENTRY.getName();

        ...

        $OUT = new File($DESTDIR, $NAME);

        ...

        '
  - pattern-not: '$ENTRY = $ZIS.getNextEntry();

      ...

      $OUT = new File($DESTDIR, $ENTRY.getName());

      ...

      if (!$OUT.getCanonicalPath().startsWith(...)) { ... }

      ...

      '
- id: narvy.java.crypto.plaintext-socket-construction.plaintext-socket-construction
  message: A plain `java.net.Socket`/`java.net.ServerSocket` is constructed directly. Everything sent or received on it travels
    unencrypted, so anyone who can observe the network path can read or tamper with the traffic (CWE-319). This is an audit-level
    flag, not a proven bug - a loopback-only or already-tunnelled connection is fine as-is, but if this socket carries credentials,
    tokens, or other sensitive data over a network that is not otherwise trusted, wrap it with `SSLSocketFactory` / `SSLServerSocketFactory`
    (or an equivalent TLS-terminating client) instead of the bare constructor.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    owasp:
    - A02:2021 - Cryptographic Failures
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - java
  patterns:
  - pattern-either:
    - pattern: new Socket(...)
    - pattern: new ServerSocket(...)
- id: narvy.java.sqli.sprintf-var-to-jdbc-statement.sprintf-var-to-jdbc-statement
  message: A SQL string built with `String.format(...)` (with real substitution arguments, not just a literal) is assigned
    to a variable that later reaches a plain JDBC `Statement`/`PreparedStatement` call. `String.format` does not escape SQL
    metacharacters, so if any of the substituted values is not fully trusted, this is a SQL injection (CWE-89). Build the
    query text as a fixed literal and bind the dynamic parts with `?` placeholders and `setString`/`setInt`/etc instead of
    formatting them into the text.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  patterns:
  - pattern-either:
    - patterns:
      - pattern: '$Q = String.format(...);

          ...

          $STMT.executeQuery($Q);

          '
      - pattern-not: '$Q = String.format("...");

          ...

          $STMT.executeQuery($Q);

          '
    - patterns:
      - pattern: '$Q = String.format(...);

          ...

          $STMT.executeUpdate($Q);

          '
      - pattern-not: '$Q = String.format("...");

          ...

          $STMT.executeUpdate($Q);

          '
    - patterns:
      - pattern: '$Q = String.format(...);

          ...

          $STMT.execute($Q);

          '
      - pattern-not: '$Q = String.format("...");

          ...

          $STMT.execute($Q);

          '
    - patterns:
      - pattern: '$Q = String.format(...);

          ...

          $CONN.prepareStatement($Q);

          ...

          $P.$EXECFUNC(...);

          '
      - pattern-not: '$Q = String.format("...");

          ...

          $CONN.prepareStatement($Q);

          ...

          $P.$EXECFUNC(...);

          '
      - metavariable-regex:
          metavariable: $EXECFUNC
          regex: (?i)^execute
- id: narvy.java.sqli.plus-var-to-jdbc-statement.plus-var-to-jdbc-statement
  message: A SQL string is built with `+` concatenation, assigned to a variable, then that variable is later passed to a JDBC
    `Statement.execute*` call. This is the same defect `Statement`/`+`-inline concatenation already covers, but reached through
    a separate assignment instead of the concatenation sitting directly in the call argument - splitting it across two statements
    does not change the risk (CWE-89). Use a `PreparedStatement` with `?` placeholders instead of assembling the query text
    yourself.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    technology:
    - java
  patterns:
  - pattern-either:
    - patterns:
      - pattern: '$Q = $A + $B;

          ...

          $STMT.executeQuery($Q);

          '
      - pattern-not: '$Q = "..." + "...";

          ...

          $STMT.executeQuery($Q);

          '
    - patterns:
      - pattern: '$Q = $A + $B;

          ...

          $STMT.executeUpdate($Q);

          '
