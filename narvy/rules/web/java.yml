- id: narvy.java.xss.servlet-writer-tainted-request-param.servlet-writer-tainted-request-param
  message: A value read from the HTTP request (`getParameter`, `getHeader`, `getQueryString`) is written to `HttpServletResponse.getWriter()`
    (or `getOutputStream()`) without HTML-escaping. The value is reflected into the response body verbatim; an attacker who
    controls it can inject `<script>` or event-handler markup (CWE-79). Escape with an HTML encoder (`org.owasp.encoder.Encode.forHtml(...)`)
    before writing, or render through a templating engine that auto-escapes.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site Scripting'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - java
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getQueryString()
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $RESP.getWriter().write($SINK)
      - pattern: $RESP.getWriter().print($SINK)
      - pattern: $RESP.getWriter().println($SINK)
      - pattern: $RESP.getOutputStream().print($SINK)
      - pattern: $W.write($SINK)
      - pattern: $W.print($SINK)
  pattern-sanitizers:
  - patterns:
    - pattern: org.owasp.encoder.Encode.forHtml(...)
  - patterns:
    - pattern: Encode.forHtml(...)
  - patterns:
    - pattern: StringEscapeUtils.escapeHtml4(...)
  - patterns:
    - pattern: HtmlUtils.htmlEscape(...)
  - patterns:
    - pattern: Integer.parseInt(...)
- id: narvy.java.xss.modelandview-tainted-attribute.modelandview-tainted-attribute
  message: A request parameter is added to a `ModelAndView`/`Model` attribute and the view is a `text/*` or a hand-built HTML
    string view (not a `Thymeleaf`/`JSP` template that auto-escapes with `${...}`). If the rendering layer does not HTML-escape
    model attributes, this is a reflected-XSS sink (CWE-79). Confirm the view technology escapes by default, or escape the
    value before adding it to the model.
  severity: WARNING
  languages:
  - java
  metadata:
    category: security
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site Scripting'')'
    owasp:
    - A03:2021 - Injection
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    technology:
    - java
    - spring
  patterns:
  - pattern-either:
    - pattern: $MODEL.addAttribute($KEY, $REQ.getParameter(...))
    - pattern: $MAV.addObject($KEY, $REQ.getParameter(...))
