    patterns:
      - pattern-either:
          - pattern: $(...).html($X)
          - pattern: $EL.html($X)
      - pattern-not: $(...).html("...")
      - pattern-not: $EL.html("...")
      - pattern-not: $(...).html()
      - pattern-not: $EL.html()
      - pattern-not: $EL.html($SANITIZER.sanitize(...))
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: "..."

  # Rule 5: React dangerouslySetInnerHTML without a recognized sanitizer
  - id: narvy.javascript.xss.react-dangerously-set-innerhtml.react-dangerously-set-innerhtml
    message: >-
      `dangerouslySetInnerHTML` is set to a value that does not come from a
      recognized sanitizer call (DOMPurify.sanitize / sanitizeHtml). React
      does not escape this value; it is injected as raw HTML. If it
      contains attacker-controlled data this is stored/reflected XSS
      (CWE-79). Wrap the value with `DOMPurify.sanitize(...)` before use.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, react]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern: '<$EL dangerouslySetInnerHTML={{__html: $X}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: "..."}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(...)}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: $ANY.sanitize(...)}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: sanitizeHtml(...)}} />'

# XSS

  # Reflected request value written into an HTML response (taint); focus $SINK, HTML-context regex; res.json/res.render excluded.
  - id: narvy.javascript.xss.reflected-request-value-in-html-response.reflected-request-value-in-html-response
    message: >-
      A request value (query/params/body/headers/cookies) reaches an HTML
      string passed to res.send/res.write/res.end with no escaping. Reflected
      Cross-Site Scripting (CWE-79). Escape the value for HTML context (a
      templating engine's auto-escaping, or a helper like `escape-html`)
      before writing it into the response body.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      references:
        - https://cwe.mitre.org/data/definitions/79.html
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      - patterns:
          - pattern: $REQ.$KIND.$X
          - metavariable-regex:
              metavariable: $KIND
              regex: ^(body|params|query|headers|cookies)$
    pattern-sanitizers:
      - pattern: escapeHtml(...)
      - pattern: escapeHTML(...)
      - pattern: escape(...)
      - pattern: $M.escapeHtml(...)
      - pattern: $M.escapeHTML(...)
      - pattern: $M.escape(...)
      - pattern: sanitizeHtml(...)
      - pattern: $M.sanitize(...)
      - pattern: $M.sanitizeHtml(...)
      - pattern: encodeURIComponent(...)
      - pattern: encodeURI(...)
      - pattern: parseInt(...)
      - pattern: Number(...)
      # JSON.stringify output is used for embedding data, not raw markup.
      - pattern: JSON.stringify(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($SINK, ...)
              - pattern: $RES.write($SINK, ...)
              - pattern: $RES.end($SINK, ...)
          - focus-metavariable: $SINK
          - metavariable-regex:
              metavariable: $SINK
              regex: '(?s).*<\s*[a-zA-Z!/].*'
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"

  # Rule 6b: reflected value built into a variable then written to response; requires request value + HTML markup in one RHS.
  - id: narvy.javascript.xss.reflected-request-value-in-html-response-var-indirect.reflected-request-value-in-html-response-var-indirect
    message: >-
      A request value (query/params/body/headers/cookies) is concatenated /
      interpolated into an HTML string held in a variable and then written
      to the response via res.send/res.write/res.end. Reflected Cross-Site
      Scripting (CWE-79), with one level of variable indirection. Escape the
      value for the HTML context before writing it into the response.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      references:
        - https://cwe.mitre.org/data/definitions/79.html
    patterns:
      - pattern-either:
          # concatenation carrying request data + an HTML-markup string
          - patterns:
              - pattern: |
                  $H = <... $REQ.$KIND.$X ...>
                  ...
                  $RES.$M($H, ...)
              - pattern: |
                  $H = <... "$MARKUP" ...>
                  ...
                  $RES.$M($H, ...)
              - metavariable-regex:
                  metavariable: $MARKUP
                  regex: '(?s).*<\s*[a-zA-Z!/].*'
          # template literal carrying request data, markup in its text
          - patterns:
              - pattern: |
                  $H = `...${$REQ.$KIND.$X}...`
                  ...
                  $RES.$M($H, ...)
              - pattern: |
                  $H = $TMPL
                  ...
                  $RES.$M($H, ...)
              - metavariable-regex:
                  metavariable: $TMPL
                  regex: '(?s).*<\s*[a-zA-Z!/].*'
      - metavariable-regex:
          metavariable: $KIND
          regex: ^(body|params|query|headers|cookies)$
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(send|write|end)$
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"

  # Rule 7: Angular DomSanitizer.
  # bypassSecurityTrust*() with a non-literal argument.
  - id: narvy.javascript.xss.angular-bypass-security-trust.angular-bypass-security-trust
    message: >-
      Angular's DomSanitizer.bypassSecurityTrust*() is called with a
      non-literal value. These methods exist specifically to turn OFF
      Angular's built-in sanitization for the value they wrap - marking
      attacker-influenced data as "trusted" reintroduces DOM-based XSS
      that Angular would otherwise have blocked (CWE-79). Sanitize the
      value yourself first (or better, avoid needing to bypass
      sanitization at all) before wrapping it.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [angular, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern-either:
          - pattern: $SANITIZER.bypassSecurityTrustHtml($X)
          - pattern: $SANITIZER.bypassSecurityTrustUrl($X)
          - pattern: $SANITIZER.bypassSecurityTrustResourceUrl($X)
          - pattern: $SANITIZER.bypassSecurityTrustScript($X)
          - pattern: $SANITIZER.bypassSecurityTrustStyle($X)
      - pattern-not: $SANITIZER.bypassSecurityTrustHtml("...")
      - pattern-not: $SANITIZER.bypassSecurityTrustUrl("...")
      - pattern-not: $SANITIZER.bypassSecurityTrustResourceUrl("...")
      - pattern-not: $SANITIZER.bypassSecurityTrustScript("...")
      - pattern-not: $SANITIZER.bypassSecurityTrustStyle("...")
      - pattern-not: $SANITIZER.bypassSecurityTrustHtml(`...`)
      - pattern-not: $SANITIZER.bypassSecurityTrustUrl(`...`)
      - pattern-not: $SANITIZER.bypassSecurityTrustResourceUrl(`...`)
      - pattern-not: $SANITIZER.bypassSecurityTrustScript(`...`)
      - pattern-not: $SANITIZER.bypassSecurityTrustStyle(`...`)

# XXE

  - id: narvy.javascript.xxe.libxmljs-noent-enabled.libxmljs-noent-enabled
    message: >-
      libxmljs is called with `noent: true`, which turns on external
      entity substitution while parsing XML. If the XML document being
      parsed can be influenced by an attacker, this allows XML External
      Entity injection (CWE-611): reading local files via a crafted
      `<!ENTITY>` declaration, or triggering out-of-band requests from
      the server. Remove `noent: true` unless entity substitution is
      required, and if it is, first strip any `<!DOCTYPE` declaration
      from untrusted input before parsing.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp:
        - "A05:2021 - Security Misconfiguration"
        - "A04:2017 - XML External Entities (XXE)"
      category: security
      subcategory: [vuln]
      technology: [libxmljs, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - XML Injection
      references:
        - https://cwe.mitre.org/data/definitions/611.html
        - https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing
    patterns:
      - pattern-either:
          - pattern: '$LIBXML.parseXml($DATA, {..., noent: true, ...})'
          - pattern: '$LIBXML.parseXmlString($DATA, {..., noent: true, ...})'

  - id: narvy.javascript.xxe.libxmljs-dtd-load-enabled.libxmljs-dtd-load-enabled
    message: >-
      libxmljs is called with `dtdload: true` or `dtdvalid: true`, which
      allows the parser to fetch an external DTD referenced in the
      document. If the XML being parsed is attacker-controlled this
      enables blind/out-of-band XXE (CWE-611): the server will make a
      network or file request to a URL the attacker put in the DOCTYPE.
      Remove dtdload/dtdvalid for untrusted input, or restrict outbound
      network access from the parsing process.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [libxmljs, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - XML Injection
    patterns:
      - pattern-either:
          - pattern: '$LIBXML.parseXml($DATA, {..., dtdload: true, ...})'
          - pattern: '$LIBXML.parseXmlString($DATA, {..., dtdload: true, ...})'
          - pattern: '$LIBXML.parseXml($DATA, {..., dtdvalid: true, ...})'
          - pattern: '$LIBXML.parseXmlString($DATA, {..., dtdvalid: true, ...})'

# COMMAND INJECTION

  # 1. exec / execSync with request data concatenated into the command.
  - id: narvy.javascript.cmdi.child-process-exec-concat.child-process-exec-concat
    message: >-
      A request-derived value is concatenated into the command string
      passed to child_process.exec/execSync. exec runs the string through
      a shell, so shell metacharacters in the request (`;`, `|`, `&&`,
      backticks) let an attacker run arbitrary OS commands (CWE-78). Use
      execFile/execFileSync with an argument array instead of a shell
      string, or strictly allow-list the input.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [nodejs, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Command Injection
      references:
        - https://cwe.mitre.org/data/definitions/78.html
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec("$CMD" + $REQ.$KIND.$X + ..., ...)
                  - pattern: $CP.exec(`...${$REQ.$KIND.$X}...`, ...)
                  - pattern: $CP.execSync("$CMD" + $REQ.$KIND.$X + ...)
                  - pattern: $CP.execSync(`...${$REQ.$KIND.$X}...`)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      $CP.exec("$CMD" + $V + ..., ...)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      $CP.exec(`...${$V}...`, ...)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      $CP.execSync("$CMD" + $V + ...)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      $CP.execSync(`...${$V}...`)
                  # Destructured `const { exec } = require('child_process')` then bare exec(), gated on the taint shape.
                  - pattern: exec("$CMD" + $REQ.$KIND.$X, ...)
                  - pattern: exec("$CMD" + $REQ.$KIND.$X + ..., ...)
                  - pattern: exec(`...${$REQ.$KIND.$X}...`, ...)
                  # Taint last with nothing after it; covers receiver, destructured execSync, one level of indirection.
                  - pattern: $CP.exec("$CMD" + $REQ.$KIND.$X, ...)
                  - pattern: $CP.execSync("$CMD" + $REQ.$KIND.$X)
                  - pattern: execSync("$CMD" + $REQ.$KIND.$X)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      $CP.exec("$CMD" + $V, ...)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      $CP.execSync("$CMD" + $V)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      exec("$CMD" + $V, ...)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      execSync("$CMD" + $V)
              - metavariable-regex:
                  metavariable: $KIND
                  regex: ^(query|params|body|headers|cookies)$
          # AWS Lambda taint source: event.queryStringParameters/.pathParameters/.headers into the command string.
          - patterns:
              - pattern-either:
                  - pattern: $CP.exec("$CMD" + $EVENT.$EKIND.$X + ..., ...)
                  - pattern: $CP.exec(`...${$EVENT.$EKIND.$X}...`, ...)
                  - pattern: $CP.execSync("$CMD" + $EVENT.$EKIND.$X + ...)
                  - pattern: $CP.execSync(`...${$EVENT.$EKIND.$X}...`)
                  - pattern: |
                      $V = $EVENT.$EKIND.$X
                      ...
                      $CP.exec("$CMD" + $V + ..., ...)
                  - pattern: |
                      $V = $EVENT.$EKIND.$X
                      ...
                      $CP.execSync("$CMD" + $V + ...)
                  - pattern: exec("$CMD" + $EVENT.$EKIND.$X, ...)
                  - pattern: exec("$CMD" + $EVENT.$EKIND.$X + ..., ...)
                  - pattern: exec(`...${$EVENT.$EKIND.$X}...`, ...)
              - metavariable-regex:
                  metavariable: $EKIND
                  regex: ^(queryStringParameters|pathParameters|headers|multiValueQueryStringParameters|multiValueHeaders)$
          # event.body is flat, own branch with no $EKIND regex.
          - pattern-either:
              - pattern: $CP.exec("$CMD" + $EVENT.body + ..., ...)
              - pattern: $CP.exec("$CMD" + JSON.parse($EVENT.body).$X + ..., ...)

  # 2. spawn/execFile with shell: true and a tainted command/argument.
  - id: narvy.javascript.cmdi.spawn-shell-true-tainted.spawn-shell-true-tainted
    message: >-
      child_process.spawn/execFile is called with `shell: true` and a
      command or argument derived from the request. With shell: true the
      command line is interpreted by a shell, so request-controlled
      shell metacharacters allow OS command injection (CWE-78). Drop
      shell: true and pass the command and arguments as a plain array,
      or allow-list the accepted values.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [nodejs, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Command Injection
    pattern-sources:
      - pattern: req.query.$Q
      - pattern: req.params.$P
      - pattern: req.body.$B
      # AWS Lambda taint source, additional to the Express req source above.
      - pattern: event.queryStringParameters.$Q
      - pattern: event.pathParameters.$P
      - pattern: event.body
      - pattern: event.headers.$H
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$CP.spawn($SINK, ..., {..., shell: true, ...})'
              - pattern: '$CP.spawn($CMD, [..., $SINK, ...], {..., shell: true, ...})'
              - pattern: '$CP.execFile($SINK, ..., {..., shell: true, ...})'

  # 3. spawn/spawnSync with shell: true, untainted broad companion to the tainted rule.
  - id: narvy.javascript.lang.security.spawn-shell-true.spawn-shell-true
    message: >-
      spawn / spawnSync called with `{shell: true}` runs the command
      through a shell (sh / cmd.exe), enabling command injection if any
      of the arguments are user-controlled. Drop `shell: true` and pass
      arguments as an array - execve() bypasses the shell entirely.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-78: OS Command Injection"
      owasp: ["A03:2021 - Injection"]
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Command Injection
    patterns:
      - pattern-either:
          - pattern: |
              $CP.spawn($X, $Y, {..., shell: true, ...})
          - pattern: |
              $CP.spawnSync($X, $Y, {..., shell: true, ...})
          - pattern: |
              spawn($X, $Y, {..., shell: true, ...})
          - pattern: |
              spawnSync($X, $Y, {..., shell: true, ...})

# Dynamic code execution (eval / new Function / vm module / setTimeout with
# a string) is covered separately in code_injection.yml in this same pack.

# CODE INJECTION

  # Rule 1: eval() with non-literal argument
  - id: narvy.javascript.code-injection.eval-non-literal.eval-non-literal
    message: >-
      `eval()` called with a non-literal argument. eval() executes its
      argument as JavaScript with full privileges of the calling context.
      If the value is attacker-influenced this is remote code execution
      (CWE-94). Remove eval() and use JSON.parse for data, or a safe
      dispatch table for logic selection.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Code Injection
    patterns:
      - pattern: eval($X)
      - pattern-not: eval("...")
      - pattern-not: eval(`...`)

  # Rule 2: new Function(...) with non-literal body
  - id: narvy.javascript.code-injection.dynamic-function-constructor.dynamic-function-constructor
    message: >-
      `new Function(...)` constructs and compiles a function from string
      arguments at runtime - functionally equivalent to eval(). If any
      argument (especially the final one, the function body) is
      attacker-influenced this is remote code execution (CWE-94). Avoid
      the Function constructor with dynamic input.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Code Injection
    patterns:
      - pattern: new Function(...)
      - pattern-not: new Function("...")
      - pattern-not: new Function()

  # Rule 3: vm module running non-literal script string
  - id: narvy.javascript.code-injection.vm-run-non-literal.vm-run-non-literal
    message: >-
      Node `vm` module executes a non-literal script string
      (runInNewContext / runInContext / runInThisContext). Although `vm`
      is sandboxed for global scope, it is not a real security boundary
      against a determined attacker and does not restrict CPU/memory. If
      the script text is attacker-influenced this is code execution
      (CWE-94). Never pass untrusted input to `vm.run*`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, node-vm]
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Code Injection
    patterns:
      - pattern-either:
          - pattern: vm.runInNewContext($X, ...)
          - pattern: vm.runInContext($X, ...)
          - pattern: vm.runInThisContext($X, ...)
          - pattern: $VM.runInNewContext($X, ...)
      - pattern-not: vm.runInNewContext("...", ...)
      - pattern-not: vm.runInContext("...", ...)
      - pattern-not: vm.runInThisContext("...", ...)

  # Rule 4: setTimeout/setInterval with a string (implicit eval)
  - id: narvy.javascript.code-injection.settimeout-string-arg.settimeout-string-arg
    message: >-
      `setTimeout` / `setInterval` called with a STRING as the first
      argument instead of a function reference. The engine compiles and
      runs the string as code (implicit eval) when the timer fires. If the
      string is built from attacker-influenced data this is code injection
      (CWE-94). Pass a function/arrow-function reference instead.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript]
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Code Injection
    patterns:
      - pattern-either:
          - pattern: setTimeout($X + ..., $MS)
          - pattern: setTimeout(`...${$Y}...`, $MS)
          - pattern: setInterval($X + ..., $MS)
          - pattern: setInterval(`...${$Y}...`, $MS)

# ADDITIONAL COVERAGE: JWT verification, token storage, headless-browser
# SSRF, javascript: URIs, jQuery markup sinks, unsafe deserialization, ReDoS.

  # jwt.decode() where jwt.verify() belongs: fires only when the token is request-derived and no .verify() appears in the enclosing function.
  - id: narvy.javascript.jwt.decode-without-verify.decode-without-verify
    message: >-
      A request-supplied JWT is parsed with `jwt.decode()` and no
      `jwt.verify()` runs in the same function. `decode` does NOT check the
      signature: an attacker can forge any claim (user id, role, expiry) by
      editing the token payload. Authentication bypass / privilege
      escalation (CWE-347). Use `jwt.verify(token, key, {algorithms: [...]})`
      and read the claims from its return value.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
        - "CWE-287: Improper Authentication"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [jsonwebtoken, jwt, express, nodejs, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Improper Authentication
      references:
        - https://cwe.mitre.org/data/definitions/347.html
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.get("...")
              - pattern: $REQ.header("...")
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      - patterns:
          - pattern: $REQ.$KIND.$X
          - metavariable-regex:
              metavariable: $KIND
              regex: ^(body|params|query|headers|cookies)$
    pattern-sinks:
      - patterns:
          - pattern: $JWT.decode($SINK, ...)
          - focus-metavariable: $SINK
          - metavariable-regex:
              metavariable: $JWT
              regex: ^(jwt|jsonwebtoken|jsonWebToken|JWT|jwtLib)$
          # A .verify() anywhere in the function clears the finding; free $V receiver also matches wrappers.
          - pattern-not-inside: |
              function $F(...) {
                ...
                $V.verify(...)
                ...
              }
          - pattern-not-inside: |
              (...) => {
                ...
                $V.verify(...)
                ...
              }
          - pattern-not-inside: |
              async (...) => {
                ...
                $V.verify(...)
                ...
              }
          - pattern-not-inside: |
              $F(...) {
                ...
                $V.verify(...)
                ...
              }
          - pattern-not-inside: |
              try {
                ...
                $V.verify(...)
                ...
              } catch($E) {
                ...
              }
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.spec.js"
        - "**/*.spec.ts"

  # Bearer/refresh token in localStorage: readable by any script, no expiry/HttpOnly/SameSite; key-name allow-list separates credentials from UI state.
  - id: narvy.javascript.jwt.token-in-localstorage.token-in-localstorage
    message: >-
      An authentication token is written to `localStorage`. Anything stored
      there is readable by every script on the origin, survives the browser
      session, and cannot be protected with HttpOnly/SameSite - so a single
      XSS anywhere on the site steals a long-lived credential (CWE-522).
      Prefer an HttpOnly + Secure + SameSite cookie, or keep the access
      token in memory only.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-522: Insufficiently Protected Credentials"
        - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      subcategory: [audit]
      technology: [browser, jwt, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Insecure Storage
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem("$KEY", $V)
          - pattern: window.localStorage.setItem("$KEY", $V)
          - pattern: $S.localStorage.setItem("$KEY", $V)
          - pattern: localStorage["$KEY"] = $V
          - pattern: window.localStorage["$KEY"] = $V
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i)^[a-z0-9_.-]*(jwt|access[_-]?token|id[_-]?token|refresh[_-]?token|bearer|auth[_-]?token|session[_-]?token|api[_-]?key)[a-z0-9_.-]*$'
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.spec.js"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"

  # Authorization decision on a client-side decoded (unverified) JWT claim; fires only when the claim drives a conditional and is authz-shaped.
  - id: narvy.javascript.jwt.unverified-claim-authorization.unverified-claim-authorization
    message: >-
      An authorization decision is made on a claim read from a
      client-side-DECODED JWT. `jwt-decode` / `decodeJwt` do not verify the
      signature, so the user can edit the claim in their own token and take
      the privileged branch (CWE-347). Client-side decoding is fine for
      display, but every authorization check must happen server-side on a
      signature-verified token.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
        - "CWE-602: Client-Side Enforcement of Server-Side Security"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      technology: [jwt-decode, jose, browser, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Improper Authorization
    patterns:
      - pattern-either:
          - pattern: if (<... $DEC(...).$CLAIM ...>) { ... }
          - pattern: |
              $C = $DEC(...);
              ...
              if (<... $C.$CLAIM ...>) { ... }
      - metavariable-regex:
          metavariable: $DEC
          regex: ^(jwtDecode|jwt_decode|jwtDecoder|decodeJwt|decodeToken|parseJwt)$
      - metavariable-regex:
          metavariable: $CLAIM
          regex: ^(role|roles|isAdmin|is_admin|admin|scope|scopes|permissions|perms|privileges|isStaff|is_staff|groups)$

  # SSRF via headless browser .goto()/.setContent(): the server fetches the URL; sanitizers mirror request-url-from-user.
  - id: narvy.javascript.ssrf.headless-browser-tainted-url.headless-browser-tainted-url
    message: >-
      A request-derived value reaches a headless-browser navigation sink
      (puppeteer / playwright `page.goto` or `page.setContent`). The SERVER's
      browser fetches it, so an attacker can reach cloud metadata endpoints,
      localhost admin ports and other internal services - Server-Side
      Request Forgery (CWE-918). Validate the URL against an allow-list of
      hosts and schemes, and run the browser with egress restricted.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      subcategory: [vuln]
      technology: [puppeteer, playwright, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.params
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      - patterns:
          - pattern: $REQ.$KIND.$X
          - metavariable-regex:
              metavariable: $KIND
              regex: ^(body|params|query|headers|cookies)$
    pattern-sanitizers:
      - pattern: safeFetch(...)
      - pattern: isAllowedUrl(...)
      - pattern: isAllowedHost(...)
      - pattern: isSafeUrl(...)
      - pattern: validateUrl(...)
      - pattern: validateHost(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (<... $ALLOW.includes(...) ...>) { ... }
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$GUARD($V)) { ... }
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$GUARD($V)) return ...;
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$ALLOW.includes($V)) { ... }
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$ALLOW.includes($V)) return ...;
              ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $PAGE.goto($SINK, ...)
              - pattern: $PAGE.setContent($SINK, ...)
          - focus-metavariable: $SINK

  # `javascript:` URI reaching an href/src sink; regex requires a dynamic part so void(0)/; literals are ignored.
  - id: narvy.javascript.xss.javascript-uri-href-sink.javascript-uri-href-sink
    message: >-
      A `javascript:` URI with an interpolated/concatenated value is
      assigned to an href/src sink. Whatever reaches the interpolation is
      executed as script when the link is followed, so any
      attacker-influenced value there is XSS (CWE-79). Build the handler in
      JS (`addEventListener`) instead of encoding it into a URI, and never
      assign a `javascript:` scheme from data.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [browser, react, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern-either:
          - pattern: $EL.href = $X
          - pattern: $EL.src = $X
          - pattern: $EL.setAttribute("href", $X)
          - pattern: $EL.setAttribute("src", $X)
          - pattern: $EL.setAttribute("xlink:href", $X)
          - pattern: <$TAG href={$X} ...>...</$TAG>
          - pattern: <$TAG href={$X} ... />
          - pattern: <$TAG src={$X} ...>...</$TAG>
          - pattern: <$TAG src={$X} ... />
      - metavariable-regex:
          metavariable: $X
          regex: '(?s)^["''`]\s*javascript\s*:.*(\$\{|["''`]\s*\+).*'

  # jQuery markup-insertion sinks beyond .html(); guards: string/template arg, contains markup, at least one raw-data operand.
  - id: narvy.javascript.xss.jquery-markup-insertion.jquery-markup-insertion
    message: >-
      A jQuery markup-insertion method is called with an HTML string built
      by concatenation/interpolation. Like `.html()`, these methods PARSE
      their string argument as markup, so any unescaped value in it is
      DOM-based or stored XSS (CWE-79). Insert text with `.text()`, build
      nodes with `$("<tag>").text(value)`, or sanitize with DOMPurify.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [jquery, browser, javascript, typescript]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern: $EL.$M($ARG)
      - metavariable-regex:
          metavariable: $M
          regex: ^(append|prepend|after|before|replaceWith|wrap|wrapInner)$
      # Guard 1: a string/template expression, not a node or jQuery object.
      - metavariable-regex:
          metavariable: $ARG
          regex: '(?s)^["''`].*'
      # Guard 2: it actually contains markup.
      - metavariable-regex:
          metavariable: $ARG
          regex: '(?s).*<\s*[a-zA-Z/].*'
      # Guard 3: at least one raw-data operand, not only formatted/encoded call results.
      - metavariable-regex:
          metavariable: $ARG
          regex: '(?s).*(\+\s*[A-Za-z_$][A-Za-z0-9_$.\[\]]*\s*(\+|$)|\$\{\s*[A-Za-z_$][A-Za-z0-9_$.\[\]]*\s*\}).*'
      - pattern-not: $EL.$M($SAN.sanitize(...))
      - pattern-not: $EL.$M(DOMPurify.sanitize(...))

  # jQuery selector from a URL fragment; only the sentinel-stripped form (slice/substring/replace/URLSearchParams) can parse as HTML.
  - id: narvy.javascript.xss.jquery-selector-from-url.jquery-selector-from-url
    message: >-
      A jQuery selector is built from a URL fragment/query value whose
      leading `#`/`?` sentinel has been stripped. jQuery parses a string
      starting with `<` as MARKUP rather than as a selector, so an attacker
      controlling the fragment gets DOM-based XSS (CWE-79). Look the element
      up explicitly (`document.getElementById(value)`) instead of passing
      URL data to `$()`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [jquery, browser, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern-either:
          - pattern: $($LOC.hash.$STRIP(...))
          - pattern: $($LOC.search.$STRIP(...))
          - pattern: $(decodeURIComponent($LOC.hash.$STRIP(...)))
          - pattern: $(decodeURIComponent($LOC.search.$STRIP(...)))
          - pattern: $(decodeURI($LOC.hash.$STRIP(...)))
          - pattern: |
              $V = $LOC.hash.$STRIP(...);
              ...
              $($V)
          - pattern: |
              $V = decodeURIComponent($LOC.hash.$STRIP(...));
              ...
              $($V)
      - metavariable-regex:
          metavariable: $STRIP
          regex: ^(slice|substring|substr|replace|split)$

  # node-serialize / serialize-to-js .unserialize() eval-s embedded functions (RCE); scoped to receivers imported from those packages.
  - id: narvy.javascript.deserialization.node-serialize-unserialize.node-serialize-unserialize
    message: >-
      `unserialize()` from node-serialize / serialize-to-js is called on a
      non-literal value. These libraries restore FUNCTIONS by evaluating the
      serialized payload, so attacker-controlled input here is remote code
      execution (CWE-502). Use `JSON.parse` and rebuild behaviour from data,
      or a serializer that never evaluates code.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      category: security
      subcategory: [vuln]
      technology: [node-serialize, serialize-to-js, nodejs, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Insecure Deserialization
      references:
        - https://cwe.mitre.org/data/definitions/502.html
    pattern-either:
      - patterns:
          - pattern: $S.unserialize($X)
          - pattern-not: $S.unserialize("...")
          - pattern-either:
              - pattern-inside: |
                  $S = require("node-serialize");
                  ...
              - pattern-inside: |
                  $S = require("serialize-to-js");
                  ...
              - pattern-inside: |
                  import $S from "node-serialize";
                  ...
              - pattern-inside: |
                  import * as $S from "node-serialize";
                  ...
              - pattern-inside: |
                  import $S from "serialize-to-js";
                  ...
              - pattern-inside: |
                  import * as $S from "serialize-to-js";
                  ...
      - patterns:
          - pattern-either:
              - pattern: require("node-serialize").unserialize($X)
              - pattern: require("serialize-to-js").unserialize($X)
          - pattern-not: require("...").unserialize("...")

  # Catastrophic-backtracking regex literal (static ReDoS): a quantified group holding a single quantified atom.
  - id: narvy.javascript.misc.redos-nested-quantifier-literal.redos-nested-quantifier-literal
    message: >-
      Regex literal with a nested quantifier over a single atom (e.g.
      `(a+)+`, `([a-z]+)*`). The engine can split the input between the
      inner and outer quantifier in exponentially many ways, so a crafted
      non-matching subject string hangs the event loop - catastrophic
      backtracking / ReDoS (CWE-1333). Drop the redundant outer quantifier,
      make the group unambiguous, or match with a linear-time engine (re2).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
        - "CWE-400: Uncontrolled Resource Consumption"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [audit]
      technology: [javascript, typescript]
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Denial-of-Service (DoS)
    patterns:
      - pattern-either:
          - pattern: $RE.test(...)
          - pattern: $RE.exec(...)
          - pattern: $X.match($RE)
          - pattern: $X.matchAll($RE)
          - pattern: $X.replace($RE, ...)
          - pattern: $X.replaceAll($RE, ...)
          - pattern: $X.split($RE)
          - pattern: $X.search($RE)
          - pattern: new RegExp($RE)
          - pattern: $V = $RE
      - metavariable-regex:
          metavariable: $RE
          regex: '^/.*\((\?:)?(\[[^\]]+\]|\\[dwsSWD]|\.|[A-Za-z0-9])[+*]\)[+*][^+*?].*/[gimsuyd]*$'

  # CORS allow-list regex with an unescaped dot matches attacker domains; regex-on-regex requires the dot followed by a letter, scoped to origin-shaped identifiers.
  - id: narvy.javascript.cors.allowlist-regex-unescaped-dot.allowlist-regex-unescaped-dot
    message: >-
      CORS origin allow-list regex contains an UNESCAPED dot. `.` matches
      any character, so `/^https://app.example.com$/` also accepts
      `https://appXexampleYcom` - a hostname an attacker can register - and
      the server will reflect it in Access-Control-Allow-Origin (CWE-942).
      Escape the dots (`app\.example\.com`) and anchor the pattern with
      `^`/`$`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
        - "CWE-346: Origin Validation Error"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [cors, express, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Improper Access Control
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $RE.test($ORIGIN)
                  - pattern: $ORIGIN.match($RE)
                  - pattern: $RE.exec($ORIGIN)
              - metavariable-regex:
                  metavariable: $ORIGIN
                  regex: '(?i)^_?(origin|reqorigin|requestorigin|referer|referrer|allowedorigin|targetorigin)$'
          - pattern: "cors({..., origin: $RE, ...})"
          - pattern: "cors({..., origin: [..., $RE, ...], ...})"
      - metavariable-regex:
          metavariable: $RE
          regex: '^/.*[^\\]\.[a-zA-Z].*/[gimsuyd]*$'
