      technology: [pg, mysql, mysql2, sqlite3, knex, sequelize, typeorm, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Improper Validation
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      - patterns:
          - pattern: $REQ.$KIND.$X
          - metavariable-regex:
              metavariable: $KIND
              regex: ^(body|params|query|headers|cookies)$
      - patterns:
          - pattern: $EVENT.$EKIND
          - metavariable-regex:
              metavariable: $EKIND
              regex: ^(queryStringParameters|pathParameters|multiValueQueryStringParameters|multiValueHeaders)$
      - pattern: JSON.parse($EVENT.body)
      # Raw (unparsed) Lambda body. Receiver pinned to event-shaped names,
      # because a bare `$X.body` also matches an OUTBOUND response body.
      - patterns:
          - pattern: $EVENT.body
          - metavariable-regex:
              metavariable: $EVENT
              regex: ^(event|evt|_event|lambdaEvent|apiEvent)$
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      - pattern: BigInt(...)
      - pattern: escape(...)
      - pattern: $M.escape(...)
      - pattern: $M.escapeId(...)
      - pattern: $M.escapeLiteral(...)
      - pattern: $M.escapeIdentifier(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (<... $ALLOW.includes(...) ...>) { ... }
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$ALLOW.includes($V)) { ... }
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$ALLOW.includes($V)) return ...;
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$RE.test($V)) { ... }
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$RE.test($V)) return ...;
              ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CONN.query($SINK, ...)
              - pattern: $CONN.execute($SINK, ...)
              - pattern: $CONN.raw($SINK, ...)
          - focus-metavariable: $SINK
          # Template-literal shape and the SQL-looking check in one regex.
          - metavariable-regex:
              metavariable: $SINK
              regex: '(?is)^`.*\b(select|insert|update|delete|drop|alter|create|merge|truncate)\b.*'

  # Rule 2c: SQL built into a variable then passed to sink; syntactic, requires request data + a SQL keyword in one RHS.
  - id: narvy.javascript.sqli.user-input-concat-query-var-indirect.user-input-concat-query-var-indirect
    message: >-
      A SQL string that concatenates / interpolates request data
      (query/params/body/headers/cookies) is built into a variable and then
      passed to a query/execute/raw sink. SQL injection (CWE-89), with one
      level of variable indirection. Use a parameterized query: pass user
      input as bound parameters, e.g. .query(sql, [params]).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [pg, mysql, mysql2, sqlite3, knex, sequelize, typeorm, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Improper Validation
      references:
        - https://cwe.mitre.org/data/definitions/89.html
        - https://owasp.org/www-community/attacks/SQL_Injection
    patterns:
      - pattern-either:
          # concatenation carrying request data + a SQL-keyword string
          - patterns:
              - pattern: |
                  $Q = <... $REQ.$KIND.$X ...>
                  ...
                  $CONN.$M($Q, ...)
              - pattern: |
                  $Q = <... "$SQL" ...>
                  ...
                  $CONN.$M($Q, ...)
              - metavariable-regex:
                  metavariable: $SQL
                  regex: '(?is).*\b(select|insert|update|delete|drop|alter|create|merge|truncate)\b.*'
          # template literal carrying request data
          - patterns:
              - pattern: |
                  $Q = <... $REQ.$KIND.$X ...>
                  ...
                  $CONN.$M($Q, ...)
              - pattern: |
                  $Q = `...${...}...`
                  ...
                  $CONN.$M($Q, ...)
      - metavariable-regex:
          metavariable: $KIND
          regex: ^(query|params|body|headers|cookies)$
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(query|execute|raw)$

# SQLI ORM

  - id: narvy.javascript.sqli.sequelize-literal-tainted.sequelize-literal-tainted
    message: >-
      sequelize.literal is called with a SQL fragment built from request
      data. literal() inserts its argument into the query completely
      unescaped - it exists specifically to bypass Sequelize's
      parameterization, so request data reaching it is direct SQL
      injection (CWE-89). Use a parameterized where-clause or bind
      variables instead of sequelize.literal for anything derived from
      user input.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [sequelize, nodejs, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - SQL Injection
      references:
        - https://cwe.mitre.org/data/definitions/89.html
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: sequelize.literal("$SQL" + $REQ.$KIND.$X + ...)
                  - pattern: sequelize.literal(`...${$REQ.$KIND.$X}...`)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      sequelize.literal("$SQL" + $V + ...)
                  - pattern: |
                      $V = $REQ.$KIND.$X
                      ...
                      sequelize.literal(`...${$V}...`)
              - metavariable-regex:
                  metavariable: $KIND
                  regex: ^(query|params|body|headers|cookies)$
          # AWS Lambda handler taint source (see user-input-concat-query for
          # the nesting rationale).
          - patterns:
              - pattern-either:
                  - pattern: sequelize.literal("$SQL" + $EVENT.$EKIND.$X + ...)
                  - pattern: sequelize.literal(`...${$EVENT.$EKIND.$X}...`)
                  - pattern: |
                      $V = $EVENT.$EKIND.$X
                      ...
                      sequelize.literal("$SQL" + $V + ...)
                  - pattern: |
                      $V = $EVENT.$EKIND.$X
                      ...
                      sequelize.literal(`...${$V}...`)
              - metavariable-regex:
                  metavariable: $EKIND
                  regex: ^(queryStringParameters|pathParameters|headers|multiValueQueryStringParameters|multiValueHeaders)$
          - pattern: sequelize.literal("$SQL" + JSON.parse($EVENT.body).$X + ...)

  - id: narvy.javascript.sqli.mongoose-where-tainted.mongoose-where-tainted
    message: >-
      A Mongoose query's `$where` clause is built from request data.
      $where runs its string as server-side JavaScript against every
      document in the collection, so request-controlled input here is
      effectively server-side code injection through the database layer
      (CWE-943 / CWE-94), not just NoSQL injection. Remove $where and
      express the same condition with regular MongoDB query operators.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [mongoose, mongodb, nodejs, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - SQL Injection
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      {..., $where: "$JS" + $REQ.$KIND.$X + ..., ...}
                  - pattern: |
                      {..., $where: `...${$REQ.$KIND.$X}...`, ...}
              - metavariable-regex:
                  metavariable: $KIND
                  regex: ^(query|params|body|headers|cookies)$
          # AWS Lambda handler taint source (see user-input-concat-query for
          # the nesting rationale).
          - patterns:
              - pattern-either:
                  - pattern: |
                      {..., $where: "$JS" + $EVENT.$EKIND.$X + ..., ...}
                  - pattern: |
                      {..., $where: `...${$EVENT.$EKIND.$X}...`, ...}
              - metavariable-regex:
                  metavariable: $EKIND
                  regex: ^(queryStringParameters|pathParameters|headers|multiValueQueryStringParameters|multiValueHeaders)$

# SSRF REQUEST

  - id: narvy.javascript.ssrf.request-url-from-user.request-url-from-user
    message: >-
      A request-derived value flows into an outbound HTTP client (http/https
      get/request, axios, fetch, got, node-fetch, request) as the target URL.
      An attacker controlling this value can force the server to make requests
      to internal services (cloud metadata, localhost admin ports), i.e.
      Server-Side Request Forgery (CWE-918). Validate the URL against an
      allow-list of hosts/schemes before the request.
    severity: ERROR
    languages:
      - javascript
      - typescript
    mode: taint
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      confidence: MEDIUM
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-sources:
      - pattern: req.query.$Q
      - pattern: req.params.$P
      - pattern: req.body.$B
      - pattern: req.headers.$H
      - pattern: req.query
      - pattern: req.params
      - pattern: request.query.$Q
      - pattern: request.params.$P
      - pattern: $CTX.request.query.$Q
    pattern-sanitizers:
      # An allow-list / URL-validator guard (safeFetch wrappers, host/scheme
      # validators) is the canonical SSRF mitigation and kills the taint.
      - pattern: safeFetch(...)
      - pattern: isAllowedUrl(...)
      - pattern: isAllowedHost(...)
      - pattern: isSafeUrl(...)
      - pattern: validateUrl(...)
      - pattern: validateHost(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (<... $ALLOW.includes(...) ...>) { ... }
    pattern-sinks:
      # Every sink pins focus $SINK to the URL arg; $HTTP scoped to http/https.
      - patterns:
          - pattern: $HTTP.get($SINK, ...)
          - focus-metavariable: $SINK
          - metavariable-regex:
              metavariable: $HTTP
              regex: ^(http|https)$
      - patterns:
          - pattern: $HTTP.request($SINK, ...)
          - focus-metavariable: $SINK
          - metavariable-regex:
              metavariable: $HTTP
              regex: ^(http|https)$
      - patterns:
          - pattern: axios($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: axios.get($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: axios.request($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: fetch($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: got($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: got.get($SINK, ...)
          - focus-metavariable: $SINK
      # Scope request($SINK, ...) to a request/needle/node-fetch client assigned to a local.
      - patterns:
          - pattern: $REQ($SINK, ...)
          - focus-metavariable: $SINK
          - metavariable-pattern:
              metavariable: $REQ
              patterns:
                - pattern-either:
                    - pattern: request
                    - pattern: needle
          - pattern-inside: |
              $REQ = require("...");
              ...
      - patterns:
          - pattern: needle($M, $SINK, ...)
          - focus-metavariable: $SINK
      # needle method-style helpers; identifier must be a local from require("needle").
      - patterns:
          - pattern: $NEEDLE.$METHOD($SINK, ...)
          - focus-metavariable: $SINK
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|head)$
          - metavariable-pattern:
              metavariable: $NEEDLE
              patterns:
                - pattern: needle
          - pattern-inside: |
              $NEEDLE = require("needle");
              ...

# SSTI

  - id: narvy.javascript.ssti.template-engine-compiles-request-data.template-engine-compiles-request-data
    message: >-
      A request-derived value is passed as the TEMPLATE STRING to a
      template engine's render/compile function (ejs, handlebars, pug,
      lodash template, Mustache). These engines evaluate JS expressions
      found inside the template source, so an attacker-controlled
      template string means arbitrary server-side code execution
      (CWE-1336 / effectively CWE-94). Never compile a template from
      request data - only bind request data as template variables into a
      fixed, trusted template.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [ejs, handlebars, pug, lodash, mustache, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Code Injection
      references:
        - https://cwe.mitre.org/data/definitions/1336.html
        - https://portswigger.net/web-security/server-side-template-injection
    pattern-sources:
      - pattern: req.query.$Q
      - pattern: req.params.$P
      - pattern: req.body.$B
    pattern-sinks:
      - pattern: ejs.render($SINK, ...)
      - pattern: ejs.compile($SINK, ...)
      - pattern: handlebars.compile($SINK, ...)
      - pattern: Handlebars.compile($SINK, ...)
      - pattern: pug.render($SINK, ...)
      - pattern: pug.compile($SINK, ...)
      - pattern: _.template($SINK)
      - pattern: Mustache.render($SINK, ...)

  - id: narvy.javascript.ssti.res-render-view-name-from-request.res-render-view-name-from-request
    message: >-
      The view name passed to res.render is taken directly from a
      request field. An attacker who controls the view name can render
      views not meant to be reachable directly, and on engines/setups
      that resolve the name to a filesystem path this can be combined
      with path traversal to render arbitrary files as a template
      (CWE-73). Restrict the view name to a fixed allow-list instead of
      passing the request value through.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-73: External Control of File Name or Path"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Code Injection
    patterns:
      - pattern-either:
          - pattern: $RES.render($REQ.$KIND.$X, ...)
          - pattern: |
              $V = $REQ.$KIND.$X
              ...
              $RES.render($V, ...)
      - metavariable-regex:
          metavariable: $KIND
          regex: ^(query|params|body)$

# WEAK CRYPTO CIPHER

  # Rule 1: weak cipher algorithm / ECB mode
  - id: narvy.javascript.crypto.weak-cipher-createcipheriv.weak-cipher-createcipheriv
    message: >-
      Weak or broken cipher algorithm passed to crypto.createCipheriv /
      createCipher. DES and RC4 are cryptographically broken; ECB mode
      leaks plaintext structure regardless of the underlying block cipher.
      Use AES-256-GCM (authenticated encryption) instead. CWE-327.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
        - "CWE-329: Generation of Predictable IV with CBC Mode"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv("$ALGO", ...)
          - pattern: crypto.createCipheriv('$ALGO', ...)
          - pattern: crypto.createCipher("$ALGO", ...)
          - pattern: crypto.createCipher('$ALGO', ...)
          - pattern: $CRYPTO.createCipheriv("$ALGO", ...)
          - pattern: $CRYPTO.createCipheriv('$ALGO', ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: ^(?i).*(des|rc4|arcfour|-ecb|^ecb).*$

  # Rule 1b: GCM decipher never finalized; without .final() tampered ciphertext decrypts.
  - id: narvy.javascript.crypto.gcm-decrypt-missing-final.gcm-decrypt-missing-final
    message: >-
      A GCM-mode decipher is created and fed ciphertext via .update(), but
      .final() is never called on it. In Node's crypto module the GCM
      authentication tag is only checked when .final() runs - it throws if
      the tag doesn't match the ciphertext. Skipping .final() means
      tampered ciphertext is silently accepted as if it were genuine
      (CWE-354). Always call .final() on a GCM decipher and let it throw.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-354: Improper Validation of Integrity Check Value"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern: $CRYPTO.createDecipheriv("$ALGO", ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i).*gcm.*
      - pattern-not-inside: |
          $DECIPHER = $CRYPTO.createDecipheriv("$ALGO", ...)
          ...
          $DECIPHER.final(...)

  # Rule 1c: deprecated createCipher/createDecipher derives a static IV from the key.
  - id: narvy.javascript.crypto.deprecated-cipher-static-iv.deprecated-cipher-static-iv
    message: >-
      crypto.createCipher()/createDecipher() is deprecated and derives the
      IV internally from the key material via an undocumented KDF instead
      of accepting an explicit, random IV. The same key therefore always
      produces the same derived IV, so encrypting the same plaintext twice
      with the same key yields the same ciphertext, and CBC-mode chosen-
      plaintext attacks become possible (CWE-329). Use createCipheriv() /
      createDecipheriv() with a fresh, cryptographically random IV per
      encryption instead.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-329: Generation of Predictable IV with CBC Mode"
        - "CWE-330: Use of Insufficiently Random Values"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: crypto.createCipher($ALGO, ...)
          - pattern: crypto.createDecipher($ALGO, ...)
          - pattern: $CRYPTO.createCipher($ALGO, ...)
          - pattern: $CRYPTO.createDecipher($ALGO, ...)

  # Rule 1d: GCM auth tag from request data used without a length check.
  - id: narvy.javascript.crypto.gcm-tag-unvalidated-length.gcm-tag-unvalidated-length
    message: >-
      A GCM auth tag taken directly from request data is passed to
      setAuthTag() with no length check beforehand. GCM's forgery
      resistance depends on the full-length tag (16 bytes); an
      attacker-supplied truncated tag has a much higher chance of
      passing verification by luck, and some deployments accept
      whatever length is given (CWE-327). Reject the request unless the
      tag is exactly the expected length (normally 16 bytes) before
      calling setAuthTag().
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: $DECIPHER.setAuthTag(Buffer.from($REQ.$KIND.$X, ...))
          - pattern: $DECIPHER.setAuthTag($REQ.$KIND.$X)
      - metavariable-regex:
          metavariable: $KIND
          regex: ^(query|params|body|headers|cookies)$
      - pattern-not-inside: |
          if (<... $LEN.length ...>) { ... }

  # Rule 2: Math.random() feeding a token / secret / password variable
  - id: narvy.javascript.crypto.math-random-security-token.math-random-security-token
    message: >-
      `Math.random()` is assigned to a variable whose name indicates
      security-sensitive use (token, secret, password, otp, session, nonce,
      apikey, csrf). Math.random() is not cryptographically secure - its
      output is predictable from a handful of samples. Use
      `crypto.randomBytes()` / `crypto.randomUUID()` for anything
      security-relevant. CWE-338.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"
        - "CWE-330: Use of Insufficiently Random Values"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [audit]
      technology: [javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Insufficient Entropy
    patterns:
      - pattern-either:
          - pattern: const $TOKEN = Math.random()
          - pattern: let $TOKEN = Math.random()
          - pattern: var $TOKEN = Math.random()
          - pattern: $TOKEN = Math.random()
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i)(token|secret|password|passwd|pwd|otp|session|nonce|apikey|api_key|csrf|auth)

  # Rule 3: undersized RSA key generation
  - id: narvy.javascript.crypto.weak-rsa-keysize.weak-rsa-keysize
    message: >-
      RSA key pair generated with `modulusLength` below 2048 bits. Keys
      under 2048 bits are considered breakable with modern compute and are
      rejected by NIST guidance for new key generation. Use at least 2048
      (prefer 3072/4096) for RSA, or switch to an elliptic-curve algorithm.
      CWE-326.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-326: Inadequate Encryption Strength"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [audit]
      technology: [node-crypto, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: 'crypto.generateKeyPair("rsa", { modulusLength: $N, ... }, ...)'
          - pattern: 'crypto.generateKeyPairSync("rsa", { modulusLength: $N, ... }, ...)'
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 2048

# WEAK CRYPTO

  # Rule 1a: Node crypto.createHash('md5' | 'sha1')
  - id: narvy.javascript.crypto.weak-hash-create-hash.weak-hash-create-hash
    message: >-
      Weak hash MD5/SHA1 used via crypto.createHash. Both algorithms are
      cryptographically broken (MD5 collision, SHA1 collision). Use SHA-256
      or stronger for integrity. For password hashing use scrypt, Argon2,
      or PBKDF2 with high iteration count. CWE-327.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A03:2017 - Sensitive Data Exposure"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://tools.ietf.org/html/rfc6151
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("$ALGO")
          - pattern: crypto.createHash('$ALGO')
          - pattern: $CRYPTO.createHash("$ALGO")
          - pattern: $CRYPTO.createHash('$ALGO')
      - metavariable-regex:
          metavariable: $ALGO
          regex: ^(?i)(md5|md4|md2|sha-?1)$

  # Rule 1b: crypto-js MD5 / SHA1 module method
  - id: narvy.javascript.crypto.weak-hash-crypto-js.weak-hash-crypto-js
    message: >-
      Weak hash MD5/SHA1 used via crypto-js. Both algorithms are
      cryptographically broken. Use crypto-js SHA-256 / SHA-512 or
      stronger. CWE-327.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [crypto-js, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: $CRYPTOJS.MD5(...)
          - pattern: $CRYPTOJS.SHA1(...)
          - pattern: $CRYPTOJS.HmacMD5(...)
          - pattern: $CRYPTOJS.HmacSHA1(...)

  # Rule 1c: node-forge md5 / sha1
  - id: narvy.javascript.crypto.weak-hash-forge.weak-hash-forge
    message: >-
      Weak hash MD5/SHA1 used via node-forge. Both algorithms are
      cryptographically broken. Use forge.md.sha256.create() or stronger.
      CWE-327.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
