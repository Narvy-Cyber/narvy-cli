# Narvy JavaScript / TypeScript security rules (.js/.jsx/.ts/.tsx).
# Injection rules run in taint mode and pin the vulnerable arg with focus-metavariable.

rules:

# CLEARTEXT HTTP

  - id: narvy.javascript.transport.cleartext-http-literal.cleartext-http-literal
    message: >-
      Cleartext HTTP URL detected. Traffic to this endpoint is unencrypted
      and vulnerable to MITM (eavesdropping, tampering, session hijacking).
      Use HTTPS. CWE-319.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A03:2017 - Sensitive Data Exposure"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: HIGH
      vulnerability_class:
        - Insecure Communication
      references:
        - https://cwe.mitre.org/data/definitions/319.html
        - https://owasp.org/www-community/vulnerabilities/Insecure_Transport
    paths:
      exclude:
        - "**/fuzzer/payloads.js"
        - "**/fuzzer/payloads.ts"
        - "**/payloads/*.js"
        - "**/payloads/*.ts"
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.spec.js"
        - "**/*.spec.ts"
    patterns:
      - pattern-either:
          - pattern: "\"$URL\""
          - pattern: "'$URL'"
          - pattern: "`$URL`"
      - metavariable-regex:
          metavariable: $URL
          regex: ^http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|169\.254\.|10\.\d+\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|\[::1\]|[a-zA-Z0-9.-]+\.(local|internal|test|example)(/|$|:)|schemas\.|www\.w3\.org|xmlns\.com|purl\.org|ns\.adobe\.com|java\.sun\.com|jabber\.org|x\.org|evil\.com)[a-zA-Z0-9._~:/?#\[\]@!$&'()*+,;=%-]+$

# CORS ORIGIN REFLECTION

  - id: narvy.javascript.cors.origin-callback-always-allows.origin-callback-always-allows
    message: >-
      The CORS origin callback calls back with `true` unconditionally,
      without checking the incoming origin against an allow-list. This
      accepts requests from every origin, same as `origin: "*"`, but
      combined with `credentials: true` this is worse: unlike a literal
      wildcard, per the CORS spec a dynamic origin callback CAN be
      combined with credentialed requests, letting any site make
      authenticated cross-origin requests on behalf of a logged-in user
      (CWE-942). Check the `origin` argument against an explicit
      allow-list before calling back with true.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [express, cors, nodejs, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Other
      references:
        - https://cwe.mitre.org/data/definitions/942.html
    patterns:
      - pattern-either:
          - pattern: |
              cors({..., origin: function ($ORIGIN, $CB) { $CB(null, true) }, ...})
          - pattern: |
              cors({..., origin: ($ORIGIN, $CB) => { $CB(null, true) }, ...})
          - pattern: |
              cors({..., origin: ($ORIGIN, $CB) => $CB(null, true), ...})

  - id: narvy.javascript.cors.header-reflects-request-origin.header-reflects-request-origin
    message: >-
      Access-Control-Allow-Origin is set directly from the incoming
      request's Origin header, with no allow-list check in between. This
      lets any origin pass CORS, functionally identical to a wildcard,
      and if paired with Access-Control-Allow-Credentials: true it
      allows any site to make authenticated cross-origin requests
      (CWE-942). Look the incoming origin up in an explicit allow-list
      and only echo it back if it matches.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Other
    patterns:
      - pattern-either:
          - pattern: $RES.header("Access-Control-Allow-Origin", $REQ.headers.origin)
          - pattern: $RES.header('Access-Control-Allow-Origin', $REQ.headers.origin)
          - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.headers.origin)
          - pattern: $RES.setHeader('Access-Control-Allow-Origin', $REQ.headers.origin)
          - pattern: $RES.set("Access-Control-Allow-Origin", $REQ.headers.origin)

# EXPRESS SECURITY HARDENING

  # 1. Helmet with Content-Security-Policy explicitly disabled.
  - id: narvy.javascript.express.helmet-csp-disabled.helmet-csp-disabled
    message: >-
      Helmet is initialised with `contentSecurityPolicy: false`, which turns
      OFF the Content-Security-Policy header. Without a CSP the app has no
      defence-in-depth against XSS, clickjacking via script/style injection,
      or malicious resource loads. Configure an explicit CSP directive set
      instead of disabling it. CWE-1021 / CWE-693.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-1021: Improper Restriction of Rendered UI Layers or Frames"
        - "CWE-693: Protection Mechanism Failure"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, helmet, javascript, typescript]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: HIGH
      vulnerability_class:
        - Security Misconfiguration
      references:
        - https://helmetjs.github.io/
        - https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.spec.js"
        - "**/*.spec.ts"
    patterns:
      - pattern-either:
          - pattern: |
              helmet({..., contentSecurityPolicy: false, ...})
          - pattern: |
              helmet.contentSecurityPolicy(false)

  # 2. CORS configured to allow any origin.
  - id: narvy.javascript.express.cors-wildcard-origin.cors-wildcard-origin
    message: >-
      CORS is configured to accept requests from ANY origin
      (`origin: "*"` or `origin: true`). Combined with credentialed requests
      this lets any website read authenticated responses on behalf of a
      logged-in user. Restrict `origin` to an explicit allow-list. CWE-942.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, cors, javascript, typescript]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Security Misconfiguration
      references:
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.spec.js"
        - "**/*.spec.ts"
    patterns:
      - pattern-either:
          - pattern: |
              cors({..., origin: "*", ...})
          - pattern: |
              cors({..., origin: true, ...})

  # 3. MongoDB connection string with no credentials.
  - id: narvy.javascript.database.mongodb-uri-without-auth.mongodb-uri-without-auth
    message: >-
      MongoDB connection string has no user:password credentials, so it
      connects to an UNAUTHENTICATED database. If this URI is ever used in
      production (e.g. an unset env var falling back to this literal), any
      network-adjacent actor can read/write the entire database. Require
      authentication and never fall back to a credential-less URI. CWE-306.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-306: Missing Authentication for Critical Function"
      owasp:
        - "A05:2021 - Security Misconfiguration"
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      subcategory: [audit]
      technology: [mongodb, nodejs, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Security Misconfiguration
      references:
        - https://www.mongodb.com/docs/manual/administration/security-checklist/
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.spec.js"
        - "**/*.spec.ts"
    patterns:
      - pattern-either:
          - pattern: "\"$URI\""
          - pattern: "'$URI'"
      - metavariable-regex:
          metavariable: $URI
          # mongodb:// or mongodb+srv:// with a host but NO "@" (credentials).
          regex: ^mongodb(\+srv)?://(?!.*@)[a-zA-Z0-9._-]+(:[0-9]+)?(/[a-zA-Z0-9._-]*)?$

# HARDCODED KDF FALLBACK

  # Rule 1: env-fallback fed into `crypto.createHash(...).update(...)`
  - id: narvy.javascript.crypto.hardcoded-env-fallback-to-hash.hardcoded-env-fallback-to-hash
    message: >-
      Hardcoded fallback secret '$LITERAL' is used when the environment
      variable is unset, and is then fed into a cryptographic hash. If the
      env var is missing in any deployment (e.g. local dev, CI, misconfigured
      prod), the encryption key reduces to a public constant. Furthermore,
      a single hash round is not a key-derivation function - use HKDF
      (crypto.hkdfSync), PBKDF2 (crypto.pbkdf2Sync), scrypt, or Argon2 with
      a per-tenant salt. Fix the env loading (fail fast if absent) AND
      switch to a real KDF.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
        - Hard-coded Credentials
      references:
        - https://cwe.mitre.org/data/definitions/321.html
        - https://cwe.mitre.org/data/definitions/916.html
        - https://datatracker.ietf.org/doc/html/rfc5869
    patterns:
      - pattern-either:
          # Variant 1: `||` operator
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env.$ENV || "$LITERAL")
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env.$ENV || '$LITERAL')
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env[$X] || "$LITERAL")
          # Variant 2: `??` nullish coalescing
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env.$ENV ?? "$LITERAL")
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env.$ENV ?? '$LITERAL')
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env[$X] ?? "$LITERAL")
          # Variant 3: ternary
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env.$ENV ? process.env.$ENV : "$LITERAL")
          - pattern: |
              $CRYPTO.createHash($ALGO).update(process.env.$ENV ? process.env.$ENV : '$LITERAL')
          # Variant 4: two-statement (split hash chain)
          - pattern: |
              $HASH = $CRYPTO.createHash($ALGO)
              ...
              $HASH.update(process.env.$ENV || "$LITERAL")
          - pattern: |
              $HASH = $CRYPTO.createHash($ALGO)
              ...
              $HASH.update(process.env.$ENV ?? "$LITERAL")
          # Variant 5: separate-assign (let K=env.X; if (!K) K="lit"; ...update(K))
          - pattern: |
              $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $CRYPTO.createHash($ALGO).update($K)
          - pattern: |
              let $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $CRYPTO.createHash($ALGO).update($K)
          # Variant 6: chained-var (const K = env.X; const F = K || "lit"; update(F))
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K || "$LITERAL"
              ...
              $CRYPTO.createHash($ALGO).update($F)
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K ?? "$LITERAL"
              ...
              $CRYPTO.createHash($ALGO).update($F)
          # Variant 7: ternary in assignment chained to hash
          - pattern: |
              $K = process.env.$ENV ? process.env.$ENV : "$LITERAL"
              ...
              $CRYPTO.createHash($ALGO).update($K)
      - metavariable-regex:
          metavariable: $LITERAL
          regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$

  # Rule 2: env-fallback as symmetric-cipher key / HMAC key
  - id: narvy.javascript.crypto.hardcoded-env-fallback-to-cipher-key.hardcoded-env-fallback-to-cipher-key
    message: >-
      Hardcoded fallback secret '$LITERAL' from `process.env.$ENV` is passed
      directly to a symmetric cipher or HMAC. If the env var is unset the
      key becomes a public constant and all ciphertexts can be decrypted by
      anyone reading this source. Fail fast on missing env at startup, and
      derive the cipher key via HKDF / PBKDF2 with a per-record salt.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
        - Hard-coded Credentials
    patterns:
      - pattern-either:
          # `||` operator
          - pattern: |
              $CRYPTO.createCipheriv($ALGO, process.env.$ENV || "$LITERAL", ...)
          - pattern: |
              $CRYPTO.createDecipheriv($ALGO, process.env.$ENV || "$LITERAL", ...)
          - pattern: |
              $CRYPTO.createHmac($ALGO, process.env.$ENV || "$LITERAL")
          - pattern: |
              $CRYPTO.createCipher($ALGO, process.env.$ENV || "$LITERAL")
          # `??` nullish
          - pattern: |
              $CRYPTO.createCipheriv($ALGO, process.env.$ENV ?? "$LITERAL", ...)
          - pattern: |
              $CRYPTO.createDecipheriv($ALGO, process.env.$ENV ?? "$LITERAL", ...)
          - pattern: |
              $CRYPTO.createHmac($ALGO, process.env.$ENV ?? "$LITERAL")
          # Ternary
          - pattern: |
              $CRYPTO.createHmac($ALGO, process.env.$ENV ? process.env.$ENV : "$LITERAL")
          - pattern: |
              $CRYPTO.createCipheriv($ALGO, process.env.$ENV ? process.env.$ENV : "$LITERAL", ...)
          # Two-statement: separate-assign
          - pattern: |
              $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $CRYPTO.createHmac($ALGO, $K)
          - pattern: |
              let $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $CRYPTO.createHmac($ALGO, $K)
          # Chained-var
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K || "$LITERAL"
              ...
              $CRYPTO.createHmac($ALGO, $F)
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K ?? "$LITERAL"
              ...
              $CRYPTO.createHmac($ALGO, $F)
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K || "$LITERAL"
              ...
              $CRYPTO.createCipheriv($ALGO, $F, ...)
      - metavariable-regex:
          metavariable: $LITERAL
          regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$

  # Rule 3: env-fallback fed into KDF (HKDF / PBKDF2 / scrypt)
  - id: narvy.javascript.crypto.hardcoded-env-fallback-to-kdf.hardcoded-env-fallback-to-kdf
    message: >-
      Hardcoded fallback secret '$LITERAL' is used as input keying material
      (IKM) to a KDF. When the env var is unset the IKM reduces to a public
      constant - defeats the entire KDF. Fail fast on missing env at app
      startup (`assert process.env.X, 'X must be set'`).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
        - Hard-coded Credentials
    patterns:
      - pattern-either:
          # Direct call with `||`
          - pattern: |
              $CRYPTO.hkdfSync($ALGO, Buffer.from(process.env.$ENV || "$LITERAL", ...), ...)
          - pattern: |
              $CRYPTO.hkdfSync($ALGO, Buffer.from(process.env.$ENV || '$LITERAL', ...), ...)
          - pattern: |
              $CRYPTO.hkdfSync($ALGO, process.env.$ENV || "$LITERAL", ...)
          - pattern: |
              $CRYPTO.pbkdf2Sync(process.env.$ENV || "$LITERAL", ...)
          - pattern: |
              $CRYPTO.scryptSync(process.env.$ENV || "$LITERAL", ...)
          # Direct call with `??`
          - pattern: |
              $CRYPTO.hkdfSync($ALGO, Buffer.from(process.env.$ENV ?? "$LITERAL", ...), ...)
          - pattern: |
              $CRYPTO.hkdfSync($ALGO, process.env.$ENV ?? "$LITERAL", ...)
          - pattern: |
              $CRYPTO.pbkdf2Sync(process.env.$ENV ?? "$LITERAL", ...)
          - pattern: |
              $CRYPTO.scryptSync(process.env.$ENV ?? "$LITERAL", ...)
          # Ternary
          - pattern: |
              $CRYPTO.pbkdf2Sync(process.env.$ENV ? process.env.$ENV : "$LITERAL", ...)
          - pattern: |
              $CRYPTO.scryptSync(process.env.$ENV ? process.env.$ENV : "$LITERAL", ...)
          # Two-step pattern: assign IKM from env-fallback, then use in KDF
          - pattern: |
              $IKM = Buffer.from(process.env.$ENV || "$LITERAL", ...)
              ...
              $CRYPTO.hkdfSync($ALGO, $IKM, ...)
          - pattern: |
              $IKM = Buffer.from(process.env.$ENV ?? "$LITERAL", ...)
              ...
              $CRYPTO.hkdfSync($ALGO, $IKM, ...)
          # Separate-assign feeding KDF
          - pattern: |
              $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $CRYPTO.pbkdf2Sync($K, ...)
          - pattern: |
              $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $CRYPTO.hkdfSync($ALGO, $K, ...)
          # Chained-var feeding KDF
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K || "$LITERAL"
              ...
              $CRYPTO.pbkdf2Sync($F, ...)
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K || "$LITERAL"
              ...
              $CRYPTO.hkdfSync($ALGO, $F, ...)
      - metavariable-regex:
          metavariable: $LITERAL
          regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$

  # Rule 4: single-hash-as-KDF (weak KDF - CWE-916)
  - id: narvy.javascript.crypto.single-hash-as-kdf.single-hash-as-kdf
    message: >-
      A single SHA-1 / SHA-256 / MD5 round is used to derive an encryption
      key from `process.env.$ENV`. This is NOT a key-derivation function:
      brute-force attacks can recompute billions of candidates per second on
      modern GPUs. Use HKDF (crypto.hkdfSync, RFC 5869) for high-entropy
      inputs, PBKDF2 / scrypt / Argon2 for low-entropy passwords.
      Per-tenant salt is mandatory.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-916: Use of Password Hash With Insufficient Computational Effort"
        - "CWE-326: Inadequate Encryption Strength"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [node-crypto, javascript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: |
              $CRYPTO.createCipheriv($ALGO, $CRYPTO.createHash($H).update(process.env.$ENV).digest(), ...)
          - pattern: |
              $CRYPTO.createCipheriv($ALGO, $CRYPTO.createHash($H).update(process.env.$ENV || $X).digest(), ...)
          - pattern: |
              $CRYPTO.createCipheriv($ALGO, $CRYPTO.createHash($H).update(process.env.$ENV ?? $X).digest(), ...)
          - pattern: |
              $CRYPTO.createDecipheriv($ALGO, $CRYPTO.createHash($H).update(process.env.$ENV).digest(), ...)
          - pattern: |
              $CRYPTO.createDecipheriv($ALGO, $CRYPTO.createHash($H).update(process.env.$ENV || $X).digest(), ...)
          - pattern: |
              $CRYPTO.createDecipheriv($ALGO, $CRYPTO.createHash($H).update(process.env.$ENV ?? $X).digest(), ...)
          - pattern: |
              function $F() {
                return $CRYPTO.createHash($H)
                  .update(process.env.$ENV || $X)
                  .digest()
              }
          - pattern: |
              function $F() {
                return $CRYPTO.createHash($H).update(process.env.$ENV || $X).digest()
              }
          - pattern: |
              function $F() {
                return $CRYPTO.createHash($H)
                  .update(process.env.$ENV ?? $X)
                  .digest()
              }
      - metavariable-regex:
          metavariable: $H
          regex: ^['"](md5|sha1|sha-?1|sha256|sha-?256)['"]$

  # Rule 5 (NEW): env-fallback fed into jwt.sign / jwt.verify
  - id: narvy.javascript.crypto.hardcoded-env-fallback-to-jwt-sign.hardcoded-env-fallback-to-jwt-sign
    message: >-
      Hardcoded fallback secret '$LITERAL' is used as the JWT signing key
      when `process.env.$ENV` is unset. If the env var is missing in any
      deployment (local dev, CI, misconfigured prod), tokens are signed
      with a public constant - anyone reading this source can mint valid
      tokens. THE canonical real-world `jwt.sign(...)` bug. Fix: fail fast
      at app startup if the secret env var is absent
      (`assert process.env.$ENV, 'JWT_SECRET must be set'`).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-547: Use of Hard-coded, Security-relevant Constants"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      subcategory: [vuln]
      technology: [jsonwebtoken, jwt, javascript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
        - Hard-coded Credentials
    patterns:
      - pattern-either:
          # jwt.sign / jsonwebtoken.sign - `||` operator
          - pattern: |
              $JWT.sign($PAYLOAD, process.env.$ENV || "$LITERAL", ...)
          - pattern: |
              $JWT.sign($PAYLOAD, process.env.$ENV || "$LITERAL")
          - pattern: |
              $JWT.sign($PAYLOAD, process.env.$ENV || '$LITERAL', ...)
          - pattern: |
              $JWT.sign($PAYLOAD, process.env.$ENV || '$LITERAL')
          # jwt.sign - `??` nullish
          - pattern: |
              $JWT.sign($PAYLOAD, process.env.$ENV ?? "$LITERAL", ...)
          - pattern: |
              $JWT.sign($PAYLOAD, process.env.$ENV ?? "$LITERAL")
          # jwt.verify - `||`
          - pattern: |
              $JWT.verify($TOKEN, process.env.$ENV || "$LITERAL", ...)
          - pattern: |
              $JWT.verify($TOKEN, process.env.$ENV || "$LITERAL")
          - pattern: |
              $JWT.verify($TOKEN, process.env.$ENV || '$LITERAL')
          # jwt.verify - `??`
          - pattern: |
              $JWT.verify($TOKEN, process.env.$ENV ?? "$LITERAL", ...)
          - pattern: |
              $JWT.verify($TOKEN, process.env.$ENV ?? "$LITERAL")
          # Ternary
          - pattern: |
              $JWT.sign($PAYLOAD, process.env.$ENV ? process.env.$ENV : "$LITERAL", ...)
          - pattern: |
              $JWT.verify($TOKEN, process.env.$ENV ? process.env.$ENV : "$LITERAL", ...)
          # Separate-assign feeding jwt.sign
          - pattern: |
              $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $JWT.sign($PAYLOAD, $K, ...)
          # Chained-var feeding jwt.sign
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K || "$LITERAL"
              ...
              $JWT.sign($PAYLOAD, $F, ...)
          - pattern: |
              $K = process.env.$ENV
              ...
              $F = $K ?? "$LITERAL"
              ...
              $JWT.sign($PAYLOAD, $F, ...)
      - metavariable-regex:
          metavariable: $LITERAL
          regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$

  # Rule 6 (NEW): env-fallback fed into Web Crypto API (crypto.subtle)
  - id: narvy.javascript.crypto.hardcoded-env-fallback-to-web-crypto.hardcoded-env-fallback-to-web-crypto
    message: >-
      Hardcoded fallback secret '$LITERAL' is fed into the Web Crypto API
      (crypto.subtle.*). Common in Cloudflare Workers, Deno, and modern
      Node 18+ runtimes. If the env var is unset the key material reduces
      to a public constant - defeats the entire crypto operation. Fail
      fast on missing env at startup.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [web-crypto, cloudflare-workers, deno, javascript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
        - Hard-coded Credentials
    patterns:
      - pattern-either:
          # crypto.subtle.importKey called directly with env-fallback string
          - pattern: |
              $SUBTLE.importKey($FORMAT, process.env.$ENV || "$LITERAL", ...)
          - pattern: |
              $SUBTLE.importKey($FORMAT, process.env.$ENV ?? "$LITERAL", ...)
          # Wrapped in TextEncoder().encode(...) (the canonical browser shape)
          - pattern: |
              $SUBTLE.importKey($FORMAT, new TextEncoder().encode(process.env.$ENV || "$LITERAL"), ...)
          - pattern: |
              $SUBTLE.importKey($FORMAT, new TextEncoder().encode(process.env.$ENV ?? "$LITERAL"), ...)
          - pattern: |
              $SUBTLE.importKey($FORMAT, new TextEncoder().encode(process.env.$ENV || '$LITERAL'), ...)
          - pattern: |
              $SUBTLE.importKey($FORMAT, new TextEncoder().encode(process.env.$ENV ?? '$LITERAL'), ...)
          # Two-statement: encode into local, then importKey
          - pattern: |
              $RAW = new TextEncoder().encode(process.env.$ENV || "$LITERAL")
              ...
              $SUBTLE.importKey($FORMAT, $RAW, ...)
          - pattern: |
              $RAW = new TextEncoder().encode(process.env.$ENV ?? "$LITERAL")
              ...
              $SUBTLE.importKey($FORMAT, $RAW, ...)
          # Separate-assign feeding Web Crypto
          - pattern: |
              $K = process.env.$ENV
              ...
              if (!$K) { $K = "$LITERAL" }
              ...
              $SUBTLE.importKey($FORMAT, new TextEncoder().encode($K), ...)
      - metavariable-regex:
          metavariable: $LITERAL
          regex: ^[A-Za-z0-9 _!@#$%^&*()+=,.:?<>\[\]{}|/\\-]{1,64}$

  # Rule 7: bare-literal secret reaching a JWT sign/verify call (no env var
  # at all). Covers jsonwebtoken, jose and passport-jwt in one taint rule.
  - id: narvy.javascript.crypto.hardcoded-jwt-sign-secret.hardcoded-jwt-sign-secret
    message: >-
      A hardcoded string literal secret reaches a JWT signing or
      verification call (jsonwebtoken, jose, or passport-jwt). The literal
      is a public constant baked into the source - anyone who reads it can
      forge valid tokens (CWE-321 / CWE-798). Load the secret from an
      environment variable or a secrets manager, and fail startup if it is
      missing.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      subcategory: [vuln]
      technology: [jsonwebtoken, jose, passport-jwt, jwt, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
        - Hard-coded Credentials
    pattern-sources:
      # Bare literal reaching a JWT secret argument; narrow sinks keep it off other strings.
      - pattern: '"..."'
    pattern-sinks:
      # jsonwebtoken sign/verify; $JWT name-constrained to jwt/jsonwebtoken.
      - patterns:
          - pattern-either:
              - pattern: $JWT.sign($PAYLOAD, $SECRET, ...)
              - pattern: $JWT.sign($PAYLOAD, $SECRET)
              - pattern: $JWT.verify($TOKEN, $SECRET, ...)
              - pattern: $JWT.verify($TOKEN, $SECRET)
          - focus-metavariable: $SECRET
          - metavariable-regex:
              metavariable: $JWT
              regex: (?i)^(jwt|jsonwebtoken|jsonWebToken)$
      # jose: new SignJWT(payload)....sign(secretBytes), secret wrapped
      # as a Uint8Array via TextEncoder/Buffer (jose's documented shape).
      - patterns:
          - pattern-either:
              - pattern: $CHAIN.sign(new TextEncoder().encode($SECRET))
              - pattern: $CHAIN.sign(Buffer.from($SECRET))
          - focus-metavariable: $SECRET
      # passport-jwt: new JwtStrategy({ secretOrKey: secret, ... }, cb).
      - patterns:
          - pattern: |
              new JwtStrategy({..., secretOrKey: $SECRET, ...}, ...)
          - focus-metavariable: $SECRET

# JWT SESSION

  - id: narvy.javascript.jwt.sign-alg-none.sign-alg-none
    message: >-
      A JWT is signed with algorithm 'none'. A 'none'-algorithm token has
      no signature at all - anyone can craft a token with arbitrary
      claims and it will pass verification on a server that also
      accepts 'none' (CWE-347). Never use algorithm 'none'; sign with
      HS256/RS256 and a properly managed secret or key pair.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [jsonwebtoken, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Improper Authentication
      references:
        - https://cwe.mitre.org/data/definitions/347.html
    patterns:
      - pattern-either:
          - pattern: 'jwt.sign($PAYLOAD, ..., {..., algorithm: "none", ...})'
          - pattern: jwt.sign($PAYLOAD, null, ...)
          - pattern: jwt.sign($PAYLOAD, "", ...)

  - id: narvy.javascript.jwt.verify-missing-algorithms-allowlist.verify-missing-algorithms-allowlist
    message: >-
      jwt.verify is called without an `algorithms` allow-list in its
      options. Without pinning the accepted algorithm(s), a library that
      supports both symmetric (HS256) and asymmetric (RS256) signing can
      be tricked into verifying an HS256 token that was HMAC-signed
      using the server's own RSA public key as the secret - a well-known
      JWT algorithm-confusion forgery (CWE-347). Always pass an explicit
      `algorithms: ['HS256']` (or whichever single algorithm is
      expected) to jwt.verify.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [jsonwebtoken, javascript, typescript]
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Improper Authentication
    patterns:
      - pattern-either:
          - pattern: jwt.verify($TOKEN, $SECRET)
          - pattern: jwt.verify($TOKEN, $SECRET, {...})
      - pattern-not: 'jwt.verify($TOKEN, $SECRET, {..., algorithms: [...], ...})'

  - id: narvy.javascript.session.cookie-secure-explicitly-disabled.cookie-secure-explicitly-disabled
    message: >-
      A session cookie is configured with `secure: false`. This allows
      the session cookie to be sent over plain HTTP, exposing it to
      network eavesdroppers who can then hijack the session (CWE-614).
      Set `secure: true` (typically gated on NODE_ENV === 'production'
      for local HTTP development) so the cookie is only ever sent over
      HTTPS.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-614: Sensitive Cookie Without 'Secure' Attribute"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: HIGH
      vulnerability_class:
        - Improper Authentication
    patterns:
      - pattern-either:
          - pattern: |
              session({..., cookie: {..., secure: false, ...}, ...})
          - pattern: |
              {..., cookie: {..., secure: false, ...}, ...}

  # Rule 1b: cookie security options omitted, not just false; scoped to session() calls.
  - id: narvy.javascript.session.cookie-security-options-omitted.cookie-security-options-omitted
    message: >-
      express-session is configured with the cookie security options
      (secure / httpOnly / sameSite) either entirely absent from the
      `cookie` block or the `cookie` block itself absent from the
      session() config. Express defaults these to insecure values
      (secure defaults off, sameSite defaults off), so silence here is
      silently insecure-by-default, not a neutral choice (CWE-614 /
      CWE-1004). Set an explicit `cookie: { secure: true, httpOnly:
      true, sameSite: 'strict' }` block (gate `secure` on
      NODE_ENV === 'production' for local HTTP dev).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-614: Sensitive Cookie Without 'Secure' Attribute"
        - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Improper Authentication
    patterns:
      - pattern: session($OPTS)
      - pattern-either:
          # secure never mentioned in the cookie block (block itself may
          # be missing entirely - that also satisfies "not mentioned").
          - patterns:
              - pattern: session($OPTS)
              - pattern-not: |
                  session({..., cookie: {..., secure: $S, ...}, ...})
          # httpOnly never mentioned.
          - patterns:
              - pattern: session($OPTS)
              - pattern-not: |
                  session({..., cookie: {..., httpOnly: $H, ...}, ...})
          # sameSite never mentioned.
          - patterns:
              - pattern: session($OPTS)
              - pattern-not: |
                  session({..., cookie: {..., sameSite: $SS, ...}, ...})

# MISC SECURITY

  # Rule 1: prototype pollution via merge of request body
  - id: narvy.javascript.misc.prototype-pollution-merge-reqbody.prototype-pollution-merge-reqbody
    message: >-
      Request-derived data (`req.body` / `req.query` / `req.params`) is
      merged into an object via a deep-merge/extend helper or
      `Object.assign`. If the merge implementation does not block
      `__proto__` / `constructor.prototype` keys, an attacker can pollute
      `Object.prototype` and change behavior application-wide (CWE-1321).
      Use a merge library with prototype-pollution protection (lodash
      >=4.17.21 with a key filter, or a schema-validated merge) and never
      merge raw request bodies directly.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes ('Prototype Pollution')"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      category: security
      subcategory: [audit]
      technology: [javascript, typescript, express, node]
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      vulnerability_class:
        - Improper Input Validation
    patterns:
      - pattern-either:
          - pattern: $_.merge($TARGET, $REQ.body)
          - pattern: $_.merge($TARGET, $REQ.query)
          - pattern: $_.extend($TARGET, $REQ.body)
          - pattern: $_.extend(true, $TARGET, $REQ.body)
          - pattern: Object.assign($TARGET, $REQ.body)
          - pattern: merge($TARGET, $REQ.body)
          - pattern: deepmerge($TARGET, $REQ.body)

  # Rule 2: ReDoS - RegExp from unsanitized input; focus pins the PATTERN arg.
  - id: narvy.javascript.misc.redos-dynamic-regexp.redos-dynamic-regexp
    message: >-
      A request-derived value (`req.body` / `req.query` / `req.params`)
      flows into the pattern argument of `new RegExp()`. An attacker who
      controls the pattern can supply a catastrophically-backtracking regex,
      causing a denial of service when it is later evaluated (ReDoS,
      CWE-1333). Validate/allow-list the pattern, cap its length, escape it
      with a regex-escape helper, or run matching with a timeout / a
      linear-time engine (e.g. re2).
    severity: WARNING
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
        - "CWE-400: Uncontrolled Resource Consumption"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [audit]
      technology: [javascript, typescript]
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Denial-of-Service (DoS)
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.params
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      - patterns:
          - pattern: $REQ.$KIND.$X
          - metavariable-regex:
              metavariable: $KIND
              regex: ^(body|params|query)$
    pattern-sanitizers:
      # Regex-escaping the value makes every metacharacter literal, which
      # removes the attacker's ability to introduce backtracking.
      - pattern: escapeRegExp(...)
      - pattern: escapeRegex(...)
      - pattern: escapeStringRegexp(...)
      - pattern: $M.escapeRegExp(...)
      - pattern: $M.escapeRegex(...)
      - pattern: RegExp.escape(...)
      - pattern: parseInt(...)
      - pattern: Number(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (<... $ALLOW.includes(...) ...>) { ... }
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$ALLOW.includes($V)) return ...;
              ...
    pattern-sinks:
      # First argument only - see the conversion note above.
      - patterns:
          - pattern: new RegExp($SINK, ...)
          - focus-metavariable: $SINK

  # Rule 3: mass assignment via ORM create/update of raw request body
  - id: narvy.javascript.misc.mass-assignment-orm-reqbody.mass-assignment-orm-reqbody
    message: >-
      An ORM `.create()` / `.update()` call is passed the raw request body
      directly, with no field allow-list. If the model has
      security-sensitive fields (e.g. `role`, `isAdmin`, `verified`,
      `balance`), an attacker can set them by adding extra JSON keys to
      the request (mass assignment, CWE-915). Explicitly whitelist
      permitted fields before passing them to the ORM.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      category: security
      subcategory: [audit]
      technology: [javascript, typescript, mongoose, sequelize, express]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: LOW
      vulnerability_class:
        - Improper Access Control
    patterns:
      - pattern-either:
          - pattern: $MODEL.create($REQ.body)
          - pattern: $MODEL.update($REQ.body, ...)
          - pattern: $MODEL.findByIdAndUpdate($ID, $REQ.body, ...)
          - pattern: $MODEL.findOneAndUpdate($COND, $REQ.body, ...)

  # Rule 4: world-writable file permissions
  - id: narvy.javascript.misc.insecure-file-permission.insecure-file-permission
    message: >-
      `fs.chmod` / `fs.chmodSync` sets world-writable (and often
      world-readable) permissions (0o777 / 0o666 / 0777 / 0666). Any local
      user or process can then modify or read this file, which is
      dangerous for config files, key material, or scripts that get
      executed later (CWE-732). Use the narrowest mode that works, e.g.
      0o600 for secrets or 0o644 for regular files.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-732: Incorrect Permission Assignment for Critical Resource"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [audit]
      technology: [javascript, typescript, node]
      likelihood: LOW
      impact: MEDIUM
      confidence: HIGH
      vulnerability_class:
        - Improper Access Control
    patterns:
      - pattern-either:
          - pattern: fs.chmod($PATH, 0o777, ...)
          - pattern: fs.chmod($PATH, 0777, ...)
          - pattern: fs.chmod($PATH, 0o666, ...)
          - pattern: fs.chmod($PATH, 0666, ...)
          - pattern: fs.chmodSync($PATH, 0o777)
          - pattern: fs.chmodSync($PATH, 0777)
          - pattern: fs.chmodSync($PATH, 0o666)
          - pattern: fs.chmodSync($PATH, 0666)
          - pattern: fsPromises.chmod($PATH, 0o777)
          - pattern: fsPromises.chmod($PATH, 0o666)

# OPEN REDIRECT

  # 1. Server-side: res.redirect with an unvalidated request value.
  - id: narvy.javascript.openredirect.res-redirect-request-value.res-redirect-request-value
    message: >-
      res.redirect is called with a request-derived value used directly
      as the redirect target, with no allow-list or same-origin check.
      An attacker can craft a link that redirects victims to an
      attacker-controlled domain, useful for phishing after a trusted
      click (CWE-601). Validate that the target is a relative path or
      matches an explicit allow-list of hosts before redirecting.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Open Redirect
      references:
        - https://cwe.mitre.org/data/definitions/601.html
    patterns:
      - pattern-either:
          - pattern: $RES.redirect($REQ.$KIND.$X)
          - pattern: $RES.redirect($CODE, $REQ.$KIND.$X)
          - pattern: |
              $V = $REQ.$KIND.$X
              ...
              $RES.redirect($V)
          - pattern: |
              $V = $REQ.$KIND.$X
              ...
              $RES.redirect($CODE, $V)
      - metavariable-regex:
          metavariable: $KIND
          regex: ^(query|params|body)$
      - pattern-not-inside: |
          if (<... $ALLOWLIST.includes(...) ...>) { ... }
      - pattern-not-inside: |
          if (<... $V.startsWith("/") ...>) { ... }

  # 2. Client-side: location assigned from a URL parameter (DOM open
  #    redirect).
  - id: narvy.javascript.openredirect.dom-location-from-url-param.dom-location-from-url-param
    message: >-
      window.location (or .href) is assigned a value read straight from
      a URL query/hash parameter. A crafted link can point this at an
      attacker-controlled domain, i.e. DOM-based open redirect
      (CWE-601), and depending on how the value reaches the sink this
      can also enable javascript: URI execution. Validate the target is
      a relative, same-origin path before assigning it.
    severity: WARNING
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, dom]
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      vulnerability_class:
        - Open Redirect
    pattern-sources:
      - pattern: new URLSearchParams(location.search).get(...)
      - pattern: new URLSearchParams(window.location.search).get(...)
      - pattern: location.hash
      - pattern: window.location.hash
    pattern-sinks:
      - pattern: window.location = $SINK
      - pattern: window.location.href = $SINK
      - pattern: location.href = $SINK
      - pattern: window.location.assign($SINK)
      - pattern: window.location.replace($SINK)

# PATH TRAVERSAL

  # 1. fs.* sink fed by a path built from request data.
  - id: narvy.javascript.pathtraversal.fs-read-write-tainted-path.fs-read-write-tainted-path
    message: >-
      A filesystem call (readFile/writeFile/unlink/createReadStream) is
      given a path built from request data (path.join with a req.*
      segment, or direct string concatenation). Without validation an
      attacker can supply `../../` sequences to read or write files
      outside the intended directory (CWE-22). Resolve the path with
      path.resolve, then verify it still starts with the intended base
      directory before using it, or reject any segment containing `..`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      technology: [nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Path Traversal
      references:
        - https://cwe.mitre.org/data/definitions/22.html
    patterns:
      - pattern-either:
          - pattern: $FS.readFile(path.join($BASE, $REQ.$KIND.$X), ...)
          - pattern: $FS.readFileSync(path.join($BASE, $REQ.$KIND.$X), ...)
          - pattern: $FS.writeFile(path.join($BASE, $REQ.$KIND.$X), ...)
          - pattern: $FS.writeFileSync(path.join($BASE, $REQ.$KIND.$X), ...)
          - pattern: $FS.unlink(path.join($BASE, $REQ.$KIND.$X), ...)
          - pattern: $FS.unlinkSync(path.join($BASE, $REQ.$KIND.$X))
          - pattern: $FS.createReadStream(path.join($BASE, $REQ.$KIND.$X))
          - pattern: $FS.readFile("$DIR" + $REQ.$KIND.$X, ...)
          - pattern: $FS.readFileSync("$DIR" + $REQ.$KIND.$X)
          - pattern: $FS.readFile(`$DIR${$REQ.$KIND.$X}`, ...)
          - pattern: $FS.readFileSync(`$DIR${$REQ.$KIND.$X}`)
      - metavariable-regex:
          metavariable: $KIND
          regex: ^(query|params|body|headers|cookies)$
      - pattern-not-inside: |
          if (<... $REQ.$KIND.$X.includes("..") ...>) { ... }
      - pattern-not-inside: |
          if (<... !$RESOLVED.startsWith($BASE2) ...>) { ... }
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"

  # 2. res.sendFile with a path built from request data.
  - id: narvy.javascript.pathtraversal.sendfile-tainted-path.sendfile-tainted-path
    message: >-
      res.sendFile is called with a path built from a request field via
      path.join, with no visible containment check. An attacker can
      submit `..` segments in the request field to read files outside
      the served directory (CWE-22). Use `root` option combined with a
      validated, normalized relative path, and reject values containing
      `..`.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      technology: [express, nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Path Traversal
    patterns:
      - pattern: $RES.sendFile(path.join($BASE, $REQ.$KIND.$X), ...)
      - metavariable-regex:
          metavariable: $KIND
          regex: ^(query|params|body)$
      - pattern-not-inside: |
          if (<... $REQ.$KIND.$X.includes("..") ...>) { ... }

# POSTMESSAGE

  - id: narvy.javascript.postmessage.wildcard-target-origin.wildcard-target-origin
    message: >-
      postMessage is called with "*" as the target origin. The message
      is delivered to whatever origin the target window currently has,
      which an attacker can control by first navigating the window/frame
      to their own page. If the message carries a token, session data,
      or any sensitive value, this leaks it to an attacker-controlled
      origin (CWE-346). Pass the exact expected origin instead of "*".
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-346: Origin Validation Error"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, dom]
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      vulnerability_class:
        - Other
      references:
        - https://cwe.mitre.org/data/definitions/346.html
        - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage#security_concerns
    patterns:
      - pattern-either:
          - pattern: $TARGET.postMessage($DATA, "*")
          - pattern: $TARGET.postMessage($DATA, '*')

  - id: narvy.javascript.postmessage.handler-missing-origin-check.handler-missing-origin-check
    message: >-
      A "message" event handler is registered but never checks
      event.origin. Any page that can obtain a reference to this window
      (an iframe it embeds, a window it opened) can send it a message,
      and without an origin check the handler will treat that message as
      trusted (CWE-346). Validate event.origin against an exact expected
      value before acting on event.data.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-346: Origin Validation Error"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, dom]
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      vulnerability_class:
        - Other
    patterns:
      - pattern-either:
          - pattern: |
              window.addEventListener("message", function ($EVT) { ... })
          - pattern: |
              window.addEventListener("message", ($EVT) => { ... })
          - pattern: |
              addEventListener("message", function ($EVT) { ... })
          - pattern: |
              addEventListener("message", ($EVT) => { ... })
      - pattern-not: |
          window.addEventListener("message", function ($EVT) { <... $EVT.origin ...> })
      - pattern-not: |
          window.addEventListener("message", ($EVT) => { <... $EVT.origin ...> })
      - pattern-not: |
          addEventListener("message", function ($EVT) { <... $EVT.origin ...> })
      - pattern-not: |
          addEventListener("message", ($EVT) => { <... $EVT.origin ...> })

# SQL CONCAT

  # Rule 2a: string-concat user input into .query/.execute/.raw (taint); focus $SINK, SQL-looking regex, receiver-scoped.
  - id: narvy.javascript.sqli.user-input-concat-query.user-input-concat-query
    message: >-
      User input from the request flows into a SQL string built by
      CONCATENATION and passed to a query/execute/raw sink. Classic SQL
      injection (CWE-89). Use a parameterized query: pass user input as the
      2nd arg of .query(sql, [params]) or use a query builder / ORM with
      bound parameters.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
        - "A01:2017 - Injection"
      category: security
      subcategory: [vuln]
      technology: [pg, mysql, mysql2, sqlite3, knex, sequelize, typeorm, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Improper Validation
      references:
        - https://cwe.mitre.org/data/definitions/89.html
        - https://owasp.org/www-community/attacks/SQL_Injection
    pattern-sources:
      # Whole request container, so destructuring propagates taint.
      # Receiver name constrained - see PRECISION GUARD 4 above.
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|_req|ctx|httpRequest|httpReq)$
      # Two-level access keeps the pre-taint rule's unconstrained receiver.
      - patterns:
          - pattern: $REQ.$KIND.$X
          - metavariable-regex:
              metavariable: $KIND
              regex: ^(body|params|query|headers|cookies)$
      # AWS Lambda proxy-integration handler event.
      - patterns:
          - pattern: $EVENT.$EKIND
          - metavariable-regex:
              metavariable: $EKIND
              regex: ^(queryStringParameters|pathParameters|multiValueQueryStringParameters|multiValueHeaders)$
      - pattern: JSON.parse($EVENT.body)
      # Raw (unparsed) Lambda body. Receiver pinned to event-shaped names,
      # because a bare `$X.body` also matches an OUTBOUND response body.
      - patterns:
          - pattern: $EVENT.body
          - metavariable-regex:
              metavariable: $EVENT
              regex: ^(event|evt|_event|lambdaEvent|apiEvent)$
    pattern-sanitizers:
      # Numeric coercion makes SQL metacharacters unrepresentable.
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      - pattern: BigInt(...)
      # Driver-provided escaping (mysql/mysql2 escape+escapeId, pg
      # escapeLiteral/escapeIdentifier, SqlString.escape, knex .escape).
      - pattern: escape(...)
      - pattern: $M.escape(...)
      - pattern: $M.escapeId(...)
      - pattern: $M.escapeLiteral(...)
      - pattern: $M.escapeIdentifier(...)
      # Allow-list / validator guards (wrapping-if and negated early-return).
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (<... $ALLOW.includes(...) ...>) { ... }
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$ALLOW.includes($V)) { ... }
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$ALLOW.includes($V)) return ...;
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$RE.test($V)) { ... }
              ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (!$RE.test($V)) return ...;
              ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CONN.query($SINK, ...)
              - pattern: $CONN.execute($SINK, ...)
              - pattern: $CONN.raw($SINK, ...)
          - focus-metavariable: $SINK
          # Concatenation only; the template-literal shape is the sibling
          # rule user-input-template-query.
          - metavariable-pattern:
              metavariable: $SINK
              pattern: $A + $B
          - metavariable-regex:
              metavariable: $SINK
              regex: '(?is).*\b(select|insert|update|delete|drop|alter|create|merge|truncate)\b.*'

  # Rule 2b: template-literal user input into .query/.execute/.raw; tagged templates not matched.
  - id: narvy.javascript.sqli.user-input-template-query.user-input-template-query
    message: >-
      User input from the request is interpolated into a template-literal
      SQL string passed to a query/execute/raw sink. SQL injection (CWE-89).
      Use parameterized queries with positional placeholders ($1, ?).
