          - pattern: $SUBTLE.digest("$ALGO", ...)
          - pattern: $SUBTLE.digest('$ALGO', ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: ^(?i)(sha-?1|md5)$

# WEAK TLS

  - id: narvy.javascript.tls.reject-unauthorized-disabled.reject-unauthorized-disabled
    message: >-
      TLS certificate validation is disabled via `rejectUnauthorized:
      false`. This accepts ANY certificate, including a self-signed one
      presented by an attacker performing a man-in-the-middle attack,
      defeating the entire purpose of TLS (CWE-295). Remove this option;
      if a private/internal CA is in use, add its certificate to the
      trust store (the `ca` option) instead of disabling verification.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
      references:
        - https://cwe.mitre.org/data/definitions/295.html
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.js"
        - "**/*.test.ts"
    patterns:
      - pattern-either:
          - pattern: |
              {..., rejectUnauthorized: false, ...}
          - pattern: 'new https.Agent({..., rejectUnauthorized: false, ...})'
          - pattern: 'new tls.TLSSocket(..., {..., rejectUnauthorized: false, ...})'

  - id: narvy.javascript.tls.node-tls-reject-unauthorized-env-disabled.node-tls-reject-unauthorized-env-disabled
    message: >-
      NODE_TLS_REJECT_UNAUTHORIZED is set to '0' at runtime. This
      disables certificate validation for EVERY TLS connection made by
      the Node process for as long as this remains set, not just one
      request (CWE-295). Remove this and fix the underlying certificate
      problem (add the CA to the trust store, or fix the hostname/cert
      mismatch) instead of disabling verification process-wide.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [nodejs, javascript, typescript]
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0

  - id: narvy.javascript.tls.min-version-pinned-obsolete.min-version-pinned-obsolete
    message: >-
      TLS minVersion (or secureProtocol) is pinned to an obsolete
      protocol (SSLv3 or TLSv1/TLSv1.0/TLSv1.1). These protocol versions
      have known cryptographic weaknesses (POODLE, BEAST) and are
      disallowed by modern compliance baselines (CWE-327). Set minVersion
      to 'TLSv1.2' or 'TLSv1.3'.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      technology: [nodejs, javascript, typescript]
      likelihood: LOW
      impact: MEDIUM
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: |
              {..., minVersion: "$V", ...}
          - pattern: |
              {..., secureProtocol: "$V", ...}
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^(SSLv2|SSLv3|SSLv23_method|TLSv1|TLSv1_method|TLSv1\.0|TLSv1\.1|TLSv1_1_method)$

# XSS DOM

  # Rule 1: innerHTML / outerHTML assignment
  - id: narvy.javascript.xss.dom-innerhtml-assign.dom-innerhtml-assign
    message: >-
      Assignment to `.innerHTML` / `.outerHTML` with a non-literal value.
      The browser parses this value as HTML, so if it contains
      attacker-controlled data this is DOM-based XSS (CWE-79). Use
      `.textContent` for plain text, or sanitize with DOMPurify before
      assigning.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, dom]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.innerHTML = `...`
      - pattern-not: $EL.outerHTML = `...`
      - pattern-not: $EL.innerHTML = ""
      - pattern-not: $EL.innerHTML = $SANITIZER.sanitize(...)
      - pattern-not: $EL.outerHTML = $SANITIZER.sanitize(...)
      # Exclude sanitizer-named calls and SCREAMING_SNAKE_CASE markup constants (naming heuristic, RE2-safe).
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $EL.innerHTML = $SAN(...)
                - pattern: $EL.outerHTML = $SAN(...)
                - pattern: $EL.innerHTML = await $SAN(...)
                - pattern: $EL.outerHTML = await $SAN(...)
            - metavariable-regex:
                metavariable: $SAN
                regex: (?i).*(saniti[sz]|purif|dompurify|xss[_-]?clean|clean[_-]?html|html[_-]?clean|escape[_-]?html|html[_-]?escape|encode[_-]?html|html[_-]?encode|safe[_-]?html|html[_-]?safe).*
      # -- sanitizer-named method call (optionally awaited).
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $EL.innerHTML = $O.$SAN(...)
                - pattern: $EL.outerHTML = $O.$SAN(...)
                - pattern: $EL.innerHTML = await $O.$SAN(...)
                - pattern: $EL.outerHTML = await $O.$SAN(...)
            - metavariable-regex:
                metavariable: $SAN
                regex: (?i).*(saniti[sz]|purif|xss[_-]?clean|clean[_-]?html|html[_-]?clean|escape[_-]?html|html[_-]?escape|encode[_-]?html|html[_-]?encode|safe[_-]?html|html[_-]?safe).*
      # -- module CONSTANT of static markup (SCREAMING_SNAKE_CASE identifier).
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $EL.innerHTML = $CONST
                - pattern: $EL.outerHTML = $CONST
            - metavariable-regex:
                metavariable: $CONST
                regex: ^[A-Z][A-Z0-9]*(_[A-Z0-9]+)+$
      # Exclude static icon/SVG constants and no-input builders (icon/SVG naming) so real data flow still fires.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $EL.innerHTML = $ICONS.$ICO
                - pattern: $EL.outerHTML = $ICONS.$ICO
            - metavariable-regex:
                metavariable: $ICONS
                regex: ^(IC|ICO|ICON|ICONS|Icon|Icons|SVG|SVGS|Svg|Svgs|GLYPH|GLYPHS|Glyph|Glyphs)$
      # Static icon constant concatenated with a string literal:
      # `tag.innerHTML = IC.crown + ' Owner'` (either operand order).
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $EL.innerHTML = $ICONS.$ICO + "..."
                - pattern: $EL.innerHTML = "..." + $ICONS.$ICO
                - pattern: $EL.outerHTML = $ICONS.$ICO + "..."
                - pattern: $EL.outerHTML = "..." + $ICONS.$ICO
            - metavariable-regex:
                metavariable: $ICONS
                regex: ^(IC|ICO|ICON|ICONS|Icon|Icons|SVG|SVGS|Svg|Svgs|GLYPH|GLYPHS|Glyph|Glyphs)$
      # Ternary between two icon constants of the SAME registry object:
      # `btn.innerHTML = muted ? IC.micOff : IC.mic`.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: "$EL.innerHTML = $C ? $ICONS.$A : $ICONS.$B"
                - pattern: "$EL.outerHTML = $C ? $ICONS.$A : $ICONS.$B"
            - metavariable-regex:
                metavariable: $ICONS
                regex: ^(IC|ICO|ICON|ICONS|Icon|Icons|SVG|SVGS|Svg|Svgs|GLYPH|GLYPHS|Glyph|Glyphs)$
      # No-input static icon/SVG builder call, gated on the method name.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $EL.innerHTML = $O.$M(...)
                - pattern: $EL.outerHTML = $O.$M(...)
                - pattern: $EL.innerHTML = $M(...)
                - pattern: $EL.outerHTML = $M(...)
            - metavariable-regex:
                metavariable: $M
                regex: (?i).*(icon|svg|glyph|chevron|arrow|caret|spinner).*

  # Rule 2: insertAdjacentHTML
  - id: narvy.javascript.xss.insert-adjacent-html.insert-adjacent-html
    message: >-
      `insertAdjacentHTML()` with a non-literal HTML fragment. Like
      `innerHTML`, this parses the string as HTML markup. If the fragment
      contains attacker-controlled data this is DOM-based XSS (CWE-79).
      Sanitize with DOMPurify first, or build the DOM with `createElement`
      / `textContent` instead.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, dom]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern: $EL.insertAdjacentHTML($POS, $X)
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: $EL.insertAdjacentHTML($POS, `...`)
      - pattern-not: $EL.insertAdjacentHTML($POS, $SANITIZER.sanitize(...))

  # Rule 3: document.write / document.writeln
  - id: narvy.javascript.xss.document-write.document-write
    message: >-
      `document.write()` / `document.writeln()` with a non-literal argument.
      The string is parsed and injected directly into the page HTML stream.
      If it contains attacker-controlled data this is DOM-based XSS
      (CWE-79). Avoid `document.write`; use DOM APIs with `.textContent`,
      or sanitize the content first.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      technology: [javascript, typescript, dom]
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
    patterns:
      - pattern-either:
          - pattern: document.write($X)
          - pattern: document.writeln($X)
      - pattern-not: document.write("...")
      - pattern-not: document.writeln("...")
      - pattern-not: document.write(`...`)
      - pattern-not: document.writeln(`...`)

