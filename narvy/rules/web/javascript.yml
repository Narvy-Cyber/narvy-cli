      technology: [node-forge, javascript, typescript]
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      vulnerability_class:
        - Cryptographic Issues
    patterns:
      - pattern-either:
          - pattern: $FORGE.md.md5.create()
          - pattern: $FORGE.md.sha1.create()
          - pattern: forge.md.md5.create()
          - pattern: forge.md.sha1.create()

  # Rule 1d: Web Crypto subtle.digest with SHA-1
  - id: narvy.javascript.crypto.weak-hash-web-crypto.weak-hash-web-crypto
    message: >-
      Weak hash SHA-1 used via Web Crypto API (crypto.subtle.digest).
      SHA-1 is collision-broken. Use 'SHA-256' or 'SHA-512' instead.
      CWE-327.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
