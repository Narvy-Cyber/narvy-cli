# Objective-C hardcoded-credential checks.

- id: IOS-OBJC-S-001
  name: "Hardcoded API Key"
  pattern: '(?i)(api[_-]?key|api[_-]?secret)\s*=\s*@"[A-Za-z0-9+/=]{16,}"'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A hardcoded API key or secret token was found. Anyone who reads the source (or a source-available/leaked build) gains unauthorized access to whatever service this key authorizes."
    recommendation: "Do not hardcode credentials. Retrieve them from a secure backend at runtime, or store them in the Keychain if they must persist on-device."

- id: IOS-OBJC-S-002
  name: "Hardcoded Password"
  pattern: '(?i)(password|passwd|pwd)\s*=\s*@"[^"]{6,}"\s*;'
  severity: "CRITICAL"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-259"
    masvs: "MSTG-STORAGE-1"
    description: "A hardcoded password literal may have been found in the source code. Storing credentials directly in source is highly insecure."
    recommendation: "Remove credentials from the code. Prompt the user or retrieve credentials from a secure backend/Keychain instead."

- id: IOS-OBJC-S-003
  name: "Hardcoded Private Key"
  # Require base64 key material after the header, so a bare "-----BEGIN PRIVATE KEY-----" marker constant is not flagged.
  pattern: '-----BEGIN( RSA| EC| OPENSSH| DSA)? PRIVATE KEY-----[\r\n\s]+[A-Za-z0-9+/]{40,}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-321"
    masvs: "MSTG-CRYPTO-1"
    description: "A private key block (e.g. RSA) was found embedded in the code. This completely compromises the security provided by the key."
    recommendation: "Private keys should never ship inside the app bundle or source tree. Use the Keychain/Secure Enclave for on-device key material, or retrieve keys from a secure server at runtime."

- id: IOS-OBJC-S-004
  name: "Hardcoded AWS Access Key ID"
  pattern: 'AKIA[0-9A-Z]{16}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "An AWS Access Key ID was found hardcoded in the app. If paired with its secret key (also often nearby), this grants direct access to whatever AWS resources the key's IAM policy allows."
    recommendation: "Revoke this key in the AWS IAM console immediately, then remove it from the code. Mobile apps should never hold long-lived AWS credentials - use temporary credentials via Cognito Identity Pools or a backend-issued token instead."

- id: IOS-OBJC-S-005
  name: "Hardcoded Stripe Live Secret Key"
  pattern: 'sk_live_[0-9a-zA-Z]{24,}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A Stripe LIVE secret key was found hardcoded in the app. This key can create charges, issue refunds, and read all payment data on the connected Stripe account - a direct financial exposure, not just a data leak."
    recommendation: "Roll this key immediately in the Stripe dashboard. Secret keys must never be shipped client-side; only publishable keys (pk_live_/pk_test_) belong in a mobile app, and all charge/refund logic must run server-side."

- id: IOS-OBJC-S-006
  name: "Hardcoded JWT"
  pattern: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
  severity: "MEDIUM"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A hardcoded JSON Web Token was found. If this is a real, live, long-lived token (as opposed to a test fixture), it grants whatever access its claims allow to anyone who reads the source."
    recommendation: "Confirm whether this is test/fixture data. If it is a real token, revoke it and issue tokens dynamically per-session from the backend instead of embedding one statically."

- id: IOS-OBJC-S-007
  name: "Credentials Embedded in URL"
  pattern: 'https?://[^/\s:]+:[^/\s@"]+@'
  severity: "HIGH"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A URL containing embedded username:password credentials (Basic Auth in the URL itself) was found. These credentials are visible in source, logs, and often browser/proxy history."
    recommendation: "Remove credentials from the URL. Use an Authorization header set at request time from a securely stored credential, or better, an OAuth token flow."
