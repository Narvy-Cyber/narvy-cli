# Android hardcoded-credential checks.

- id: AND-S-001
  name: "Hardcoded API Key"
  pattern: |
    (?i)(api[_-]?key|api[_-]?secret)["\s]*[:=][\s"']*[A-Za-z0-9+/=_-]{16,}
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A hardcoded API key or secret token was found. This allows attackers who can decompile the app to gain unauthorized access to services."
    recommendation: "Do not hardcode credentials. Retrieve them from a secure backend at runtime, or store them encrypted using the Android Keystore system."

- id: AND-S-002
  name: "Hardcoded Password"
  pattern: |
    (?i)(password|passwd|pwd)\s*[:=]\s*"(?!(?:[^"\n]*(?:password|passwd|pwd)[^"\n]*)")[^"\n]{6,}"\s*;
  severity: "CRITICAL"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-259"
    masvs: "MSTG-STORAGE-1"
    description: "A hardcoded password may have been found in the source code. Storing credentials directly in the code is highly insecure."
    recommendation: "Remove credentials from the code. Store them securely using the Android Keystore system."

- id: AND-S-003
  name: "Hardcoded Private Key"
  # Require base64 key material after the header, so a bare "-----BEGIN PRIVATE KEY-----" marker constant is not flagged.
  pattern: '-----BEGIN( RSA| EC| OPENSSH| DSA)? PRIVATE KEY-----[\r\n\s]+[A-Za-z0-9+/]{40,}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-321"
    masvs: "MSTG-CRYPTO-1"
    description: "A private key block (e.g., RSA) was found embedded in the code. This completely compromises the security provided by the key."
    recommendation: "Private keys should never be stored in the application package. Use the Android Keystore for cryptographic operations or retrieve keys from a secure server at runtime."

- id: AND-S-004
  name: "Hardcoded AWS Access Key ID"
  pattern: 'AKIA[0-9A-Z]{16}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "An AWS Access Key ID was found hardcoded in the app. If paired with its secret key (also often nearby), this grants direct access to whatever AWS resources the key's IAM policy allows."
    recommendation: "Revoke this key in the AWS IAM console immediately, then remove it from the code. Mobile apps should never hold long-lived AWS credentials - use temporary credentials via Cognito Identity Pools or a backend-issued token instead."

- id: AND-S-005
  name: "Hardcoded Google API Key"
  pattern: 'AIza[0-9A-Za-z\-_]{35}'
  severity: "HIGH"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A Google API key was found hardcoded in the app. Depending on the API restrictions configured on this key (or lack thereof), this can allow abuse of billed Google Cloud/Maps/Firebase services under the app owner's account."
    recommendation: "Restrict the key to specific APIs and to the app's own signing certificate fingerprint / package name in the Google Cloud Console. Prefer server-side calls for any API that does not require a client-side key."

- id: AND-S-006
  name: "Hardcoded Slack Token"
  pattern: 'xox[baprs]-[0-9A-Za-z-]{10,48}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A Slack API/bot/user token was found hardcoded in the app. This grants whatever access the token's scopes allow within the associated Slack workspace."
    recommendation: "Revoke the token in Slack's app management console and remove it from the app. Slack tokens must never ship inside a client application."

- id: AND-S-007
  name: "Hardcoded Stripe Live Secret Key"
  pattern: 'sk_live_[0-9a-zA-Z]{24,}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A Stripe LIVE secret key was found hardcoded in the app. This key can create charges, issue refunds, and read all payment data on the connected Stripe account - this is a direct financial exposure, not just a data leak."
    recommendation: "Roll this key immediately in the Stripe dashboard. Secret keys must never be shipped client-side; only publishable keys (pk_live_/pk_test_) belong in a mobile app, and all charge/refund logic must run server-side."

- id: AND-S-008
  name: "Hardcoded JWT"
  pattern: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
  severity: "MEDIUM"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A hardcoded JSON Web Token was found. If this is a real, live, long-lived token (as opposed to a test fixture), it grants whatever access its claims allow to anyone who decompiles the app."
    recommendation: "Confirm whether this is test/fixture data. If it is a real token, revoke it and issue tokens dynamically per-session from the backend instead of embedding one statically."

- id: AND-S-009
  name: "Credentials Embedded in URL"
  pattern: 'https?://[^/\s:]+:[^/\s@"]+@'
  severity: "HIGH"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A URL containing embedded username:password credentials (Basic Auth in the URL itself) was found. These credentials are visible in source, logs, and often browser/proxy history."
    recommendation: "Remove credentials from the URL. Use an Authorization header set at request time from a securely stored credential, or better, an OAuth token flow."

- id: AND-S-010
  name: "Hardcoded Encryption/Secret Key Variable"
  pattern: |
    (?i)(?<!#)\w*(key|secret)\w*\s*=\s*"(?!(?:SELECT|INSERT|UPDATE|DELETE)\s)(?!https?://)(?!@\w+/)(?!\w+\[[^\]]*\]")(?!(?:private|public)\s+key"\s*;)(?![a-z0-9_.:\-]+")(?![^"\n]*\\)[^"\n]{8,}"\s*;
  severity: "CRITICAL"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-321"
    masvs: "MSTG-CRYPTO-1"
    description: "A variable named like an encryption or secret key is assigned a hardcoded literal value. If this is genuinely used as a cryptographic key, it is fully recoverable by decompilation."
    recommendation: "Never hardcode cryptographic key material. Derive it via the Android Keystore, or retrieve it from a secure backend at runtime."

- id: AND-S-011
  name: "Hardcoded Bearer Token"
  pattern: |
    (?i)bearer\s+[A-Za-z0-9\-._~+/]{20,}=*
  severity: "HIGH"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A hardcoded Bearer authorization token was found. If live, it grants API access to whatever it authorizes, to anyone who decompiles the app."
    recommendation: "Do not hardcode bearer tokens. Obtain them dynamically via an authenticated login flow and store them using EncryptedSharedPreferences or the Android Keystore."

- id: AND-S-012
  name: "Database Connection String with Embedded Credentials"
  pattern: |
    (?i)jdbc:[a-z]+://[^:/\s]+:[^@/\s]+@
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A JDBC connection string with an embedded username:password was found. A mobile app should not be connecting directly to a database at all - this pattern typically indicates a database exposed to the internet with credentials shipping in every install."
    recommendation: "Remove direct database access from the mobile app entirely. Route all data access through an authenticated backend API."

- id: AND-S-013
  name: "Hardcoded Twilio API Key"
  pattern: 'SK[0-9a-fA-F]{32}'
  severity: "HIGH"
  confidence: "MEDIUM"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A Twilio API Key SID was found hardcoded in the app. Paired with its secret, this allows sending SMS/calls and reading account data billed to the app owner."
    recommendation: "Revoke the key in the Twilio console and move SMS/call operations to a backend service the app authenticates against."

- id: AND-S-014
  name: "Hardcoded GitHub Personal Access Token"
  pattern: 'ghp_[A-Za-z0-9]{36}'
  severity: "CRITICAL"
  confidence: "HIGH"
  details:
    cwe: "CWE-798"
    masvs: "MSTG-STORAGE-1"
    description: "A GitHub Personal Access Token was found hardcoded in the app. This is almost always leftover developer/CI credentials rather than something the app legitimately needs at runtime, and grants access to whatever repos/scopes the token holder has."
    recommendation: "Revoke the token in GitHub Settings > Developer settings immediately and remove it from the source. Rotate any secrets the token could have exposed."
